<html lang="ja">

<meta charset="UTF-8">

<title>操業マスター 〜バイオガスKOBE〜 | 株式会社コベック</title>
<style>
:root{
  --cream:#F6F3EA; --green:#1D5C3C; --leaf:#7CC24E; --blue:#2E7CB8;

}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* スマホのブラウザUI（戻るボタン）が隠れないよう 100svh に収める */
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:

#wrap{position:fixed;left:0;top:0;width:100%;height:100%;height:100svh;
  display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:420px;height:740px;background:var(--cream);overflow:hidden;

.btn.ghost{background:linear-gradient(180deg,#B9F0F7,#55C8DA);color:#14566B;box-shadow:0 3px 0 #26899A}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

table.res td{padding:4px 2px;border-bottom:1px dashed #CFC8B4;text-align:left}

input.code{width:100%;font-size:12px;padding:6px;border-radius:8px;border:2px solid #CFC8B4;font-family:monospace}

<script>
'use strict';
/* file:// やプライベートモード等で localStorage アクセスが例外を投げても
   スクリプトが止まらないようにする安全ラッパ（例外時はメモリ上に退避）。
   これが無いと Safari 等でローカルHTMLを開いた際に真っ白/真っ黒になる。 */
var LS=(function(){
  try{var k='__kobec_probe__';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return window.localStorage;}
  catch(e){var mem={};return{
    getItem:function(k){return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null;},
    setItem:function(k,v){mem[k]=String(v);},
    removeItem:function(k){delete mem[k];}
  };}
})();
/* ================================================================
   操業マスター 〜バイオガスKOBE〜  株式会社コベック デモ
   実データ: 処理60t/日・バイオガス約6,900N㎥/日・メタン約60%
             発電機1,000kW・年間約5,000MWh（約1,500世帯分）
   ================================================================ */

/* ---------- コア（DOM非依存） ---------- */
var CORE = (function(){
  var DAYS = 30;
  var CAPACITY = 60;        // 受入上限 t/日（実データ）
  var STOCK_MAX = 30;       // 場内ストック t
  var HOLDER_MAX = 7000;    // ガスホルダー N㎥
  var BASE_YIELD = 115;     // N㎥/t（60t→約6,900N㎥ 実データ準拠）
  var KWH_PER_NM3 = 2.2;    // 発電換算
  var GEN_MAX_KWH = 24000;  // 1,000kW×24h
  var TARGET_MWH = 410;     // 実績5,000MWh/年の約1ヶ月分
  var SELL_YEN_KWH = 17;    // 売電単価 円/kWh
  var SOURCES = [
    {n:'食品工場（パン）', f:[2,6],  w:[18,30], o:[2,6],  p:[1.1,1.4], t:[14,26]},
    {n:'食品工場（惣菜）', f:[3,8],  w:[35,55], o:[8,16], p:[1.2,1.5], t:[12,22]},
    {n:'コンビニ配送センター', f:[6,14], w:[30,45], o:[4,10], p:[1.3,1.7], t:[9,17]},
    {n:'スーパー（青果）', f:[2,5], w:[55,75], o:[1,3],  p:[0.9,1.2], t:[11,20]},
    {n:'ホテル・宴会場',   f:[8,18], w:[40,60], o:[10,20],p:[1.4,1.8], t:[6,13]},
    {n:'中央卸売市場',     f:[3,7],  w:[50,70], o:[2,5],  p:[1.0,1.3], t:[14,28]},
    {n:'給食センター',     f:[4,9],  w:[45,60], o:[5,10], p:[1.1,1.4], t:[7,14]}
  ];
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function lerp(r,a,b){return a+(b-a)*r}
  function genOffers(rng, day, bigDeal){
    var n = 4 + Math.floor(rng()*3);
    var arr=[];
    for(var i=0;i<n;i++){
      var s = SOURCES[Math.floor(rng()*SOURCES.length)];
      arr.push({
        src:s.n,
        tons:Math.round(lerp(rng(),s.t[0],s.t[1])),
        foreign:+lerp(rng(),s.f[0],s.f[1]).toFixed(1),
        water:Math.round(lerp(rng(),s.w[0],s.w[1])),
        oil:+lerp(rng(),s.o[0],s.o[1]).toFixed(1),
        fee:+lerp(rng(),s.p[0],s.p[1]).toFixed(2)  // 万円/t 処理受託収入
      });
    }
    if(bigDeal){arr.push({src:'【大口】食品メーカー連合',tons:25,foreign:3.5,water:35,oil:6,fee:1.6,big:true});}
    return arr;
  }
  // 受入選択の妥当性
  function acceptedTotal(offers, sel){var t=0;for(var i=0;i<offers.length;i++){if(sel[i])t+=offers[i].tons}return t}
  // 受入品質の加重平均
  function blendQuality(offers, sel){
    var t=0,f=0,w=0,o=0;
    for(var i=0;i<offers.length;i++){ if(!sel[i])continue;
      var x=offers[i]; t+=x.tons; f+=x.foreign*x.tons; w+=x.water*x.tons; o+=x.oil*x.tons; }
    if(t===0)return{tons:0,foreign:0,water:0,oil:0};
    return {tons:t, foreign:f/t, water:w/t, oil:o/t};
  }
  /* 操業計算: 入力{feed,temp,mix,pre} 状態{cond} 品質q 天候rain */
  function computeOperation(inp, cond, q, rain){
    var feed = Math.min(inp.feed, CAPACITY);
    var water = q.water + (rain?8:0);
    var foreignLeft = Math.max(0, q.foreign - inp.pre*3.2);   // 前処理1レベル=異物3.2pt除去
    var tempFactor = Math.max(.55, 1 - Math.abs(inp.temp-37)*.07);
    var mixFactor = [0,0.9,1.0,1.06][inp.mix];
    var waterFactor = Math.max(.6, 1 - Math.max(0,water-45)*.008);
    var oilBonus = 1 + Math.min(q.oil,15)*.012;
    var foreignFactor = Math.max(.55, 1 - foreignLeft*.045);
    var condFactor = .5 + cond/200;
    var gas = feed*BASE_YIELD*tempFactor*mixFactor*waterFactor*oilBonus*foreignFactor*condFactor;
    var methane = 58 + (cond-70)*.09 + (2-Math.abs(inp.temp-37))*.8 + Math.min(q.oil,12)*.12 - foreignLeft*.35;
    methane = Math.max(50, Math.min(66, methane));
    // コンディション変動
    var d = 0;
    if(feed<=50 && Math.abs(inp.temp-37)<=1) d += 3;         // 養生
    if(feed>58) d -= (feed-58)*.9;                            // 過負荷
    d -= foreignLeft*.9;                                      // 異物ダメージ
    if(inp.mix===3) d -= 1.5;
    if(q.oil>12) d -= (q.oil-12)*.5;
    if(inp.temp<35||inp.temp>39) d -= 2;
    var heatCost = Math.max(0,(inp.temp-35))*40 + (rain?60:0); // 加温の自家消費 N㎥
    var preCost = inp.pre*feed*0.008;                          // 前処理費 万円
    return {gas:Math.round(Math.max(0,gas-heatCost)), methane:+methane.toFixed(1),
            condDelta:+d.toFixed(1), preCost:+preCost.toFixed(1), foreignLeft:+foreignLeft.toFixed(1)};
  }
  /* 発電: rate 0-100 */
  function computePower(holder, gas, rate, methane){
    var avail = Math.min(HOLDER_MAX, holder + gas);
    var flared = Math.max(0, holder + gas - HOLDER_MAX);
    var wantKwh = GEN_MAX_KWH * rate/100;
    var effPerNm3 = KWH_PER_NM3 * methane/60;
    var needGas = wantKwh/effPerNm3;
    var usedGas = Math.min(avail, needGas);
    var kwh = usedGas*effPerNm3;
    return {kwh:Math.round(kwh), usedGas:Math.round(usedGas),
            holderAfter:Math.round(avail-usedGas), flared:Math.round(flared),
            sell:+(kwh*SELL_YEN_KWH/10000).toFixed(1)}; // 万円
  }
  /* 投入後の在庫精算: 当日受入+ストックから投入分を引き、残りをストックへ（上限超過は廃棄） */
  function settleFeed(todayIn, stock, feed){
    var pool=todayIn+stock;
    var used=Math.min(pool,Math.max(0,feed));
    var rem=pool-used;
    var wasted=Math.max(0,rem-STOCK_MAX);
    return {stock:+Math.min(STOCK_MAX,rem).toFixed(1), wasted:+wasted.toFixed(1), used:+used.toFixed(1)};
  }
  var RANKS=[
    {r:'S', mwh:385, trust:70, msg:'完璧な操業。実プラント換算で年間5,000MWh級！'},
    {r:'A', mwh:320, trust:55, msg:'優秀な工場長。もう一歩でS！'},
    {r:'B', mwh:240, trust:40, msg:'安定操業。発酵槽の機嫌を読もう。'},
    {r:'C', mwh:0,   trust:0,  msg:'メタン菌はいきもの。焦らずいこう。'}
  ];
  function rankFor(mwh, trust){
    for(var i=0;i<RANKS.length;i++){if(mwh>=RANKS[i].mwh&&trust>=RANKS[i].trust)return RANKS[i]}
    return RANKS[RANKS.length-1];
  }
  var TITLES=[
    {id:'noflare', n:'ガスもったいない大臣', c:'30日間フレアゼロ'},
    {id:'m65',     n:'メタン・マイスター',   c:'メタン濃度65%到達'},
    {id:'trust90', n:'神戸の信頼',           c:'信頼度90到達'},
    {id:'rankS',   n:'伝説の工場長',         c:'Sランククリア'},
    {id:'kansha',  n:'感謝状',               c:'環境局長から感謝状（信頼度80以上で発生）'},
    {id:'full60',  n:'フル受入60',           c:'1日で60t受入'}
  ];
  function checksum(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return h.toString(36)}
  function encodeCode(obj){
    var j=JSON.stringify(obj);
    var b=btoa(unescape(encodeURIComponent(j)));
    return 'KOBEC1.'+b+'.'+checksum(b);
  }
  function decodeCode(code){
    try{
      var p=code.trim().split('.');
      if(p.length!==3||p[0]!=='KOBEC1')return null;
      if(checksum(p[1])!==p[2])return null;
      return JSON.parse(decodeURIComponent(escape(atob(p[1]))));
    }catch(e){return null}
  }
  return {DAYS:DAYS,CAPACITY:CAPACITY,STOCK_MAX:STOCK_MAX,HOLDER_MAX:HOLDER_MAX,
    TARGET_MWH:TARGET_MWH,GEN_MAX_KWH:GEN_MAX_KWH,SELL_YEN_KWH:SELL_YEN_KWH,
    mulberry32:mulberry32,genOffers:genOffers,acceptedTotal:acceptedTotal,
    blendQuality:blendQuality,computeOperation:computeOperation,computePower:computePower,settleFeed:settleFeed,
    rankFor:rankFor,TITLES:TITLES,encodeCode:encodeCode,decodeCode:decodeCode,checksum:checksum};
})();
if(typeof module!=='undefined'&&module.exports){module.exports=CORE;}
if(typeof window!=='undefined'){(function(){

/* roundRect ポリフィル（旧Safari対策） */
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}

/* ---------- 環境 ---------- */
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap');
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=420,CH=360,dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr;cv.height=CH*dpr;cv.style.width=W+'px';cv.style.height=CH+'px';ctx.scale(dpr,dpr);
function fit(){
  /* #wrap は 100svh。innerHeight だとブラウザUIが畳まれた分まで広がってしまう */
  var vw=wrap.clientWidth||innerWidth,vh=wrap.clientHeight||innerHeight;
  var s=Math.min(1.25,Math.min(vw/420,vh/740));stage.style.transform='scale('+s+')';
}
addEventListener('resize',fit);addEventListener('orientationchange',fit);
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
fit();

/* ---------- サウンド ---------- */
var AC=null,muted=LS.getItem('kobec_mute')==='1';
var muteBtn=document.getElementById('muteBtn');
function updMute(){muteBtn.textContent=muted?'✕':'♪'}
updMute();
muteBtn.addEventListener('click',function(){muted=!muted;LS.setItem('kobec_mute',muted?'1':'0');updMute()});
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t,dur,type,vol){
  if(muted)return;var a=ac();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);
  if(t)o.frequency.exponentialRampToValueAtTime(t,a.currentTime+dur);
  g.gain.setValueAtTime(vol||.15,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);
}
var SE={
  click:function(){tone(660,880,.07,'square',.06)},
  accept:function(){tone(520,780,.12,'triangle',.12)},
  deny:function(){tone(220,160,.15,'sawtooth',.08)},
  gas:function(){tone(180,320,.25,'sine',.1)},
  cash:function(){tone(880,1320,.12,'triangle',.12);setTimeout(function(){tone(1100,1560,.1,'triangle',.1)},80)},
  alert:function(){tone(330,250,.2,'square',.1)},
  jingle:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,f,.18,'triangle',.14)},i*110)})},
  bad:function(){[330,262,196].forEach(function(f,i){setTimeout(function(){tone(f,f*.9,.2,'sawtooth',.09)},i*130)})}
};
document.addEventListener('pointerdown',function(){ac()},{once:true});

/* ---------- 画像フォールバック ---------- */
var IMG={};
var mascotSrc={mascot:'assets/mascot_v2.png?v=20260715c',mascot_joy:'assets/mascot_joy.png?v=20260715c',mascot_sad:'assets/mascot_sad.png?v=20260715c',mascot_point:'assets/mascot_point.png?v=20260715c'};
['mascot','mascot_joy','mascot_sad','mascot_point'].forEach(function(n){
  var im=new Image();im.onload=function(){IMG[n]=im};im.src=mascotSrc[n];
});
function loadPlantArt(key,src){var im=new Image();im.onload=function(){IMG[key]=im};im.src=src}
loadPlantArt('plantBg','assets/gameplay/plant_play_bg.jpg');
loadPlantArt('plantAtlas','assets/gameplay/plant_facilities.png');
function drawMetankun(c,x,y,s,mood){

function validRun(g){
  if(!g||typeof g.day!=='number'||g.day<1||g.day>CORE.DAYS)return false;
  if(['accept','operate','power','night','final'].indexOf(g.phase)<0)return false;
  if(!Array.isArray(g.offers)||!Array.isArray(g.sel))return false;
  if(typeof g.money!=='number'||typeof g.mwh!=='number'||typeof g.cond!=='number')return false;
  if((g.phase==='power'||g.phase==='night')&&(!g.lastOp||typeof g.lastOp.gas!=='number'))return false;
  if(g.phase==='night'&&(!g.lastPw||typeof g.lastPw.kwh!=='number'))return false;
  return true;
}

function bar(x,y,w,h,label,v,color){
  ctx.fillStyle='rgba(18,36,27,.6)';ctx.beginPath();ctx.roundRect(x-4,y-3,w+8,h+6,6);ctx.fill();
  ctx.fillStyle='#4A5A50';ctx.fillRect(x+30,y,w-30,h);
  ctx.fillStyle=color;ctx.fillRect(x+30,y,(w-30)*Math.max(0,Math.min(1,v)),h);
  ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.fillText(label,x,y+h-1);
}

/* --- 日次進行 --- */
function startDay(){
  G.rain=G.rainForced||rng()<0.22;G.rainForced=false;
  G.maintDay=!!G.maintNext;G.maintNext=false;
  G.event=null;
  G.offers=CORE.genOffers(rng,G.day,G.bigDeal>0);
  if(G.bigDeal>0)G.bigDeal--;
  G.sel=G.offers.map(function(){return false});
  enterPhase('accept');
}
function enterPhase(ph,restored){
  G.phase=ph;saveRun();
  nextBtn.classList.remove('hidden');
  if(ph==='accept')uiAccept();
  else if(ph==='operate')uiOperate();
  else if(ph==='power')uiPower();
  else if(ph==='night')uiNight();
  else if(ph==='final')uiFinal();
}
/* --- ①受入 --- */

  });

      addFloat('+'+fee.toFixed(1)+'万円',60,270,'#1D5C3C',18);}

/* --- ④夜（イベント＆日次リザルト） --- */
function pickEvent(){
  var ev=[];
  if(G.trust>=80&&!G.kanshaDone&&G.day>=15)return{id:'kansha'};
  if(rng()<.16)ev.push({id:'rainNext'});
  if(rng()<.14&&G.quality.foreign>6)ev.push({id:'claim'});
  if(rng()<.12)ev.push({id:'maint'});
  if(rng()<.14&&G.bigDeal===0)ev.push({id:'bigdeal'});
  if(rng()<.1)ev.push({id:'tvshow'});
  return ev.length?ev[Math.floor(rng()*ev.length)]:null;
}

  };
}
function drawNightMascot(mood){
  var mc=document.createElement('canvas');mc.width=70*dpr;mc.height=70*dpr;
  mc.style.cssText='width:70px;height:70px;position:absolute;right:14px;top:44px';
  var m2=mc.getContext('2d');m2.scale(dpr,dpr);drawMetankun(m2,35,38,64,mood);
  panel.appendChild(mc);
}
/* --- 最終リザルト --- */
function uiFinal(){
  clearRun();
  var rank=CORE.rankFor(G.mwh,G.trust);
  var got=[];
  if(rank.r==='S'&&meta.titles.indexOf('rankS')<0){meta.titles.push('rankS');got.push('伝説の工場長')}
  if(G.noFlare&&meta.titles.indexOf('noflare')<0){meta.titles.push('noflare');got.push('ガスもったいない大臣')}
  if(G.trust>=90&&meta.titles.indexOf('trust90')<0){meta.titles.push('trust90');got.push('神戸の信頼')}
  if(G.mwh>meta.bestMwh){meta.bestMwh=+G.mwh.toFixed(1);meta.bestRank=rank.r}
  saveMeta();
  modalOv.classList.remove('hidden');
  var mc='<canvas id="finalMc" width="'+(120*dpr)+'" height="'+(120*dpr)+'" style="width:120px;height:120px"></canvas>';
  modalOv.innerHTML='<div class="card">'+mc+
  '<div style="font-size:44px;font-weight:bold;color:'+(rank.r==='S'?'#F5A623':'#1D5C3C')+'">'+rank.r+'<span style="font-size:16px"> ランク</span></div>'+
  '<p style="font-size:13px;margin:4px 0 10px">'+rank.msg+'</p>'+
  '<table class="res">'+
  '<tr><td>総発電量</td><td>'+G.mwh.toFixed(1)+' MWh</td></tr>'+
  '<tr><td>世帯換算</td><td>一般家庭 約'+Math.round(G.mwh*1500/5000*12).toLocaleString('ja-JP')+'世帯の1ヶ月分の電気</td></tr>'+
  '<tr><td>収支</td><td>'+fmt(G.money)+' 万円</td></tr>'+
  '<tr><td>CO2削減(推計)</td><td>'+G.co2.toFixed(1)+' t-CO2</td></tr>'+
  '<tr><td>最高メタン濃度</td><td>'+G.maxMethane.toFixed(1)+' %</td></tr>'+
  '<tr><td>信頼度</td><td>'+G.trust.toFixed(0)+' / 100</td></tr></table>'+
  '<div class="note" style="text-align:left">日別発電量(MWh)の推移</div>'+
  '<canvas id="spark" style="width:296px;height:56px;background:#EFEADD;border-radius:8px"></canvas>'+
  (got.length?'<div>'+got.map(function(n){return '<span class="title-chip">'+n+'</span>'}).join('')+'</div>':'')+
  '<p class="note" style="margin:8px 0">実際のバイオガスKOBEは年間約5,000MWh＝一般家庭約1,500世帯分を発電しています。</p>'+
  '<button class="btn primary" id="finalBtn">タイトルへ</button></div>';
  var f2=document.getElementById('finalMc').getContext('2d');f2.scale(dpr,dpr);
  drawMetankun(f2,60,64,110,rank.r==='C'?'sad':'joy');
  var sc=document.getElementById('spark');
  if(sc&&G.history.length){
    sc.width=296*dpr;sc.height=56*dpr;
    var s2=sc.getContext('2d');s2.scale(dpr,dpr);
    var bw=296/G.history.length;
    for(var hi=0;hi<G.history.length;hi++){
      var hv=Math.max(0,Math.min(1,G.history[hi].mwh/24));
      s2.fillStyle=hv>=0.55?'#F5A623':'#8FA396';
      s2.fillRect(hi*bw+1,56-hv*52-2,Math.max(1.5,bw-2),hv*52+2);
    }
  }
  if(rank.r!=='C'){SE.jingle();for(var i=0;i<5;i++)setTimeout(function(){burst(60+Math.random()*300,120+Math.random()*140,['#F5A623','#7CC24E','#3EC8E0'][Math.floor(Math.random()*3)],16)},i*180)}
  else SE.bad();
  document.getElementById('finalBtn').addEventListener('click',function(){
    SE.click();modalOv.classList.add('hidden');G=null;showTitle();
  });
  nextBtn.classList.add('hidden');
}

/* ---------- ループ ---------- */
var last=0,paused=false;
function loop(t){
  var dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(!paused)drawPlant(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',function(){
  paused=document.hidden;
  if(document.hidden&&G&&G.phase!=='final'){saveRun()}
});
addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!nextBtn.classList.contains('hidden'))nextBtn.click();
});
showTitle();
})();}
</script>
</body>
