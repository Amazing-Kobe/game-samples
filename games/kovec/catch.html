<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>もぐもぐキャッチ！ | バイオガスKOBE（株式会社コベック）</title>
<style>
:root{
  --cream:#F6F3EA; --green:#1D5C3C; --leaf:#7CC24E; --blue:#2E7CB8;
  --orange:#F5A623; --cyan:#3EC8E0; --ink:#24332B;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* スマホのブラウザUI（戻るボタン）が隠れないよう、
   ゲーム画面は「ツールバー表示時の高さ = 100svh」に収める。
   overscroll-behavior:none でラバーバンドによるツールバー畳み込みも防ぐ。 */
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  background:
    linear-gradient(rgba(220,251,255,.38),rgba(117,212,222,.28)),
    url('assets/card_catch.jpg') center/cover no-repeat #AEE9F2;
  font-family:'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','BIZ UDGothic',sans-serif;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;
  position:fixed;inset:0;height:100%;height:100svh;
}
#stage{width:420px;height:740px;position:relative;flex:none;transform-origin:center center;}
#game{width:420px;height:740px;display:block;touch-action:none;border-radius:14px;box-shadow:0 12px 34px rgba(15,103,119,.22);}
.hidden{display:none !important;}
.overlay{position:absolute;inset:0;border-radius:14px;overflow:hidden;z-index:10;}

/* ---- 常設UI ---- */
#backLink{
  position:absolute;top:12px;left:12px;z-index:30;
  color:#14566B;text-decoration:none;font-size:14px;font-weight:800;
  background:rgba(255,255,255,.86);border:1.5px solid rgba(255,255,255,.94);
  padding:7px 14px;border-radius:999px;line-height:1;
}
#backLink:active{transform:scale(.94);}
#muteBtn{
  position:absolute;top:12px;right:12px;z-index:30;
  width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.94);
  background:rgba(255,255,255,.86);cursor:pointer;padding:0;color:#14566B;
  display:flex;align-items:center;justify-content:center;
}
#muteBtn:active{transform:scale(.9);}
#muteBtn svg{width:22px;height:22px;}
#muteBtn .icoOff{display:none;}
#muteBtn.muted .icoOn{display:none;}
#muteBtn.muted .icoOff{display:block;}

/* ---- タイトル ---- */
#title{display:flex;flex-direction:column;align-items:center;z-index:20;
  background:
    linear-gradient(180deg,rgba(255,255,255,.03) 0%,rgba(191,240,244,.18) 50%,rgba(34,135,151,.38) 100%),
    url('assets/card_catch.jpg') 62% center/cover no-repeat #AEE9F2;}
.badge{
  margin-top:60px;font-size:13px;font-weight:800;letter-spacing:.14em;
  color:#14566B;background:rgba(255,255,255,.88);padding:6px 18px;border-radius:999px;
  border:1px solid rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(18,99,113,.16);
}
#logo{margin-top:14px;text-align:center;animation:logoIn .8s cubic-bezier(.2,1.6,.4,1) both;}
#logo .title-logo{display:block;width:370px;max-width:94%;height:auto;margin:0 auto -2px;
  filter:drop-shadow(0 9px 14px rgba(3,34,86,.34));}
#logo p{
  margin-top:10px;font-size:15px;font-weight:800;color:#14566B;letter-spacing:.14em;
  background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);border-radius:999px;padding:5px 15px;display:inline-block;
}
@keyframes logoIn{0%{transform:scale(.4) rotate(-4deg);opacity:0;}100%{transform:scale(1);opacity:1;}}
#titleMascot{display:none;position:absolute;right:10px;bottom:214px;width:170px;height:170px;pointer-events:none;
  filter:drop-shadow(0 8px 10px rgba(29,92,60,.35));animation:floaty 3s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-12px) rotate(2deg);}}
#titleStats{
  position:absolute;left:16px;bottom:242px;display:flex;flex-direction:column;gap:8px;
}
.statChip{
  color:#14566B;font-size:13px;font-weight:800;
  background:rgba(255,255,255,.86);border:1.5px solid rgba(255,255,255,.95);
  padding:7px 13px;border-radius:12px;
}
.statChip b{color:#ffe27a;font-size:17px;margin-left:6px;}
#titleBtns{position:absolute;left:0;right:0;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:13px;}
.btn{
  font-family:inherit;border:none;cursor:pointer;font-weight:800;border-radius:999px;
  color:#7a4d00;
  background:linear-gradient(180deg,#ffd97c 0%,var(--orange) 60%,#e08f07 100%);
  box-shadow:0 5px 0 #a86a00, 0 8px 14px rgba(36,51,43,.3);
  transition:transform .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a86a00;}
.btn.sub{
  color:#0d4d5c;
  background:linear-gradient(180deg,#a6ecf7 0%,var(--cyan) 60%,#1fa9c4 100%);
  box-shadow:0 5px 0 #147890, 0 8px 14px rgba(36,51,43,.3);
}
.btn.sub:active{box-shadow:0 1px 0 #147890;}
#btnStart{font-size:23px;padding:18px 52px;animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
#btnStart:active{animation:none;transform:translateY(4px);}
.btnRow{display:flex;gap:12px;}
.btnRow .btn{font-size:15px;padding:12px 22px;}
#titleCredit{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.74);letter-spacing:.08em;text-shadow:0 1px 3px #000;}

/* ---- チュートリアル ---- */
#tutorial{background:linear-gradient(180deg,rgba(91,207,218,.96),rgba(179,238,220,.97));z-index:22;cursor:pointer;}
#tutTitleTxt{position:absolute;top:100px;left:0;right:0;text-align:center;color:#ffe27a;font-size:22px;font-weight:800;letter-spacing:.2em;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink);}
#tutSkip{
  position:absolute;top:62px;right:14px;font-size:13px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.4);
  border-radius:999px;padding:7px 16px;cursor:pointer;font-family:inherit;
}
#tutBubbleWrap{position:absolute;left:22px;right:22px;top:168px;}
#tutBubble{
  background:#fff;color:var(--ink);border-radius:20px;padding:22px 20px;
  font-size:18px;font-weight:700;line-height:1.8;
  box-shadow:0 8px 20px rgba(0,0,0,.35);position:relative;
  animation:bubbleIn .3s cubic-bezier(.2,1.6,.4,1) both;
}
#tutBubble::after{
  content:'';position:absolute;right:56px;bottom:-16px;
  border:14px solid transparent;border-top:20px solid #fff;border-bottom:0;
}
@keyframes bubbleIn{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
#tutBubble em{font-style:normal;color:#d6224c;font-weight:800;}
#tutBubble strong{color:#0d7a44;}
#tutDots{margin-top:18px;text-align:center;}
#tutDots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);margin:0 5px;}
#tutDots i.on{background:var(--orange);}
#tutMascot{position:absolute;right:8px;bottom:30px;width:220px;height:220px;pointer-events:none;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.4));animation:floaty 2.6s ease-in-out infinite;}
#tutTap{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:14px;font-weight:700;opacity:.92;animation:pulse 1.2s infinite;}

/* ---- ずかん ---- */
#zukan{background:rgba(86,190,197,.90);z-index:24;display:flex;flex-direction:column;align-items:center;}
#zukanPanel{
  margin-top:56px;width:390px;max-height:628px;background:var(--cream);border-radius:22px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;
  border:4px solid var(--green);
}
#zukanHead{
  background:linear-gradient(180deg,#2a7a51,var(--green));color:#fff;text-align:center;
  font-size:21px;font-weight:800;padding:13px;letter-spacing:.24em;position:relative;flex:none;
}
#zukanHead small{display:block;font-size:10px;letter-spacing:.1em;color:#a9e8f2;margin-top:2px;}
#zukanGrid{overflow-y:auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.zCell{background:#fff;border-radius:14px;padding:10px 8px;text-align:center;border:2px solid #dfd8c2;min-height:136px;}
.zCell.rare{border-color:var(--orange);background:#fffaf0;}
.zCell.locked{background:#e9e6dc;color:#9a968a;}
.zCell canvas{width:64px;height:64px;display:block;margin:0 auto;}
.zCell .zName{font-size:13px;font-weight:800;color:var(--green);margin-top:2px;}
.zCell.locked .zName{color:#8a8578;}
.zCell .zNo{font-size:10px;font-weight:800;color:#b1a887;}
.zCell .zTrivia{font-size:10px;line-height:1.55;color:#5f6a55;margin-top:4px;}
#zukanClose{flex:none;margin:12px auto 14px;font-size:15px;padding:11px 44px;}

/* ---- リザルト ---- */
#over{background:rgba(78,177,187,.68);z-index:26;display:flex;align-items:center;justify-content:center;}
#overPanel{
  width:348px;background:var(--cream);border-radius:24px;border:4px solid var(--green);
  box-shadow:0 14px 34px rgba(0,0,0,.5);text-align:center;padding:18px 18px 18px;
  animation:bubbleIn .4s cubic-bezier(.2,1.6,.4,1) both;position:relative;
}
#overPanel h2{font-size:28px;font-weight:800;color:var(--green);letter-spacing:.08em;}
#overMascot{width:118px;height:118px;margin-top:4px;filter:drop-shadow(0 5px 6px rgba(29,92,60,.25));}
#newBestBadge{
  position:absolute;top:14px;right:14px;background:#e5527f;color:#fff;
  font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px;transform:rotate(8deg);
  box-shadow:0 3px 6px rgba(0,0,0,.3);animation:pulse 1s infinite;
}
.overRow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid #dfd8c2;border-radius:12px;padding:7px 14px;margin-top:7px;}
.overRow span{font-size:13px;font-weight:800;color:#7c8a70;}
.overRow b{font-size:21px;color:var(--green);}
.overRow b.amber{color:#c07f04;}
.overRow b.blue{color:var(--blue);}
#overTip{font-size:11px;color:#5f6a55;margin-top:9px;line-height:1.6;}
#overBtns{display:flex;gap:10px;justify-content:center;margin-top:12px;}
#btnRetry{font-size:18px;padding:14px 30px;}
#btnTitle{font-size:14px;padding:14px 20px;}
@media print{
  body{background:#fff;}
  #backLink,#muteBtn{display:none;}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="420" height="740"></canvas>

  <a id="backLink" href="index.html">← もどる</a>
  <button id="muteBtn" aria-label="サウンド切替">
    <svg class="icoOn" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="#3EC8E0" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="icoOff" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#9fb3a6"/><path d="M16 9l6 6M22 9l-6 6" stroke="#F5A623" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <div id="title" class="overlay">
    <div class="badge">バイオガスKOBE</div>
    <div id="logo">
      <img class="title-logo" src="assets/titles/mogumogu-catch.png" alt="もぐもぐキャッチ！">
      <p>神戸から始めるECOLOGY</p>
    </div>
    <canvas id="titleMascot" width="340" height="340"></canvas>
    <div id="titleStats">
      <div class="statChip">ベスト<b id="titleBestVal">0</b></div>
      <div class="statChip">まちのあかり<b id="titleLightsVal">0</b></div>

    <div id="titleBtns">
      <button id="btnStart" class="btn">タップではじめる</button>
      <div class="btnRow">
        <button id="btnHow" class="btn sub">あそびかた</button>
        <button id="btnZukan" class="btn sub">もぐもぐずかん</button>
      </div>
    </div>
    <div id="titleCredit">株式会社コベック「バイオガスKOBE」公式ミニゲーム（デモ版）</div>
  </div>

  <div id="tutorial" class="overlay hidden">
    <div id="tutTitleTxt">あそびかた</div>

    <div id="tutBubbleWrap">
      <div id="tutBubble"></div>
      <div id="tutDots"><i></i><i></i><i></i></div>
    </div>

    <div id="tutTap">タップですすむ ▶</div>
  </div>

  <div id="zukan" class="overlay hidden">
    <div id="zukanPanel">
      <div id="zukanHead">もぐもぐずかん<small>バイオガスKOBE たべもののごみ ずかん</small></div>
      <div id="zukanGrid"></div>
      <button id="zukanClose" class="btn">とじる</button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div id="overPanel">
      <div id="newBestBadge" class="hidden">しんきろく！</div>
      <h2 id="overHead">おしまい！</h2>
      <canvas id="overMascot" width="236" height="236"></canvas>
      <div class="overRow"><span>スコア</span><b id="overScore">0</b></div>
      <div class="overRow"><span>ベスト</span><b class="amber" id="overBest">0</b></div>
      <div class="overRow"><span>ずかん</span><b id="overZukan">0/10</b></div>
      <div class="overRow"><span>まちのあかり</span><b class="blue" id="overLights">0</b></div>

      </div>
    </div>

</div>

<script>
'use strict';
/* =====================================================
   CatchCore — DOM非依存のゲームコア
   スコア計算・コンボ・レベル進行・図鑑・セーブ直列化。
   node でそのまま require してヘッドレステスト可能。
   ===================================================== */
var CatchCore = (function () {

  var TANK_MAX = 60;   /* バイオガスKOBEの処理規模 60t/日 にちなむ */
  var LIFE_MAX = 3;
  var RARE_RATE = 0.02;

  var ITEMS = [
    {id:'yasai',  name:'やさいくず',   kind:'good', pts:10,  tank:6,
     desc:'キャベツのそとがわも りっぱな エネルギーのもと！'},
    {id:'ringo',  name:'りんごのしん', kind:'good', pts:15,  tank:6,
     desc:'たべのこしも タンクのなかで ガスにへんしん！'},
    {id:'pan',    name:'パンのみみ',   kind:'good', pts:10,  tank:5,
     desc:'パンやさんからも ごみが とどくよ。'},
    {id:'bento',  name:'おべんとう',   kind:'good', pts:30,  tank:10,
     desc:'コンビニの きげんぎれべんとうも だいかんげい！'},
    {id:'gyunyu', name:'ぎゅうにゅう', kind:'good', pts:20,  tank:8,
     desc:'のみのこしの ぎゅうにゅうも エネルギーに なるんだ。'},
    {id:'kan',    name:'カン',         kind:'bad',  pts:0,   tank:0,
     desc:'カンは たべられへん！ リサイクルばこへ どうぞ。'},
    {id:'bin',    name:'ビン',         kind:'bad',  pts:0,   tank:0,
     desc:'ビンが まざると きかいが こしょうしちゃう。'},
    {id:'pet',    name:'ペットボトル', kind:'bad',  pts:0,   tank:0,
     desc:'ペットボトルは べつのリサイクルへ。ぶんべつが だいじ！'},
    {id:'denchi', name:'でんち',       kind:'bad',  pts:0,   tank:0,
     desc:'でんちは キケン！ ぜったいに まぜないでね。'},
    {id:'kinbanana', name:'きんのバナナ', kind:'good', pts:100, tank:20, rare:true,
     desc:'でんせつの バナナのかわ。メタン60%の ちょうごうきゅうひん！'}
  ];

  function itemById(id){
    for (var i=0;i<ITEMS.length;i++) if (ITEMS[i].id===id) return ITEMS[i];
    return null;
  }

  /* コンボ倍率 ×1〜×4 */
  function comboMultiplier(combo){
    if (combo >= 20) return 4;
    if (combo >= 10) return 3;
    if (combo >= 5)  return 2;
    return 1;
  }

  /* レベルごとの難度（Lv1ゆっくり・悪物10% → 悪物は35%上限） */
  function levelParams(level){
    var lv = Math.max(1, level|0);
    return {
      speed: Math.min(150 + 42*(lv-1), 400),          /* 落下速度 px/s */
      spawnInterval: Math.max(1.05 - 0.09*(lv-1), 0.48),
      badRate: Math.min(0.10 + 0.0625*(lv-1), 0.35)
    };
  }

  /* 1プレイぶんの状態 */
  function newRunState(){
    return {
      score:0, combo:0, maxCombo:0,
      life:LIFE_MAX, tank:0, level:1,
      caught:{}, lightsRun:0
    };
  }

  /* キャッチ判定の適用。戻り値はイベント記述 */
  function applyCatch(state, itemId){
    var it = itemById(itemId);
    if (!it) return {ok:false};
    if (it.kind === 'good'){
      state.combo += 1;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;
      var mult = comboMultiplier(state.combo);
      var gained = it.pts * mult;
      state.score += gained;
      state.tank = Math.min(TANK_MAX, state.tank + it.tank);
      var isNew = !state.caught[itemId];
      state.caught[itemId] = (state.caught[itemId]||0) + 1;
      return {ok:true, kind:'good', gained:gained, mult:mult,
              tankFull: state.tank >= TANK_MAX, isNew:isNew, rare:!!it.rare};
    }
    /* 悪物: ライフ-1・コンボ切れ（図鑑には載る） */
    state.combo = 0;
    state.life -= 1;
    var isNewBad = !state.caught[itemId];
    state.caught[itemId] = (state.caught[itemId]||0) + 1;
    return {ok:true, kind:'bad', gained:0, mult:1,
            tankFull:false, isNew:isNewBad, gameOver: state.life <= 0};
  }

  /* 取り逃し。良を逃すとコンボ切れのみ（ライフは減らない） */
  function applyMiss(state, itemId){
    var it = itemById(itemId);
    if (it && it.kind === 'good'){
      state.combo = 0;
      return {comboBroken:true};
    }
    return {comboBroken:false};
  }

  /* はつでんタイムであかりを1つ点ける */
  function applyLight(state, save){
    state.lightsRun += 1;
    state.score += 50;
    if (save) save.lights = (save.lights|0) + 1;
    return {gained:50, total: save ? save.lights : state.lightsRun};
  }

  /* はつでんタイム終了 → レベルアップ */
  function finishHatsuden(state){
    state.level += 1;
    state.tank = 0;
    return {level: state.level};
  }

  /* 落下物の抽選（rng は 0..1 を返す関数、テスト用に注入可能） */
  function pickDrop(level, rng){
    rng = rng || Math.random;
    var p = levelParams(level);
    if (rng() < RARE_RATE) return 'kinbanana';
    var goods = ['yasai','ringo','pan','bento','gyunyu'];
    var bads  = ['kan','bin','pet','denchi'];
    if (rng() < p.badRate) return bads[Math.floor(rng()*bads.length) % bads.length];
    return goods[Math.floor(rng()*goods.length) % goods.length];
  }

  /* ---- セーブ（kobec_catch_save）---- */
  function defaultSave(){
    return {v:1, best:0, lights:0, plays:0, zukan:[]};
  }
  function mergeZukan(save, caughtMap){
    for (var id in caughtMap){
      if (caughtMap.hasOwnProperty(id) && save.zukan.indexOf(id) === -1) save.zukan.push(id);
    }
    return save.zukan.length;
  }
  function serializeSave(save){
    return JSON.stringify({
      v:1,
      best: save.best|0,
      lights: save.lights|0,
      plays: save.plays|0,
      zukan: (save.zukan||[]).filter(function(id){ return !!itemById(id); })
    });
  }
  function deserializeSave(str){
    var d = defaultSave();
    if (typeof str !== 'string' || !str) return d;
    try{
      var o = JSON.parse(str);
      if (!o || typeof o !== 'object') return d;
      d.best   = (typeof o.best   === 'number' && o.best   >= 0) ? Math.floor(o.best)   : 0;
      d.lights = (typeof o.lights === 'number' && o.lights >= 0) ? Math.floor(o.lights) : 0;
      d.plays  = (typeof o.plays  === 'number' && o.plays  >= 0) ? Math.floor(o.plays)  : 0;
      if (Object.prototype.toString.call(o.zukan) === '[object Array]'){
        d.zukan = o.zukan.filter(function(id){ return typeof id==='string' && !!itemById(id); });
      }
      return d;

          c.moveTo(0,-4); c.quadraticCurveTo(1,-1,4,0); c.quadraticCurveTo(1,1,0,4);
          c.quadraticCurveTo(-1,1,-4,0); c.quadraticCurveTo(-1,-1,0,-4);
          c.closePath(); c.fill(); c.restore();
        }
        break;

  }

  /* ---- 演出システム（パーティクル・浮きスコア・シェイク） ---- */
  var particles = [], floaters = [], shakeT = 0, shakeMag = 0;
  function burst(x, y, color, n, speed, life){
    for (var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, v = (0.4+Math.random()*0.6)*(speed||160);
      particles.push({
        x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 60,
        r: 2.5+Math.random()*3.5, color:color,
        life:(life||0.6)*(0.7+Math.random()*0.6), t:0
      });
    }
  }
  function sparkle(x, y, n){
    for (var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, v = 40+Math.random()*140;
      particles.push({
        x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 90,
        r: 2+Math.random()*3, color:'#ffe27a', star:true,
        life:0.8+Math.random()*0.5, t:0
      });
    }
  }
  function floatText(x, y, txt, color, big){
    floaters.push({x:x, y:y, txt:txt, color:color||'#1D5C3C', t:0, life:0.9, big:!!big});
  }
  function shake(mag, dur){ shakeMag = Math.max(shakeMag, mag); shakeT = Math.max(shakeT, dur); }
  function updateFx(dt){
    for (var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.t += dt;
      if (p.t >= p.life){ particles.splice(i,1); continue; }
      p.vy += 420*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    }
    for (var j=floaters.length-1;j>=0;j--){
      var f = floaters[j];
      f.t += dt;
      if (f.t >= f.life){ floaters.splice(j,1); continue; }
      f.y -= 60*dt;
    }
    if (shakeT > 0) shakeT -= dt;
  }
  function drawFx(c){
    for (var i=0;i<particles.length;i++){
      var p = particles[i], k = 1 - p.t/p.life;
      c.globalAlpha = k;
      c.fillStyle = p.color;
      if (p.star){
        c.save(); c.translate(p.x,p.y); c.rotate(p.t*6);
        c.beginPath();
        c.moveTo(0,-p.r*2); c.quadraticCurveTo(p.r*0.5,-p.r*0.5,p.r*2,0);
        c.quadraticCurveTo(p.r*0.5,p.r*0.5,0,p.r*2);
        c.quadraticCurveTo(-p.r*0.5,p.r*0.5,-p.r*2,0);
        c.quadraticCurveTo(-p.r*0.5,-p.r*0.5,0,-p.r*2);
        c.closePath(); c.fill(); c.restore();
      }else{
        c.beginPath(); c.arc(p.x, p.y, p.r*k+1, 0, Math.PI*2); c.fill();
      }
    }
    c.globalAlpha = 1;
    for (var j=0;j<floaters.length;j++){
      var f = floaters[j], kk = 1 - f.t/f.life;
      var pop = f.t < 0.15 ? (f.t/0.15) : 1;
      c.globalAlpha = Math.min(1, kk*2);
      c.font = 'bold ' + Math.round((f.big?30:21)*(0.6+0.4*pop)) + 'px sans-serif';
      c.textAlign = 'center';
      c.lineWidth = 5; c.lineJoin='round'; c.strokeStyle = '#fff';
      c.strokeText(f.txt, f.x, f.y);
      c.fillStyle = f.color;
      c.fillText(f.txt, f.x, f.y);
    }
    c.globalAlpha = 1;
  }

    drops.push({
      id:id, kind:it.kind, rare:!!it.rare,

      y: -30,

      sway: Math.random()*Math.PI*2

  function onCatch(d){
    var ev = CatchCore.applyCatch(run, d.id);
    if (!ev.ok) return;
    if (ev.kind === 'good'){
      truck.mouth = 1;
      if (ev.rare){
        sfx.kiran();
        sparkle(d.x, TRUCK_Y - 10, 26);
        floatText(d.x, TRUCK_Y - 46, '+' + ev.gained + '!!', '#c07f04', true);
        floatText(W/2, 200, 'きんのバナナ！', '#c07f04', true);
        shake(4, 0.22);
      }else{
        sfx.mogu();
        burst(d.x, TRUCK_Y - 6, '#7CC24E', 12, 170, 0.55);
        burst(d.x, TRUCK_Y - 6, '#bdf3fb', 6, 120, 0.45);
        floatText(d.x, TRUCK_Y - 40, '+' + ev.gained, '#1D5C3C', ev.mult >= 3);
      }
      if (ev.mult > 1){
        floatText(d.x, TRUCK_Y - 70, 'コンボ ×' + ev.mult, '#2E7CB8', false);
      }
      if (ev.isNew){
        sfx.kiran();
        floatText(W/2, 260, 'ずかんに とうろく！', '#e5527f', false);
      }
      if (ev.tankFull) startHatsuden();
    }else{
      sfx.boo();
      shake(7, 0.3);
      truck.mood = 'sad'; truck.moodT = 1.1;
      burst(d.x, TRUCK_Y - 6, '#e5527f', 10, 150, 0.5);
      floatText(d.x, TRUCK_Y - 44, 'これは たべられへん！', '#d6224c', false);

  function endRun(){
    CatchCore.mergeZukan(save, run.caught);

  }

  /* ---- 更新 ---- */
  function update(dt){
    elapsed += dt;
    updateFx(dt);
    truck.mouth = Math.max(0, truck.mouth - dt*4);
    if (truck.moodT > 0){
      truck.moodT -= dt;
      if (truck.moodT <= 0) truck.mood = 'normal';
    }
    if (mode === 'play'){
      /* 移動（キー＋ポインタ目標へイージング） */
      if (keyL) truck.target -= 340*dt;
      if (keyR) truck.target += 340*dt;
      truck.target = Math.max(58, Math.min(W-58, truck.target));
      truck.x += (truck.target - truck.x) * Math.min(1, dt*12);
      /* 出現 */
      spawnT -= dt;
      if (spawnT <= 0){
        spawnDrop();
        spawnT = CatchCore.levelParams(run.level).spawnInterval * (0.8 + Math.random()*0.4);
      }
      /* 落下・判定 */
      for (var i=drops.length-1;i>=0;i--){
        var d = drops[i];
        d.y += d.vy*dt;
        d.rot += d.vrot*dt;
        d.x += Math.sin(elapsed*2 + d.sway) * 14 * dt;
        if (d.y >= TRUCK_Y - 14 && d.y <= TRUCK_Y + 26 && Math.abs(d.x - truck.x) <= CATCH_HALF){
          drops.splice(i,1); onCatch(d);
          /* onCatch で はつでんタイム移行（drops 再代入）や
             ゲームオーバーが起きたら走査を安全に打ち切る */
          if (mode !== 'play') break;
          continue;
        }
        if (d.y > H - 70){
          drops.splice(i,1);
          var mev = CatchCore.applyMiss(run, d.id);
          if (mev.comboBroken && run.maxCombo >= 2){
            floatText(d.x, H-110, 'コンボきれ…', '#7c8a70', false);
          }
          if (d.kind === 'bad'){
            burst(d.x, H-84, '#9fb3a6', 5, 90, 0.4);
          }else{
            burst(d.x, H-84, '#c9c2a8', 5, 90, 0.4);
          }
        }
      }
    }else if (mode === 'hatsuden'){
      hatsuden.banner -= dt;
      hatsuden.t -= dt;
      if (hatsuden.t <= 0) finishHatsudenMode();
    }
  }

  /* ---- HUD ---- */
  function drawHUD(c){
    /* スコア */
    c.textAlign = 'center';
    c.font = 'bold 34px sans-serif';
    c.lineWidth = 6; c.lineJoin = 'round';
    c.strokeStyle = '#fff'; c.strokeText(String(run.score), W/2, 92);
    c.fillStyle = '#1D5C3C'; c.fillText(String(run.score), W/2, 92);
    c.font = 'bold 12px sans-serif';
    c.fillStyle = 'rgba(29,92,60,0.75)';
    c.fillText('スコア', W/2, 108);
    /* コンボ */
    if (run.combo >= 2){
      var mult = CatchCore.comboMultiplier(run.combo);
      var cs = 1 + Math.min(0.25, run.combo*0.01);
      c.save();
      c.translate(W/2, 142); c.scale(cs, cs);
      c.font = 'bold 22px sans-serif';
      c.lineWidth = 5; c.strokeStyle = '#fff';
      c.strokeText(run.combo + 'コンボ ×' + mult, 0, 0);
      c.fillStyle = mult >= 3 ? '#F5A623' : '#2E7CB8';
      c.fillText(run.combo + 'コンボ ×' + mult, 0, 0);
      c.restore();
    }
    /* ライフ（ハート） */
    for (var i=0;i<CatchCore.LIFE_MAX;i++){
      var hx = 26 + i*30, hy = 76;
      c.save(); c.translate(hx, hy);
      var on = i < run.life;
      c.fillStyle = on ? '#e5527f' : 'rgba(36,51,43,0.18)';
      c.beginPath();
      c.moveTo(0, 5);
      c.bezierCurveTo(-12, -6, -5, -15, 0, -7);
      c.bezierCurveTo(5, -15, 12, -6, 0, 5);
      c.closePath(); c.fill();
      if (on){ c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
      c.restore();
    }
    /* タンクゲージ（右端 縦・60t） */
    var gx = W-34, gy = 170, gw = 20, gh = 200;
    c.fillStyle = 'rgba(255,255,255,0.75)';
    rr(c, gx-3, gy-3, gw+6, gh+6, 10); c.fill();
    c.strokeStyle = '#1D5C3C'; c.lineWidth = 2.6;
    rr(c, gx-3, gy-3, gw+6, gh+6, 10); c.stroke();
    var fr = run.tank / CatchCore.TANK_MAX;
    var fh = gh * fr;
    if (fr > 0){
      var fg = c.createLinearGradient(0, gy+gh-fh, 0, gy+gh);
      fg.addColorStop(0, '#3EC8E0'); fg.addColorStop(1, '#2E7CB8');
      c.fillStyle = fg;
      rr(c, gx, gy + gh - fh, gw, fh, 7); c.fill();
      /* 気泡 */
      c.fillStyle = 'rgba(255,255,255,0.6)';
      for (var b=0;b<3;b++){
        var by = gy + gh - ((elapsed*30 + b*60) % Math.max(fh,1));
        c.beginPath(); c.arc(gx + 6 + b*4, by, 2, 0, Math.PI*2); c.fill();
      }
    }
    c.font = 'bold 11px sans-serif'; c.textAlign = 'center';
    c.fillStyle = '#1D5C3C';
    c.fillText('たんく', gx + gw/2, gy - 12);
    c.fillText(Math.round(run.tank) + 't', gx + gw/2, gy + gh + 18);
    if (fr >= 0.75 && mode === 'play'){
      c.fillStyle = 'rgba(245,166,35,' + (0.6+0.4*Math.sin(elapsed*8)) + ')';
      c.font = 'bold 12px sans-serif';
      c.fillText('もうすこし！', gx - 42, gy + gh/2); /* ゲージ左隣（本体と重ねない） */
    }
  }

  /* ---- 描画 ---- */
  function render(){
    ctx.save();
    if (shakeT > 0){
      ctx.translate((Math.random()-0.5)*shakeMag*2, (Math.random()-0.5)*shakeMag*2);
    }else{
      shakeMag = 0;
    }
    if (mode === 'hatsuden'){
      drawNightBg(ctx, elapsed, save.lights);
      /* 残り時間 */
      ctx.textAlign = 'center';
      ctx.font = 'bold 44px sans-serif';
      ctx.lineWidth = 7; ctx.strokeStyle = '#0d2038';
      var tt = Math.max(0, Math.ceil(hatsuden.t));
      ctx.strokeText('のこり ' + tt, W/2, 116);
      ctx.fillStyle = '#ffe27a';
      ctx.fillText('のこり ' + tt, W/2, 116);
      ctx.font = 'bold 17px sans-serif';
      ctx.lineWidth = 5; ctx.strokeText('おうちを タップして あかりを つけよう！', W/2, 148);
      ctx.fillStyle = '#fff';
      ctx.fillText('おうちを タップして あかりを つけよう！', W/2, 148);
      /* スコアと累計あかり */
      ctx.font = 'bold 15px sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = '#0d2038';
      ctx.strokeText('スコア ' + run.score + '　まちのあかり ' + save.lights, W/2, H-26);
      ctx.fillStyle = '#bdf3fb';
      ctx.fillText('スコア ' + run.score + '　まちのあかり ' + save.lights, W/2, H-26);
      /* 開幕バナー */
      if (hatsuden.banner > 0){
        var bk = Math.min(1, (1.6-hatsuden.banner)/0.25);
        ctx.save();
        ctx.globalAlpha = Math.min(1, hatsuden.banner*2);
        ctx.translate(W/2, 246); ctx.scale(bk, bk);
        ctx.font = 'bold 43px sans-serif';
        ctx.lineWidth = 9; ctx.strokeStyle = '#1D5C3C';
        ctx.strokeText('はつでんタイム！', 0, 0);
        ctx.fillStyle = '#F5A623';
        ctx.fillText('はつでんタイム！', 0, 0);
        ctx.restore();
      }
      drawMetankun(ctx, 56, H-64, 82, 'joy');
      drawFx(ctx);
    }else{
      drawDayBg(ctx, elapsed, run.level);
      if (mode === 'title'){
        /* タイトル時: 芝生にコベッくんと収集車をにぎやかに */
        drawTruck(ctx, W/2 - 70, H-190, 0.3 + 0.3*Math.sin(elapsed*3), 'normal', elapsed);
        drawMetankun(ctx, W/2 + 90, H-206 + Math.sin(elapsed*2)*6, 120, 'joy');
        /* まちのあかり実績: 街並みミニ表示 */
        var litN = Math.min(8, Math.floor(save.lights / 5) + (save.lights>0?1:0));
        for (var i=0;i<8;i++){
          var bx = 30 + i*46, on2 = i < litN;
          ctx.fillStyle = '#4a5a52';
          rr(ctx, bx, H-46, 30, 30, 4); ctx.fill();
          ctx.fillStyle = on2 ? '#ffdf7e' : '#2c3831';
          if (on2){ ctx.shadowColor = '#F5A623'; ctx.shadowBlur = 10; }
          rr(ctx, bx+7, H-39, 7, 8, 2); ctx.fill();
          rr(ctx, bx+17, H-39, 7, 8, 2); ctx.fill();
          ctx.shadowBlur = 0;
        }
      }else{
        /* 落下物 */
        for (var j=0;j<drops.length;j++){
          var d = drops[j];
          if (d.rare){
            ctx.fillStyle = 'rgba(255,217,124,' + (0.3+0.2*Math.sin(elapsed*8)) + ')';
            ctx.beginPath(); ctx.arc(d.x, d.y, 34, 0, Math.PI*2); ctx.fill();
          }
          /* 落下影 */
          ctx.fillStyle = 'rgba(36,51,43,0.1)';
          ctx.beginPath(); ctx.ellipse(d.x, H-86, 14, 4, 0, 0, Math.PI*2); ctx.fill();
          drawItem(ctx, d.id, d.x, d.y, d.rare ? 50 : 44, d.rot);
        }
        drawTruck(ctx, truck.x, TRUCK_Y, truck.mouth, truck.mood, elapsed);
        /* 応援コベッくん（左下） */
        drawMetankun(ctx, 34, H-30, 52, truck.mood === 'sad' ? 'sad' : 'normal');
        drawHUD(ctx);
        drawFx(ctx);
      }
    }
    if (paused && (mode === 'play' || mode === 'hatsuden')){
      ctx.fillStyle = 'rgba(36,51,43,0.6)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign='center';
      ctx.fillText('いったん おやすみ', W/2, H/2 - 10);
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText('タップで さいかい', W/2, H/2 + 24);
    }
    ctx.restore();
  }

  /* ---- 入力 ---- */
  function canvasPos(e){
    var r = cvs.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * W,
      y: (e.clientY - r.top) / r.height * H
    };
  }
  var dragging = false;
  cvs.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var p = canvasPos(e);
    if (paused){ paused = false; return; }
    if (mode === 'play'){
      dragging = true;
      /* キャンバス外へドラッグしても pointermove を受け続ける */
      try{ if (e.pointerId !== undefined && cvs.setPointerCapture) cvs.setPointerCapture(e.pointerId); }catch(err){}
      truck.target = Math.max(58, Math.min(W-58, p.x));
    }else if (mode === 'hatsuden'){
      for (var i=0;i<HOUSES.length;i++){
        var ho = HOUSES[i];
        if (!ho.lit &&
            p.x >= ho.x-10 && p.x <= ho.x+ho.w+10 &&
            p.y >= ho.y-34 && p.y <= ho.y+ho.h+10){
          ho.lit = true;
          var ev = CatchCore.applyLight(run, save);
          sfx.light();
          burst(ho.x+ho.w/2, ho.y+ho.h/2, '#ffdf7e', 14, 190, 0.7);
          sparkle(ho.x+ho.w/2, ho.y, 8);
          floatText(ho.x+ho.w/2, ho.y-14, '+' + ev.gained, '#ffe27a', false);
          floatText(ho.x+ho.w/2, ho.y-44, 'ぱっ！', '#fff', false);
          /* 全点灯ボーナス */
          var allLit = HOUSES.every(function(h){ return h.lit; });
          if (allLit){
            run.score += 200;
            sfx.kiran(); sfx.levelup();
            sparkle(W/2, 380, 40);
            floatText(W/2, 400, 'まち ぜんぶ ぴかぴか！ +200', '#F5A623', true);
            shake(4, 0.3);
          }
          break;
        }
      }
    }
  });
  cvs.addEventListener('pointermove', function(e){
    if (mode === 'play' && dragging){
      var p = canvasPos(e);
      truck.target = Math.max(58, Math.min(W-58, p.x));
    }
  });
  window.addEventListener('pointerup', function(){ dragging = false; });
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') keyL = true;
    if (e.key === 'ArrowRight') keyR = true;
  });
  window.addEventListener('keyup', function(e){
    if (e.key === 'ArrowLeft') keyL = false;
    if (e.key === 'ArrowRight') keyR = false;
  });

  /* ---- オーバーレイ管理 ---- */
  var overlays = {
    title: document.getElementById('title'),
    tutorial: document.getElementById('tutorial'),
    zukan: document.getElementById('zukan'),
    over: document.getElementById('over')
  };
  function showOverlay(name){
    for (var k in overlays) overlays[k].classList.toggle('hidden', k !== name);
  }

  function refreshTitleStats(){
    document.getElementById('titleBestVal').textContent = save.best;
    document.getElementById('titleLightsVal').textContent = save.lights;
  }

  /* ---- チュートリアル（3枚・初回のみ自動） ---- */
  var TUT_PAGES = [
    'やあ！ ぼく <em>コベッくん</em>！<br>したの <strong>しゅうしゅうしゃ</strong>を ゆびで うごかして、おちてくる <strong>たべもののごみ</strong>を キャッチしてね！',
    '<strong>カンやビン、でんち</strong>は たべられへん！<br>とっちゃうと ハートが <em>1つ へっちゃう</em>よ。よけてね！',
    'いっぱい たべると タンクが まんたんに！<br><em>はつでんタイム</em>で まちに あかりを つけよう！ でんきは <strong>1,500けんぶん</strong>も つくれるんだ！'
  ];
  var tutPage = 0, tutAfter = 'start';
  function openTutorial(after){
    tutAfter = after || 'title';
    tutPage = 0;
    renderTutPage();
    showOverlay('tutorial');
  }
  function renderTutPage(){
    document.getElementById('tutBubble').innerHTML = TUT_PAGES[tutPage];
    var dots = document.querySelectorAll('#tutDots i');
    for (var i=0;i<dots.length;i++) dots[i].classList.toggle('on', i === tutPage);
    var tc = document.getElementById('tutMascot').getContext('2d');
    tc.setTransform(2,0,0,2,0,0);
    tc.clearRect(0,0,220,220);
    drawMetankun(tc, 110, 112, 190, tutPage === 1 ? 'sad' : (tutPage === 2 ? 'joy' : 'point'));
  }
  function closeTutorial(){
    try{ localStorage.setItem(TUT_KEY, '1'); }catch(e){}
    if (tutAfter === 'start') startRun();
    else showOverlay('title');
  }
  overlays.tutorial.addEventListener('click', function(e){
    if (e.target.id === 'tutSkip'){ sfx.pop(); closeTutorial(); return; }
    sfx.pop();
    tutPage += 1;
    if (tutPage >= TUT_PAGES.length) closeTutorial();
    else renderTutPage();
  });

  /* ---- ずかん ---- */
  function openZukan(){
    var grid = document.getElementById('zukanGrid');
    grid.innerHTML = '';
    for (var i=0;i<CatchCore.ITEMS.length;i++){
      var it = CatchCore.ITEMS[i];
      var got = save.zukan.indexOf(it.id) !== -1;
      var cell = document.createElement('div');
      cell.className = 'zCell' + (got ? '' : ' locked') + (it.rare ? ' rare' : '');
      var no = document.createElement('div');
      no.className = 'zNo';
      no.textContent = 'No.' + (i+1) + (it.rare ? ' ★レア' : (it.kind==='bad' ? ' ×NG' : ''));
      cell.appendChild(no);
      var mini = document.createElement('canvas');
      mini.width = 128; mini.height = 128;
      cell.appendChild(mini);
      var mc = mini.getContext('2d');
      mc.setTransform(2,0,0,2,0,0);
      if (got){
        drawItem(mc, it.id, 32, 32, 52, 0);
      }else{
        mc.fillStyle = '#cdc9bb';
        mc.font = 'bold 34px sans-serif'; mc.textAlign='center';
        mc.fillText('?', 32, 44);
      }
      var nm = document.createElement('div');
      nm.className = 'zName';
      nm.textContent = got ? it.name : '？？？';
      cell.appendChild(nm);
      var tr = document.createElement('div');
      tr.className = 'zTrivia';
      tr.textContent = got ? it.desc : 'キャッチすると わかるよ';
      cell.appendChild(tr);
      grid.appendChild(cell);
    }
    showOverlay('zukan');
  }

  /* ---- ボタン ---- */
  document.getElementById('btnStart').addEventListener('click', function(){
    sfx.pop();
    var done = false;
    try{ done = localStorage.getItem(TUT_KEY) === '1'; }catch(e){}
    if (!done) openTutorial('start');
    else startRun();
  });
  document.getElementById('btnHow').addEventListener('click', function(){ sfx.pop(); openTutorial('title'); });
  document.getElementById('btnZukan').addEventListener('click', function(){ sfx.pop(); openZukan(); });
  document.getElementById('zukanClose').addEventListener('click', function(){ sfx.pop(); showOverlay('title'); });
  document.getElementById('btnRetry').addEventListener('click', function(){ sfx.pop(); startRun(); });
  document.getElementById('btnTitle').addEventListener('click', function(){
    sfx.pop(); mode = 'title'; refreshTitleStats(); showOverlay('title');
  });

  /* ---- タブ非表示でポーズ＆セーブ ---- */
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      if (mode === 'play' || mode === 'hatsuden') paused = true;
      storeSave();
    }
  });
  /* iOS Safari では visibilitychange が発火しないことがあるため pagehide でも保存 */
  window.addEventListener('pagehide', function(){
    if (mode === 'play' || mode === 'hatsuden') paused = true;
    storeSave();
  });

  /* ---- タイトルのコベッくん ---- */
  (function(){
    var tm = document.getElementById('titleMascot').getContext('2d');
    var tt = 0;
    function drawTitleMascot(){
      tm.setTransform(2,0,0,2,0,0);
      tm.clearRect(0,0,170,170);
      drawMetankun(tm, 85, 88, 150, 'joy');
      tt += 1;
      if (tt < 90) requestAnimationFrame(drawTitleMascot); /* 画像遅延ロードの反映用に数秒だけ再描画 */
    }
    drawTitleMascot();
  })();

  /* ---- メインループ ---- */
  var lastT = 0;
  function loop(ts){
    var dt = Math.min(0.05, (ts - lastT) / 1000 || 0);
    lastT = ts;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(loop);
  }
  refreshTitleStats();
  showOverlay('title');
  requestAnimationFrame(loop);

})(); }

/* ---- ヘッドレステスト用公開 ---- */
if (typeof module !== 'undefined' && module.exports){
  module.exports = CatchCore;
}
</script>
</body>
