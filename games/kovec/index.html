<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#63CCE5">
<title>コベック エコ・ゲームパーク | 株式会社コベック</title>
<style>
:root{
  --navy:#0B5B78;--navy-2:#2EA7C7;--gold:#FFD447;--cyan:#6DE7F1;
  --cream:#F6F3EA;--green:#1D5C3C;--leaf:#7CC24E;--blue:#2E7CB8;
  --flame:#F5A623;--ink:#24332B;--safe-top:max(14px,env(safe-area-inset-top));
  --safe-right:max(14px,env(safe-area-inset-right));--safe-bottom:max(10px,env(safe-area-inset-bottom));
  --safe-left:max(14px,env(safe-area-inset-left));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* スマホでは通常のスクロール文書として扱う。
   height:100% + overflow:hidden にするとページが一切スクロールできず、
   iOS/Android がいったん隠したブラウザのツールバー（戻るボタン）を
   復帰できなくなるため、ここでは絶対に固定しない。 */
html,body{width:100%;background:#BCECF5;-webkit-text-size-adjust:100%;
  font-family:'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','BIZ UDGothic',sans-serif}
body{color:#fff;touch-action:manipulation;overflow-x:hidden}
button,a{font:inherit}
#wrap{position:relative;width:100%;transform-origin:center center}
#stage{position:relative;width:100%;min-height:100vh;min-height:100svh;overflow:hidden;
  background:#BCECF5;isolation:isolate;-webkit-user-select:none;user-select:none}
#stage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 58%,rgba(20,126,143,.12) 100%)}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#ui{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  min-height:100vh;min-height:100svh;
  padding:calc(var(--safe-top) + 4px) 16px calc(var(--safe-bottom) + 14px)}
#logo{width:100%;text-align:center;margin-top:0;filter:drop-shadow(0 7px 18px rgba(14,104,124,.22))}
#logo .co{display:inline-flex;align-items:center;min-height:28px;color:#125773;font-size:11px;font-weight:800;
  border:1px solid rgba(255,255,255,.88);background:rgba(255,255,255,.76);backdrop-filter:blur(10px);
  border-radius:999px;padding:4px 16px;letter-spacing:.16em}
#logo .main-logo{display:block;width:min(92vw,380px);max-width:100%;height:auto;margin:4px auto -2px;
  animation:parkLogoIn .8s cubic-bezier(.2,1.45,.35,1) both}
@keyframes parkLogoIn{from{opacity:0;transform:scale(.55) rotate(-2deg)}to{opacity:1;transform:scale(1) rotate(0)}}
#logo .sub{font-size:12px;color:#125773;display:inline-block;margin-top:7px;font-weight:800;
  border-radius:999px;padding:5px 14px;letter-spacing:.09em;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9)}
/* スマホ：コベッくんと吹き出しを通常フローの1行に並べる（重なり・見切れ防止） */
#hero{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px}
#mascotBox{display:block;flex:0 0 auto;width:clamp(108px,29vw,140px);aspect-ratio:1/1.14;height:auto;
  pointer-events:auto;z-index:4;
  filter:drop-shadow(0 10px 16px rgba(5,99,112,.28));transition:filter .2s ease}
#greet{display:block;flex:1 1 auto;min-width:0;z-index:5;background:rgba(255,255,255,.96);
  border:2px solid var(--cyan);border-radius:14px;padding:9px 12px;font-size:12.5px;font-weight:800;
  color:#11355D;line-height:1.5;opacity:0;transition:opacity .45s ease;position:relative;
  box-shadow:0 8px 22px rgba(0,13,56,.28)}
#greet::after{content:"";position:absolute;right:-14px;top:20px;border:7px solid transparent;
  border-left-color:var(--cyan)}
#cards{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:11px}
.card{position:relative;display:block;width:100%;height:158px;height:clamp(150px,19svh,172px);overflow:hidden;border-radius:17px;
  color:#10465A;text-decoration:none;background:#DFF8FA;border:2px solid rgba(255,255,255,.92);
  box-shadow:0 8px 22px rgba(7,91,111,.25),inset 0 0 0 1px rgba(49,189,204,.16);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:active{transform:scale(.975)}
.card .art{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(1.16) contrast(1.07)}
.card .shade{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(255,255,255,.84) 0%,rgba(239,255,255,.55) 48%,rgba(229,253,255,.03) 82%),
  linear-gradient(0deg,rgba(230,253,255,.58) 0%,rgba(255,255,255,0) 54%)}
/* スマホ：左＝バッジ＋ロゴ／右＝あそぶボタン。重なりを起こさない列構成にする */
.card .txt{position:absolute;left:12px;right:128px;top:10px;z-index:2;width:auto}
.card .age{display:inline-flex;align-items:center;min-height:24px;font-size:11.5px;font-weight:900;
  border-radius:999px;padding:3px 10px;margin-bottom:4px;color:var(--age-ink,#174F63);
  background:var(--age-color,#FF5F91);border:2px solid rgba(255,255,255,.96);
  text-shadow:0 1px 2px rgba(43,28,55,.28);
  box-shadow:0 4px 0 var(--age-shadow,#B83363),0 6px 13px rgba(25,61,85,.24)}
.card .age::before{content:"★";margin-right:5px;color:#FFF36F;font-size:10px;line-height:1;
  text-shadow:0 1px 2px rgba(85,47,0,.42)}
.card .game-logo{display:block;width:100%;max-width:190px;height:auto;margin:-2px auto 0;filter:drop-shadow(0 3px 5px rgba(3,49,73,.24))}
.card .desc{display:none;font-size:12px;line-height:1.38;margin-top:3px;color:#245A65;
  text-shadow:0 1px 0 rgba(255,255,255,.88)}
.card .prog{position:absolute;left:14px;right:132px;bottom:8px;font-size:11.5px;font-weight:800;
  color:#114B35;text-shadow:none;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.92);border-radius:999px;padding:3px 8px;
  box-shadow:0 3px 9px rgba(11,82,96,.14);backdrop-filter:blur(5px)}
.card .go{position:absolute;right:10px;bottom:8px;z-index:2;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;min-width:118px;min-height:50px;color:#5A1E0C;background:linear-gradient(180deg,#FFB36F 0%,#FF713B 58%,#EA4925 100%);
  border:2px solid #fff;font-size:13px;font-weight:900;border-radius:999px;letter-spacing:.07em;
  text-shadow:0 1px 0 #FFD7BC,0 0 5px rgba(255,255,255,.72);
  box-shadow:0 5px 0 #B83E20,0 0 0 2px rgba(255,255,255,.40),0 9px 20px rgba(97,45,22,.32)}
.card .go::after{content:"▶";display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;
  border-radius:50%;color:#7B3517;background:linear-gradient(180deg,#FFF88A,#FFD52F);
  border:1.5px solid rgba(255,255,255,.95);box-shadow:0 2px 0 #C98C00,0 3px 7px rgba(91,49,7,.24);text-shadow:none}
.card:hover .go,.card:focus-visible .go{transform:translateY(-2px);box-shadow:0 7px 0 #B83E20,0 0 0 3px rgba(255,255,255,.48),0 13px 25px rgba(97,45,22,.36)}
.card:focus-visible{outline:3px solid #fff;outline-offset:4px;border-color:var(--gold);
  box-shadow:0 0 0 7px rgba(67,223,242,.42),0 16px 34px rgba(0,8,44,.6)}
.card:focus-visible .go{background:linear-gradient(180deg,#FFA45D 0%,#FF713B 62%,#F2552D 100%);color:#4B2417}
#foot{margin-top:auto;text-align:center;font-size:11px;color:#164E5B;line-height:1.48;
  text-shadow:0 1px 0 rgba(255,255,255,.92);padding:5px 10px 4px;border-radius:12px;
  background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.92);box-shadow:0 5px 16px rgba(13,105,122,.14)}
#foot b{font-size:12px;color:#126046}

@media (min-width:900px){
  html,body{height:100%;overflow:hidden}
  #wrap{position:fixed;inset:0;left:0;top:0;transform:none!important}
  #stage{width:100%;height:100%;min-height:620px;border-radius:0;box-shadow:none}
  #ui{position:absolute;inset:0;min-height:0}
  #hero{display:block;width:auto;margin:0}
  #mascotBox{position:absolute;aspect-ratio:auto}
  #greet{position:absolute;flex:none}
  #stage::before{background:
    radial-gradient(circle at 50% 32%,rgba(255,255,255,.12),rgba(255,255,255,0) 31%),
    linear-gradient(180deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,0) 56%,rgba(13,115,135,.14) 100%)}
  #ui{padding:calc(var(--safe-top) + 12px) max(28px,var(--safe-right)) var(--safe-bottom)}
  #logo{margin-top:0}
  #logo .co{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:6;
    min-height:32px;font-size:12px;padding:5px 22px;letter-spacing:.18em}
  #logo .main-logo{width:clamp(615px,58.5vw,930px);max-width:calc(100vw - 80px);height:auto;margin:0 auto -72px}
  #logo .sub{display:none}
  #mascotBox{display:block;left:50%;right:auto;top:clamp(370px,calc(41vh - 30px),415px);transform:translateX(-50%) scale(1.3);transform-origin:center;
    width:clamp(155px,12vw,180px);height:clamp(170px,12.5vw,190px);pointer-events:auto;cursor:pointer}
  #mascotBox:hover{filter:drop-shadow(0 13px 22px rgba(5,99,112,.38)) brightness(1.06)}
  #mascotBox:focus-visible{outline:4px solid #fff;outline-offset:5px;border-radius:50%}
  #greet{display:block;left:calc(50% - 310px);right:auto;top:clamp(450px,46vh,495px);max-width:230px;
    font-size:13px;padding:10px 14px}
  #greet::after{left:auto;right:-16px;top:24px;border-width:8px;border-left-color:var(--cyan);border-bottom-color:transparent}
  #cards{position:absolute;left:50%;top:clamp(625px,62vh,660px);transform:translateX(-50%);
    width:min(1120px,calc(100vw - 64px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;margin:0}
  .card{height:clamp(255px,29vh,285px);border-radius:22px}
  .card:hover{transform:translateY(-6px);border-color:#fff;
    box-shadow:0 18px 38px rgba(0,7,42,.56),0 0 0 2px rgba(67,223,242,.22)}
  .card .shade{background:
    linear-gradient(0deg,rgba(241,255,255,.80) 0%,rgba(239,255,255,.32) 48%,rgba(255,255,255,.01) 80%),
    linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,0) 68%)}
  .card .txt{left:18px;right:18px;top:16px;width:auto;max-width:none}
  .card .age{font-size:10px;min-height:24px;padding:4px 11px;margin-bottom:7px}
  .card .game-logo{width:clamp(230px,19vw,260px);margin:-3px auto 3px}
  .card .desc{display:block;font-size:clamp(10px,.9vw,12px);font-weight:800;line-height:1.42;margin-top:0;
    max-width:calc(100% - 126px);color:#153D45;background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.9);
    border-radius:9px;padding:4px 7px;text-shadow:none;box-shadow:0 3px 10px rgba(8,75,91,.13);backdrop-filter:blur(5px)}
  .card .prog{left:18px;right:auto;bottom:17px;max-width:calc(100% - 160px);font-size:11px}
  .card .go{right:14px;bottom:12px;min-width:118px;min-height:48px;font-size:14px}
  #foot{position:absolute;left:50%;right:auto;bottom:var(--safe-bottom);transform:translateX(-50%);
    width:max-content;max-width:calc(100vw - 32px);font-size:11px;line-height:1.55;padding:6px 18px}
  #foot b{font-size:12px}
}
@media (min-width:900px) and (max-height:950px){
  #mascotBox{top:430px;width:150px;height:165px}
  #greet{top:450px}
  #cards{top:665px}.card{height:235px}
  .card .txt{top:11px}
  .card .game-logo{width:240px;margin:-8px auto -3px}
  .card .desc{font-size:10.5px;line-height:1.3}
  .card .prog{bottom:12px}
  .card .go{bottom:10px}
  #foot{display:none}
}
@media (min-width:900px) and (max-height:760px){
  #logo .main-logo{width:585px;max-width:calc(100vw - 64px);margin-bottom:-50px}
  #mascotBox{top:302px;width:125px;height:138px}#greet{display:none}
  #cards{top:505px}.card{height:255px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    scroll-behavior:auto!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="wrap">
  <main id="stage">
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="ui">
      <header id="logo">
        <span class="co">株式会社コベック</span>
        <img class="main-logo" src="assets/titles/eco-game-park.png" alt="コベック エコ・ゲームパーク">
        <span class="sub">神戸から始める ECOLOGY</span>
      </header>
      <div id="hero">
        <div id="greet" role="status" aria-live="polite"></div>
        <canvas id="mascotBox" role="button" tabindex="0" aria-label="コベッくん。押すとスターショー"></canvas>
      </div>
      <nav id="cards" aria-label="ゲームを選ぶ"></nav>
      <footer id="foot">
        <b>バイオガスKOBE</b>（神戸市兵庫区遠矢浜町）<br>
        食品廃棄物 60t/日 → バイオガス 約6,900N㎥/日 → 1,000kW発電<br>
        年間約5,000MWh ＝ 一般家庭 約1,500世帯分の電気　※デモ版
      </footer>
    </div>
  </main>
</div>
<script>
'use strict';
(function(){
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
var wrap=document.getElementById('wrap'),stage=document.getElementById('stage');
var dpr=Math.min(2,window.devicePixelRatio||1),desktop=false,reduceMotion=false;
try{reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
/* スマホは等倍のレスポンシブ表示（scale で画面に固定しない）。
   固定するとページがスクロールできず、ブラウザの戻るボタンが戻らなくなる。 */
function fit(){
  desktop=window.innerWidth>=900;
  wrap.style.transform='none';
  resizeCanvases();
}

function readJson(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
var sCatch=readJson('kobec_catch_save'),sGrid=readJson('kobec_grid_save'),sPlant=readJson('kobec_plant_meta');
var lights=sCatch?sCatch.lights|0:0;
var stars=0;if(sGrid&&Array.isArray(sGrid.stars))for(var si=0;si<sGrid.stars.length;si++)stars+=sGrid.stars[si]|0;
var bestMwh=sPlant?+sPlant.bestMwh||0:0;
var nightT=Math.min(1,(Math.min(lights,60)/60+Math.min(stars,36)/36+Math.min(bestMwh,410)/410)/3);
var GAMES=[
 {href:'catch.html',title:'もぐもぐキャッチ！',logo:'mogumogu-catch.png',age:'しょうがくせい むけ',ageC:'#F25F92',ageInk:'#FFFFFF',ageShadow:'#AD315F',
  desc:'しゅうしゅうしゃで たべもののごみを キャッチ！ タンクいっぱいで はつでんタイム！',
  prog:sCatch?('ハイスコア '+(sCatch.best|0)+'　まちのあかり '+lights+'こ'):'はじめて あそぶ',art:'card_catch.jpg',artDraw:drawCardCatch},
 {href:'grid.html',title:'バイオガス・グリッド',logo:'biogas-grid.png',age:'中高生向け',ageC:'#477DF2',ageInk:'#FFFFFF',ageShadow:'#2855B5',
  desc:'パイプをつないで 廃棄物→ガス→電気 のルートを完成させる頭脳パズル 全12ステージ',
  prog:sGrid?('★'+stars+'/36　ランドマーク '+Math.min(6,Math.floor(stars/6))+'/6'):'はじめてプレイ',art:'card_grid.jpg',artDraw:drawCardGrid},
 {href:'plant.html',title:'操業マスター 〜バイオガスKOBE〜',logo:'operation-master.png',age:'大人向け',ageC:'#FF9F2E',ageInk:'#5B3200',ageShadow:'#C66D00',
  desc:'実データで挑む30日経営シム。受入・発酵・売電のすべてを指揮する工場長はあなた',
  prog:sPlant&&bestMwh?('ベスト '+bestMwh+' MWh（'+(sPlant.bestRank||'-')+'ランク）　称号 '+((sPlant.titles||[]).length)+'/6'):'はじめてプレイ',art:'card_plant.jpg',artDraw:drawCardPlant}
];

var cardViews=[];
var cards=document.getElementById('cards');
GAMES.forEach(function(g){
  var el=document.createElement('a');el.className='card';el.href=g.href;
  el.setAttribute('aria-label',g.title+'をあそぶ。'+g.prog);
  var art=document.createElement('canvas');art.className='art';art.setAttribute('aria-hidden','true');el.appendChild(art);
  var sh=document.createElement('span');sh.className='shade';sh.setAttribute('aria-hidden','true');el.appendChild(sh);
  var tx=document.createElement('span');tx.className='txt';
  var age=document.createElement('span');age.className='age';age.style.setProperty('--age-color',g.ageC);age.style.setProperty('--age-ink',g.ageInk);age.style.setProperty('--age-shadow',g.ageShadow);age.textContent=g.age;tx.appendChild(age);
  var logo=document.createElement('img');logo.className='game-logo';logo.src='assets/titles/'+g.logo;
  logo.alt=g.title;logo.decoding='async';tx.appendChild(logo);
  var ds=document.createElement('span');ds.className='desc';ds.textContent=g.desc;tx.appendChild(ds);el.appendChild(tx);
  var pr=document.createElement('span');pr.className='prog';pr.textContent=g.prog;el.appendChild(pr);
  var go=document.createElement('span');go.className='go';go.textContent='あそぶ';el.appendChild(go);
  cards.appendChild(el);
  var view={el:el,canvas:art,game:g,img:null,ready:false};cardViews.push(view);
  var im=new Image();view.img=im;
  im.onload=function(){view.ready=true;paintCard(view)};
  im.onerror=function(){view.ready=false;paintCard(view)};
  im.src='assets/'+g.art;
});

function drawCover(c,im,w,h){
  var sw=im.naturalWidth||im.width,sh=im.naturalHeight||im.height;
  if(!sw||!sh)return;
  var scale=Math.max(w/sw,h/sh),cw=w/scale,ch=h/scale;
  var sx=(sw-cw)/2,sy=(sh-ch)/2;
  c.drawImage(im,sx,sy,cw,ch,0,0,w,h);
}
function paintCard(v){
  var rect=v.el.getBoundingClientRect(),w=Math.max(1,Math.round(rect.width)),h=Math.max(1,Math.round(rect.height));
  v.canvas.width=Math.round(w*dpr);v.canvas.height=Math.round(h*dpr);
  var c=v.canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  if(v.ready)drawCover(c,v.img,w,h);else v.game.artDraw(c,w,h);
  if(v.game.href==='catch.html'&&cardTruckReady){
    var tw=w*.46,th=tw*(cardTruckImg.naturalHeight/cardTruckImg.naturalWidth);
    c.save();c.shadowColor='rgba(4,80,92,.28)';c.shadowBlur=10;
    c.drawImage(cardTruckImg,w-tw-5,h-th-3,tw,th);c.restore();
  }
}
function drawCardCatch(c,w,h){
  var g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#10458C');g.addColorStop(1,'#1A9A91');
  c.fillStyle=g;c.fillRect(0,0,w,h);var s=Math.min(w/388,h/128),ox=w-118*s,oy=h-55*s;
  c.fillStyle='rgba(67,223,242,.22)';for(var i=0;i<8;i++){c.beginPath();c.arc(w*(.55+(i%4)*.13),h*(.14+Math.floor(i/4)*.28),9*s+i%3*3,0,7);c.fill()}
  c.fillStyle='#2E7CB8';c.fillRect(ox-52*s,oy,64*s,26*s);c.fillRect(ox+12*s,oy+6*s,20*s,20*s);
  c.fillStyle='#BDEFFB';c.fillRect(ox+16*s,oy+9*s,12*s,9*s);c.fillStyle='#071C4A';
  c.beginPath();c.arc(ox-36*s,oy+28*s,8*s,0,7);c.arc(ox+16*s,oy+28*s,8*s,0,7);c.fill();
  c.fillStyle='#FFC928';c.beginPath();c.arc(ox-20*s,oy-42*s,10*s,0,7);c.fill();
  c.fillStyle='#7CC24E';c.beginPath();c.arc(ox+18*s,oy-64*s,9*s,0,7);c.fill();
}
function drawCardGrid(c,w,h){
  var g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#061B48');g.addColorStop(1,'#075F78');
  c.fillStyle=g;c.fillRect(0,0,w,h);var tile=Math.max(24,Math.min(w,h)/4);
  c.strokeStyle='rgba(67,223,242,.16)';c.lineWidth=1;
  for(var x=w*.48;x<w+tile;x+=tile){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}
  for(var y=tile*.35;y<h;y+=tile){c.beginPath();c.moveTo(w*.42,y);c.lineTo(w,y);c.stroke()}
  c.lineCap='round';c.lineWidth=Math.max(5,h*.035);c.shadowBlur=12;c.strokeStyle='#43DFF2';c.shadowColor='#43DFF2';
  c.beginPath();c.moveTo(w*.52,h*.82);c.lineTo(w*.52,h*.48);c.lineTo(w*.72,h*.48);c.lineTo(w*.72,h*.25);c.lineTo(w*.92,h*.25);c.stroke();

function drawCardPlant(c,w,h){

var mb=document.getElementById('mascotBox'),m2=mb.getContext('2d');

function drawMetankun(c,x,y,s){
  c.save();c.translate(x,y);var r=s*.36;
  var g=c.createRadialGradient(0,-r*.2,r*.1,0,0,r*1.35);g.addColorStop(0,'#E9FDFF');g.addColorStop(.52,'#43DFF2');g.addColorStop(1,'#157EB4');
  c.fillStyle=g;c.beginPath();c.moveTo(0,-r*1.5);c.bezierCurveTo(r*.95,-r*.45,r*1.05,r*.45,0,r*1.05);
  c.bezierCurveTo(-r*1.05,r*.45,-r*.95,-r*.45,0,-r*1.5);c.fill();c.strokeStyle='#0C5A89';c.lineWidth=Math.max(1.5,s*.025);c.stroke();
  c.fillStyle='#fff';c.beginPath();c.ellipse(-r*.32,-r*.05,r*.2,r*.24,0,0,7);c.ellipse(r*.32,-r*.05,r*.2,r*.24,0,0,7);c.fill();
  c.fillStyle='#153054';c.beginPath();c.arc(-r*.32,-.02*r,r*.09,0,7);c.arc(r*.32,-.02*r,r*.09,0,7);c.fill();
  c.strokeStyle='#153054';c.lineWidth=s*.018;c.beginPath();c.arc(0,r*.42,r*.22,.2,Math.PI-.2);c.stroke();
  c.fillStyle='rgba(255,142,180,.78)';c.beginPath();c.ellipse(-r*.55,r*.22,r*.11,r*.07,0,0,7);c.ellipse(r*.55,r*.22,r*.11,r*.07,0,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.38)';c.beginPath();c.moveTo(0,-r*1.1);c.bezierCurveTo(r*.4,-r*.4,r*.4,r*.2,0,r*.55);
  c.bezierCurveTo(-r*.4,r*.2,-r*.4,-r*.4,0,-r*1.1);c.fill();c.restore();
}
var mascotImg=new Image(),useMascot=false;
mascotImg.onload=function(){useMascot=true;paintMascot(performance.now())};
mascotImg.onerror=function(){useMascot=false;paintMascot(performance.now())};
/* v2 は旧立ち絵と別URLにして、端末キャッシュから確実に更新する */
mascotImg.src='assets/mascot_v2.png?v=20260715c';
var greet=document.getElementById('greet');
var greets=['ワイはコベッくん！ すきなゲームをえらんでな！','食べもののごみが電気になるって、知っとった？','バイオガスKOBEは1日60トンのごみを受け入れとるで！'];
var gi=Math.floor(Math.random()*greets.length);
greet.textContent=greets[gi];
var mascotBurstAt=-99999,greetHideTimer=0;
setTimeout(function(){greet.style.opacity='1'},reduceMotion?0:650);
/* スマホは吹き出しが通常フローにあるため、消すと空白が残る。
   消さずにセリフを巡回させる（PCは従来どおりフェードアウト） */
function cycleGreet(){
  if(window.innerWidth>=900){greet.style.opacity='0';return}
  greet.style.opacity='0';
  setTimeout(function(){gi=(gi+1)%greets.length;greet.textContent=greets[gi];greet.style.opacity='1'},reduceMotion?0:480);
  greetHideTimer=setTimeout(cycleGreet,7000);
}
greetHideTimer=setTimeout(cycleGreet,reduceMotion?5000:6500);
function triggerMascotShow(){
  mascotBurstAt=performance.now();
  greet.textContent='スター発電、いっくでー！ ★';greet.style.opacity='1';
  clearTimeout(greetHideTimer);greetHideTimer=setTimeout(cycleGreet,2400);
}
mb.addEventListener('click',triggerMascotShow);
mb.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();triggerMascotShow()}});

var bg=document.getElementById('bg'),b=bg.getContext('2d'),bgImg=new Image(),bgReady=false;
var bgDesktopImg=new Image(),bgDesktopReady=false;
bgImg.onload=function(){bgReady=true;drawScene(performance.now())};bgImg.onerror=function(){bgReady=false};
bgImg.src='assets/entrance_bg.jpg';
bgDesktopImg.onload=function(){bgDesktopReady=true;drawScene(performance.now())};
bgDesktopImg.onerror=function(){bgDesktopReady=false};
bgDesktopImg.src='assets/entrance_bg_desktop.jpg';
var t0=performance.now();
function resizeCanvases(){
  if(!stage||!bg)return;
  dpr=Math.min(2,window.devicePixelRatio||1);
  var w=stage.clientWidth,h=stage.clientHeight;
  bg.width=Math.round(w*dpr);bg.height=Math.round(h*dpr);b.setTransform(dpr,0,0,dpr,0,0);
  var mr=mb.getBoundingClientRect();mb.width=Math.max(1,Math.round(mr.width*dpr));mb.height=Math.max(1,Math.round(mr.height*dpr));
  m2=mb.getContext('2d');m2.setTransform(dpr,0,0,dpr,0,0);
  cardViews.forEach(paintCard);drawScene(performance.now());
}
function drawFallbackBg(c,w,h,t){
  var sky=c.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#35BDE5');sky.addColorStop(.52,'#A7E8F2');sky.addColorStop(1,'#E9F9E8');
  c.fillStyle=sky;c.fillRect(0,0,w,h);
  c.fillStyle='rgba(255,255,255,.76)';for(var i=0;i<70;i++){var sx=(i*137)%w,sy=(i*67)%(h*.58),tw=.35+.65*Math.abs(Math.sin(t*.8+i));c.globalAlpha=tw;c.fillRect(sx,sy,i%9===0?3:1.5,i%9===0?3:1.5)}c.globalAlpha=1;
  var base=h*.82;c.fillStyle='#071D4C';c.beginPath();c.moveTo(0,base);c.quadraticCurveTo(w*.24,h*.68,w*.48,base-.02*h);c.quadraticCurveTo(w*.72,h*.67,w,base-.03*h);c.lineTo(w,h);c.lineTo(0,h);c.fill();
  c.fillStyle='#0B2B66';for(var k=0;k<18;k++){var bw=w/17+2,bh=h*(.055+(k%5)*.012);c.fillRect(k*w/17-2,base-bh,bw,bh)}
  c.fillStyle='#FFC928';for(var n=0;n<34;n++){var wx=(n*83)%w,wy=base-h*(.015+(n%4)*.018);c.globalAlpha=.28+.45*Math.abs(Math.sin(t+n));c.fillRect(wx,wy,4,5)}c.globalAlpha=1;
  var towerX=w*.5,towerTop=h*.57;c.strokeStyle='#D64A55';c.lineWidth=Math.max(4,w*.004);c.beginPath();c.moveTo(towerX-w*.035,h);c.bezierCurveTo(towerX-w*.012,h*.78,towerX-w*.012,h*.68,towerX-w*.025,towerTop);c.moveTo(towerX+w*.035,h);c.bezierCurveTo(towerX+w*.012,h*.78,towerX+w*.012,h*.68,towerX+w*.025,towerTop);c.stroke();
}
function drawScene(now){
  var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;var t=reduceMotion?0:(now-t0)/1000;
  b.clearRect(0,0,w,h);
  if(desktop&&bgDesktopReady)drawCover(b,bgDesktopImg,w,h);
  else if(bgReady)drawCover(b,bgImg,w,h);else drawFallbackBg(b,w,h,t);
  b.fillStyle='rgba(255,255,255,.025)';b.fillRect(0,0,w,h);
  if(nightT>0){
    b.save();b.globalCompositeOperation='screen';
    for(var p=0;p<18;p++){
      var px=(p*131)%w,py=h*(.48+(p%6)*.075),pr=2+(p%3)*1.5;
      b.fillStyle='rgba(255,201,40,'+(nightT*(.16+.08*Math.sin(t+p)))+')';
      b.beginPath();b.arc(px,py,pr,0,7);b.fill();
    }
    b.restore();
  }
  if(!reduceMotion){for(var q=0;q<10;q++){var gy=h-((t*22+q*h*.12)%(h*1.15)),gx=w*(.07+(q*97%820)/1000)+Math.sin(t+q)*9;b.fillStyle='rgba(67,223,242,'+(.08+.045*Math.sin(t*2+q))+')';b.beginPath();b.arc(gx,gy,4+(q%3)*3,0,7);b.fill()}}
  paintMascot(now);
}
function drawSparkStar(c,x,y,r,rot,color,alpha){
  c.save();c.translate(x,y);c.rotate(rot);c.globalAlpha=alpha;c.fillStyle=color;c.shadowColor=color;c.shadowBlur=r*.8;
  c.beginPath();for(var i=0;i<10;i++){var rr=i%2===0?r:r*.43,a=-Math.PI/2+i*Math.PI/5;
    if(i===0)c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);else c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
  c.closePath();c.fill();c.shadowBlur=0;c.strokeStyle='rgba(255,255,255,.92)';c.lineWidth=Math.max(1,r*.13);c.stroke();c.restore();
}
function paintMascot(now){
  var mr=mb.getBoundingClientRect(),w=mr.width,h=mr.height;if(!w||!h)return;
  m2.clearRect(0,0,w,h);
  var elapsed=(now-t0)/1000,bob=reduceMotion?0:Math.sin(elapsed*1.7)*4;
  var x=w/2,cy=h/2+bob*.35,hr=Math.min(w,h)*.43;
  if(useMascot){
    var iw=mascotImg.naturalWidth||mascotImg.width,ih=mascotImg.naturalHeight||mascotImg.height;
    var imageScale=Math.min((w*.84)/iw,(h*.82)/ih),mw=iw*imageScale,mh=ih*imageScale;
    var phase=elapsed%8,showP=phase>=5.8&&phase<7.1?(phase-5.8)/1.3:0;
    var burstAge=(now-mascotBurstAt)/1000,burstOn=burstAge>=0&&burstAge<1.15;
    var eased=showP?(.5-.5*Math.cos(Math.PI*showP)):0;
    var spin=reduceMotion?0:Math.PI*2*eased;
    var pop=reduceMotion?0:Math.sin(Math.PI*showP);
    var jump=reduceMotion?0:-hr*.18*pop;
    var characterScale=1+(reduceMotion?0:.12*pop);
    if(burstOn&&!reduceMotion){var bp=Math.min(1,burstAge/.55);characterScale+=Math.sin(Math.PI*bp)*.17;jump-=Math.sin(Math.PI*bp)*hr*.10}

    m2.save();m2.shadowColor='rgba(8,92,112,.22)';m2.shadowBlur=16;m2.shadowOffsetY=7;
    var halo=m2.createRadialGradient(x,cy-hr*.12,hr*.08,x,cy,hr);
    halo.addColorStop(0,'rgba(255,255,255,.98)');halo.addColorStop(.72,'rgba(239,253,255,.94)');halo.addColorStop(1,'rgba(206,247,250,.90)');
    m2.fillStyle=halo;m2.beginPath();m2.arc(x,cy,hr,0,Math.PI*2);m2.fill();m2.restore();

    m2.save();m2.translate(x,cy);m2.rotate(reduceMotion?0:elapsed*.62);
    m2.lineWidth=Math.max(3,hr*.04);m2.lineCap='round';
    var ringColors=['#FFD447','#FF6B5B','#54E6F1','#7ED957'];
    for(var s=0;s<4;s++){m2.strokeStyle=ringColors[s];m2.beginPath();m2.arc(0,0,hr,-.08+s*Math.PI/2,.83+s*Math.PI/2);m2.stroke()}
    m2.restore();
    m2.save();m2.translate(x,cy);m2.rotate(reduceMotion?0:-elapsed*.88);
    m2.setLineDash([Math.max(5,hr*.09),Math.max(4,hr*.065)]);m2.lineWidth=Math.max(2,hr*.022);m2.strokeStyle='#45CFE2';
    m2.beginPath();m2.arc(0,0,hr*.84,0,Math.PI*2);m2.stroke();m2.restore();

    var starColors=['#FFD447','#FF6B5B','#63E8F1'];
    for(var j=0;j<3;j++){
      var a=(reduceMotion?j*2.094:elapsed*(.82+j*.055)+j*2.094),orbit=hr*.96;
      var sx=x+Math.cos(a)*orbit,sy=cy+Math.sin(a)*orbit*.82-(reduceMotion?0:Math.abs(Math.sin(elapsed*3.2+j))*hr*.09);
      drawSparkStar(m2,sx,sy,hr*(.085+.018*Math.sin(elapsed*2+j)),a,starColors[j],.96);
    }
    if(burstOn&&!reduceMotion){
      var burstP=burstAge/1.15;
      for(var k=0;k<10;k++){var ba=k*Math.PI/5+burstP*.65,br=hr*(.42+1.05*burstP);
        drawSparkStar(m2,x+Math.cos(ba)*br,cy+Math.sin(ba)*br,hr*.065,ba,starColors[k%3],1-burstP)}
    }

    function drawMascotPass(shadowColor,blur,offsetY){
      m2.save();m2.translate(x,cy+jump);m2.rotate(spin);m2.scale(characterScale,characterScale);
      m2.shadowColor=shadowColor;m2.shadowBlur=blur;m2.shadowOffsetY=offsetY;
      m2.drawImage(mascotImg,-mw/2,-mh/2,mw,mh);m2.restore();
    }
    drawMascotPass('rgba(7,73,83,.38)',9,5);
    drawMascotPass('rgba(255,255,255,.72)',5,0);
  }else{
    /* 立ち絵が読み込めない端末でもキャラクターを必ず表示する */
    m2.save();m2.shadowColor='rgba(8,92,112,.22)';m2.shadowBlur=16;m2.shadowOffsetY=7;
    var halo2=m2.createRadialGradient(x,cy-hr*.12,hr*.08,x,cy,hr);
    halo2.addColorStop(0,'rgba(255,255,255,.98)');halo2.addColorStop(.72,'rgba(239,253,255,.94)');halo2.addColorStop(1,'rgba(206,247,250,.90)');
    m2.fillStyle=halo2;m2.beginPath();m2.arc(x,cy,hr,0,Math.PI*2);m2.fill();m2.restore();
    m2.save();m2.lineWidth=Math.max(3,hr*.035);m2.strokeStyle='#FFD447';
    m2.beginPath();m2.arc(x,cy,hr,0,Math.PI*2);m2.stroke();m2.restore();
    drawMetankun(m2,x,cy,hr*1.55);
  }
}
var resizeTimer=0;
function scheduleFit(){clearTimeout(resizeTimer);resizeTimer=setTimeout(fit,80)}
window.addEventListener('resize',scheduleFit);
window.addEventListener('orientationchange',scheduleFit);
/* 文字の読み込みやアドレスバーの開閉でステージ高が変わってもキャンバスを追従させる */
if(window.ResizeObserver){try{new ResizeObserver(scheduleFit).observe(stage)}catch(e){}}
fit();
var lastFrame=0;
function loop(now){if(now-lastFrame>=33){drawScene(now);lastFrame=now}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
