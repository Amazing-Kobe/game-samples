const TW=(()=>{const K={settings:'twsm_settings',meta:'twsm_meta',hub:'twsm_hub',g1:'twsm_g1',g2:'twsm_g2',g3:'twsm_g3'};let mem={};function raw(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}function put(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}function load(k,def){try{const v=JSON.parse(raw(k));return(v&&typeof v==='object')?Object.assign(JSON.parse(JSON.stringify(def)),v):JSON.parse(JSON.stringify(def))}catch(e){return JSON.parse(JSON.stringify(def))}}function save(k,o){put(k,JSON.stringify(o))}const settings=load(K.settings,{sound:true,autoText:false});function saveSettings(){save(K.settings,settings)}function meta(){var m=load(K.meta,{miles:0,badges:[],wallpapers:[],crossUnlocks:[]});if(typeof m.miles!=='number'||isNaN(m.miles))m.miles=Number(m.miles)||0;if(!Array.isArray(m.badges))m.badges=[];if(!Array.isArray(m.wallpapers))m.wallpapers=[];if(!Array.isArray(m.crossUnlocks))m.crossUnlocks=[];return m}function saveMeta(m){save(K.meta,m)}function addMiles(n){const m=meta();m.miles+=n;saveMeta(m);return m.miles}function grantBadge(id){const m=meta();if(!m.badges.includes(id)){m.badges.push(id);saveMeta(m);return true}return false}function hasBadge(id){return meta().badges.includes(id)}function unlock(id){const m=meta();if(!m.crossUnlocks.includes(id)){m.crossUnlocks.push(id);saveMeta(m);return true}return false}function hasUnlock(id){return meta().crossUnlocks.includes(id)}let ac=null,master=null;function audio(){if(!ac){try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();master=ac.createGain();master.gain.value=settings.sound?0.6:0;master.connect(ac.destination)}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}function bg(h){try{if(ac){if(h){if(ac.suspend)ac.suspend();}else{if(ac.resume)ac.resume();}}}catch(e){}}function setMute(m){settings.sound=!m;saveSettings();if(master&&ac)master.gain.setTargetAtTime(m?0:0.6,ac.currentTime,0.01)}function tone(freq,dur,opt={}){const c=audio();if(!c||!settings.sound)return;const o=c.createOscillator(),g=c.createGain();o.type=opt.type||'sine';o.frequency.value=freq;if(opt.to)o.frequency.exponentialRampToValueAtTime(opt.to,c.currentTime+dur);const v=opt.vol==null?0.3:opt.vol;g.gain.value=v;g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);o.connect(g);g.connect(master);o.start();o.stop(c.currentTime+dur)}function chord(fs,dur,opt={}){fs.forEach((f,i)=>setTimeout(()=>tone(f,dur,opt),i*(opt.stagger||60)))}return{K,load,save,settings,saveSettings,meta,saveMeta,addMiles,grantBadge,hasBadge,unlock,hasUnlock,audio,setMute,bg,tone,chord}})();

function pickIcon(job,i,good){

   else if(flaw===1){subX=10;subR=5;} // 被写体が端で小さい

 }

// find: tap N targets in grid within time
function miniFind(job,cb){
 const N=3, size=16, total=16;
 const targets=new Set();while(targets.size<N)targets.add(Math.floor(Math.random()*total));
 let found=0,time=8;
 const icon=job.variant==='thermal'?'🔥':job.variant==='color'?'🟩':job.variant==='dirt'?'⬛':job.variant==='danger'?'⚠':'✕';
 jobShell(job,`<div class="mq">${job.variant==='thermal'?'熱いところ':job.variant==='color'?'色のちがう区画':job.variant==='dirt'?'汚れ':job.variant==='danger'?'危険物':'ヒビ'}を ${N}つ 見つけてタップ！</div>
  <div class="timer-bar"><i id="tb"></i></div>
  <div class="grid" id="grid" style="grid-template-columns:repeat(4,1fr)">${Array.from({length:total},(_,i)=>`<div class="cell" data-i="${i}"></div>`).join('')}</div>`);
 const cells=[...document.querySelectorAll('.cell')];
 // reveal targets subtly: give a faint hint by tiny dot only when tapped correct; players must hunt. Add mild visual noise.
 cells.forEach(c=>{const i=+c.dataset.i; c.onclick=()=>{
   if(c.classList.contains('hit'))return;
   if(targets.has(i)){c.classList.add('hit');c.textContent=icon;found++;TW.tone(800+found*80,0.08,{vol:.14});if(found>=N){clearInterval(iv);const q=time>4?'great':'ok';cb(q);}}
   else{TW.tone(300,0.1,{type:'square',vol:.1});time=Math.max(0,time-1.2);}
 };});
 // to be findable without pure luck, briefly flash targets at start
 setTimeout(()=>{targets.forEach(i=>{cells[i].style.background='#fff2cf';});setTimeout(()=>{cells.forEach((c,i)=>{if(!c.classList.contains('hit'))c.style.background='';});},900);},200);
 const tb=document.getElementById('tb');const t0=time;
 const iv=setInterval(()=>{time-=0.1;tb.style.width=Math.max(0,time/t0*100)+'%';if(time<=0){clearInterval(iv);cb(found>=2?'ok':'fail');}},100);
}

 function step(t){const dt=(t-last)/1000;last=t;pos+=dir*speed*dt;if(pos>100){pos=100;dir=-1;}if(pos<0){pos=0;dir=1;}mk.style.left=pos+'%';raf=requestAnimationFrame(step);}
 raf=requestAnimationFrame(step);

 const winUp=()=>{hold=false;};
 c.addEventListener('pointerdown',e=>{e.preventDefault();hold=true;});

   vy+=(hold?-(heavy?520:640):(heavy?520:380))*dt;vy=Math.max(-260,Math.min(260,vy));dy+=vy*dt;

     if(Math.abs(gt.x-60)<6&&!gt.scored){gt.scored=true;if(dy>gt.y&&dy<gt.y+gt.gap){passed++;TW.tone(800,0.08,{vol:.12});}else{TW.tone(300,0.1,{vol:.1});}}}});

function finishJob(job,quality){
 // param threshold effect
 const ax=job.ax==='all'?pickWeakest():job.ax;
 const p=g.params[ax];
 let boost=g.restBoost?0.12:0;g.restBoost=false;
 let effect=(quality==='great'?0.85:quality==='ok'?0.55:0.2)+boost+(p-job.req)/200;
 let result= effect>0.7?'大成功':effect>0.4?'成功':'しっぱい';
 // apply params: main +gain, sub +subGain
 const gain=result==='大成功'?12:result==='成功'?8:2;
 const subGain=result==='大成功'?6:result==='成功'?4:0;
 const addP=(k,v)=>g.params[k]=Math.max(0,Math.min(100,g.params[k]+v));
 if(job.ax==='all'){['ude','shinrai','waku'].forEach(k=>addP(k,gain));}
 else{
   addP(job.ax,gain);
   const subMap={ude:'shinrai',shinrai:'waku',waku:'ude'};
   addP(subMap[job.ax],subGain);
   if(result==='しっぱい'&&job.ax==='shinrai')addP('shinrai',-3);
 }
 // mile + counters
 const mile=result==='大成功'?15:result==='成功'?10:5;
 g.mileBuffer+=mile; g.totalJobs++;
 g._lastJobResult={job,result};
 // fail streak safety
 g._failStreak=result==='しっぱい'?(g._failStreak||0)+1:0;
 // badge
 if(g.totalJobs>=20&&TW.grantBadge('b13'))queueBadge('はたらきもの');
 TW.save(TW.K.g3,g);
 renderHeader(true);
 jobResult(job,result,mile);
}

function runQuiz(done){
 // pick a theme not cleared, else random
 let theme=QUIZ.find(q=>!g.quizPool.cleared.includes(q.th));

 // build 3 questions from same theme? We have 1 per theme in data; treat as 3 sub-Qs by using theme q plus 2 generated -> simplify: 3 different themes as a "set"
 const set=[];const used=new Set();
 // first the target theme, then 2 more uncleared/random
 set.push(theme);used.add(theme.th);
 while(set.length<3){const q=QUIZ[Math.floor(Math.random()*QUIZ.length)];if(!used.has(q.th)){used.add(q.th);set.push(q);}}
 let idx=0,correct=0;

function drawMiniBar(x,px,py,label,v,col){x.fillStyle='#8595ad';x.textAlign='left';x.fillText(label,px,py);x.fillStyle='#eef2f6';roundr(x,px+70,py-10,200,12,6);x.fill();x.fillStyle=col;roundr(x,px+70,py-10,200*Math.min(100,v)/100,12,6);x.fill();x.fillStyle='#2C3E66';x.textAlign='right';x.fillText(Math.round(v),px+290,py);x.textAlign='left';}
function wrap(x,text,cx,cy,maxw,lh){const words=text.split('');let line='',y=cy;for(let i=0;i<words.length;i++){const test=line+words[i];if(x.measureText(test).width>maxw){x.fillText(line,cx,y);line=words[i];y+=lh;}else line=test;}x.fillText(line,cx,y);}
function roundr(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}

/* ---- fx/util ---- */
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function confetti(){vib(15);const box=document.createElement('div');box.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden';document.body.appendChild(box);const cols=['#ffd76a','#ff8f5a','#7ec8e3','#6fcf97'];const canAnim=typeof document.createElement('div').animate==='function';for(let i=0;i<40;i++){const p=document.createElement('div');const s=6+Math.random()*6;p.style.cssText=`position:absolute;top:-10px;left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${cols[i%4]};border-radius:2px;transform:rotate(${Math.random()*360}deg);transition:transform 1.6s ease-in,opacity 1.6s`;box.appendChild(p);const dur=1200+Math.random()*1200;if(canAnim){p.animate([{transform:`translateY(0) rotate(0)`},{transform:`translateY(${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:dur,easing:'ease-in'});}else{requestAnimationFrame(()=>{p.style.transform=`translateY(${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`;p.style.opacity='0';});}setTimeout(()=>p.remove(),dur);}setTimeout(()=>box.remove(),2600);TW.chord([660,880,1100,1320],0.2,{type:'triangle',vol:.14});}
let badgeQueue=[];
function queueBadge(n){badgeQueue.push(n);}
function flushBadges(){badgeQueue.forEach((n,i)=>setTimeout(()=>toast('バッジ獲得：'+n,'#ffb54d'),i*850));badgeQueue=[];}
function toast(m,c){const t=document.createElement('div');t.textContent=m;t.style.cssText=`position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:${c||'#2C3E66'};color:#fff;padding:11px 18px;border-radius:20px;font-weight:800;font-size:13px;z-index:50;box-shadow:var(--shadow);max-width:88%;text-align:center`;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
document.addEventListener('visibilitychange',()=>{TW.bg(document.hidden);});

start();
