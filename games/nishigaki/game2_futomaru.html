<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ニシーの果樹園バッサリ！｜ニシガキ工業</title>
<style>
:root{
  --amber:#D98E32; --steel:#AEB6BB; --deep:#2E5E3A; --leaf:#7CB342;
  --forge:#E8590C; --night:#1C2B33; --cream:#F6EFE3;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--night);
  font-family:'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','BIZ UDGothic',sans-serif;}
#stage{position:fixed;left:50%;top:50%;transform-origin:center center;width:420px;height:740px;}
#cv{position:absolute;left:0;top:0;width:420px;height:740px;touch-action:none;display:block;}
.uibtn{position:absolute;z-index:40;cursor:pointer;color:var(--cream);
  background:rgba(28,43,51,.78);border:1.5px solid rgba(246,239,227,.35);
  border-radius:20px;padding:7px 14px;font-size:14px;font-weight:bold;
  font-family:inherit;}
.uibtn:active{transform:scale(.94);}
#backBtn{left:10px;top:10px;text-decoration:none;}
#muteBtn{right:10px;top:10px;height:36px;padding:0 12px;font-size:13px;}
.scr{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;color:var(--cream);}
.scr.on{display:flex;}
#titleScr{background:linear-gradient(180deg,rgba(28,43,51,.10) 0%,rgba(28,43,51,.62) 70%,rgba(18,30,36,.94) 100%);}
#titleLogoImg{max-width:340px;display:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));}
.logoFall{line-height:1.1;transform:rotate(-2deg);}
.logoFall .l1{font-size:21px;font-weight:bold;color:var(--cream);letter-spacing:5px;
  text-shadow:0 2px 0 #14201f,0 0 14px rgba(0,0,0,.5);}
.logoFall .l2{font-size:50px;font-weight:900;color:var(--amber);letter-spacing:1px;
  -webkit-text-stroke:2px #5c3a10;
  text-shadow:0 4px 0 #5c3a10,0 8px 16px rgba(0,0,0,.55);}
.logoFall .l3{font-size:46px;font-weight:900;color:var(--forge);letter-spacing:3px;
  -webkit-text-stroke:1.5px #F6EFE3;
  text-shadow:0 4px 0 #7a2d05,0 8px 18px rgba(0,0,0,.55);}
#titleSub{margin-top:13px;font-size:13px;opacity:.94;line-height:1.75;}
#bestLine{margin-top:9px;font-size:14px;color:#ffd98c;font-weight:bold;}
#startBtn{margin-top:24px;font-size:22px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,#ff7a26,var(--forge));border:none;border-radius:40px;
  padding:16px 54px;cursor:pointer;font-family:inherit;letter-spacing:3px;
  box-shadow:0 6px 0 #92380a,0 10px 24px rgba(0,0,0,.45);
  animation:pulse 1.15s ease-in-out infinite;}
#startBtn:active{transform:scale(.95);}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);
  box-shadow:0 6px 0 #92380a,0 14px 34px rgba(232,89,12,.55);}}
#zukanBtn{margin-top:15px;font-size:14px;background:rgba(246,239,227,.12);
  border:1.5px solid rgba(246,239,227,.4);border-radius:24px;color:var(--cream);
  padding:9px 26px;cursor:pointer;font-family:inherit;font-weight:bold;}
#titleNishie{margin-top:6px;}
/* チュートリアル */
#tutScr{background:rgba(20,32,38,.66);justify-content:flex-end;padding-bottom:120px;}
#tutBox{width:340px;background:var(--cream);color:#2b2b23;border-radius:18px;
  padding:16px 18px 14px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.5);}
#tutBox:after{content:'';position:absolute;left:44px;bottom:-14px;
  border:10px solid transparent;border-top:15px solid var(--cream);border-bottom:none;}
#tutTxt{font-size:15px;line-height:1.8;font-weight:bold;text-align:left;min-height:80px;}
#tutTxt b{color:var(--forge);}
#tutNext{margin-top:10px;font-size:15px;font-weight:900;background:var(--forge);color:#fff;
  border:none;border-radius:22px;padding:9px 30px;cursor:pointer;font-family:inherit;}
#tutDots{margin-top:8px;letter-spacing:6px;color:#8b8674;font-size:12px;}
#tutNishieWrap{margin-top:18px;align-self:flex-start;margin-left:20px;}
/* リザルト */
#resultScr{background:rgba(20,32,38,.82);}
#resultCard{width:344px;background:linear-gradient(180deg,#fbf6ea,#efe4cd);color:#33301f;
  border-radius:22px;padding:20px 18px 18px;box-shadow:0 14px 40px rgba(0,0,0,.55);
  animation:cardIn .45s cubic-bezier(.2,1.4,.4,1);}
@keyframes cardIn{0%{transform:translateY(50px) scale(.8);opacity:0;}100%{transform:none;opacity:1;}}
#resTitle{font-size:20px;font-weight:900;color:var(--deep);letter-spacing:2px;}
#resScore{font-size:44px;font-weight:900;color:var(--forge);margin-top:2px;
  text-shadow:0 2px 0 rgba(122,45,5,.25);}
.resRow{display:flex;justify-content:space-between;font-size:14px;font-weight:bold;
  padding:5px 8px;border-bottom:1px dashed #c9bc9c;}
.resRow .v{color:#7a4a10;}
#resRank{margin:10px auto 4px;font-size:17px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,var(--amber),#b06f1e);display:inline-block;
  border-radius:26px;padding:8px 30px;letter-spacing:4px;box-shadow:0 4px 0 #7d4f14;}
#resBest{font-size:13px;font-weight:900;color:var(--forge);margin-top:6px;min-height:18px;}
#resUnlock{font-size:12.5px;font-weight:bold;color:#245331;margin-top:6px;min-height:16px;line-height:1.6;}
.resBtns{margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.resBtns button{font-family:inherit;font-weight:900;font-size:15px;border:none;border-radius:26px;
  padding:11px 22px;cursor:pointer;}
#againBtn{background:linear-gradient(180deg,#ff7a26,var(--forge));color:#fff;
  box-shadow:0 4px 0 #92380a;animation:pulse 1.2s ease-in-out infinite;}
#resZukanBtn{background:var(--deep);color:var(--cream);box-shadow:0 4px 0 #1d3d26;}
#resTitleBtn{background:#d8cdb4;color:#4a4433;box-shadow:0 4px 0 #a99e85;}
/* 図鑑 */
#zukanScr{background:rgba(20,32,38,.9);justify-content:flex-start;padding-top:56px;overflow-y:auto;}
#zukanHead{font-size:20px;font-weight:900;letter-spacing:3px;color:#ffd98c;margin-bottom:4px;}
#zukanSub{font-size:12px;opacity:.85;margin-bottom:12px;}
.zcard{width:344px;background:linear-gradient(180deg,#fbf6ea,#efe4cd);color:#33301f;border-radius:16px;
  padding:12px 14px;margin-bottom:10px;text-align:left;box-shadow:0 6px 16px rgba(0,0,0,.4);
  display:flex;gap:12px;align-items:center;}
.zcard.locked{background:rgba(246,239,227,.10);color:rgba(246,239,227,.55);box-shadow:none;}
.zcard .zic{width:56px;height:56px;flex:0 0 56px;}
.zcard .zn{font-size:15px;font-weight:900;color:var(--deep);}
.zcard.locked .zn{color:rgba(246,239,227,.7);}
.zcard .zt{font-size:12px;line-height:1.6;margin-top:2px;}
#zukanClose{margin:8px 0 30px;font-size:15px;font-weight:900;background:var(--forge);color:#fff;
  border:none;border-radius:24px;padding:10px 40px;cursor:pointer;font-family:inherit;}
</style>

<div id="stage">
  <canvas id="cv" width="420" height="740"></canvas>

<script>
'use strict';
/*CORE_START*/
var G2Core = (function(){
'use strict';
/* ===== 文言定数（表示名の変更はここだけ） ===== */
var TEXT = {
  mascot: 'ニシー',
  gameTitle: 'ニシーの果樹園バッサリ！',
  company: 'ニシガキ工業',
  toolFutomaru: '太丸',
  toolLR: 'のびのび高枝切',
  toolFever: '太丸充電プロ',
  justMsg: '切り口がキレイやで！',
  ladderMsg: 'ハシゴがグラグラ…あぶないで！',
  fallMsg: 'ワシ、落ちてもうた！包帯ぐるぐる…',
  fallHint: 'LRツールなら地面から安全やで！',
  budMsg: '新芽は未来の枝やで！',
  nestMsg: '鳥の巣はそっとやで！',
  tooThickMsg: 'タップは25mmまでや！長押しでテコやで！',
  wrongToolMsg: '低い枝は太丸やで！',
  feverMsg: '太丸充電プロや！40mmが1秒やで！',
  harvestMsg: '収穫量ボーナス',
  copy: 'Increase Fruit Yield and Quality!'
};
/* ===== 調整定数 ===== */
var CONST = {
  TIME: 90,
  ZONE_SPLIT: 400,            /* y<400=高所 / y>=400=低所 */
  JUST: 5, GOOD: 12,          /* 切断ライン誤差px（JUST<=5, GOOD<=12, それ以外OK） */
  BASE: { JUST: 300, GOOD: 150, OK: 60 },
  THICK_MULT: { 10: 1, 25: 1.5, 40: 2 },
  TAP_MAX: 25,                /* 太丸タップ切りの上限mm */
  LEVER_MAX: 40,              /* 太丸テコ切りの上限mm */
  CHARGE_NEED: 0.9,           /* テコゲージ必要量(0..1) */
  PENALTY: 300,               /* 新芽・鳥の巣ペナルティ */
  FRUIT: { JUST: 2, GOOD: 1, OK: 0 },
  FRUIT_BONUS: 40,            /* 果実1個あたりの収穫ボーナス */
  GAUGE_MAX: 100,
  GAUGE_GAIN: { JUST: 18, GOOD: 12, OK: 7 },
  FEVER_TIME: 10, FEVER_MULT: 2,
  LADDER_FALL_AT: 2,          /* ハシゴ警告がこの回数で落下 */
  FALL_LOCK: 2.5,             /* 落下ロス秒 */
  COMBO_STEP: 10, COMBO_CAP: 10,
  SPAWN_DELAY: 0.9,           /* 切断後スロット再生成までの秒 */
  LATE_AT: 30,                /* 残り秒がこれ以下で終盤（山場）モード */
  LATE_40: 0.5                /* 終盤の低所40mm出現率 */
};
var RANKS = [
  { min: 9500, name: '匠' },
  { min: 5500, name: '職人' },
  { min: 2500, name: '庭師' },
  { min: 0,    name: '見習い' }
];
/* 図鑑（実トリビア） */
var ZUKAN = [
  { id: 'mini600',  name: '太丸ミニ 600',    need: 0,
    trivia: '太丸シリーズの入門サイズ。高級刃物鋼＋テフロン加工で切れ味が長持ちする。' },
  { id: 'futomaru', name: '太丸 1500',       need: 3000,
    trivia: 'テコの力で生木40mmを軽く切るロングセラー。ハサミは110度回転、0.6〜2.0Mの5タイプ。' },
  { id: 'nobinobi', name: 'のびのび高枝切',  need: 8000,
    trivia: '世界初の高枝切鋏はニシガキから。八角形ポールは軽くて丈夫、高い枝も地面から安全に切れる。' },
  { id: 'edauchi',  name: '枝打ち一発',      need: 15000,
    trivia: '枝打ち用の鋸。刃物のまち・三木金物の職人技が生んだ切れ味で、高い枝もスパッと落とす。' },
  { id: 'chargepro',name: '太丸充電プロ',    need: 25000,
    trivia: '14.4Vの電動太枝切。40mmの太枝がわずか1秒で切れる。プロ果樹農家の強い味方。' }
];
/* 枝スロット（8箇所）: side=-1左/+1右 */
var SLOTS = [
  { y: 150, side:  1, zone: 'high' },
  { y: 215, side: -1, zone: 'high' },
  { y: 285, side:  1, zone: 'high' },
  { y: 350, side: -1, zone: 'high' },
  { y: 450, side:  1, zone: 'low' },
  { y: 515, side: -1, zone: 'low' },
  { y: 578, side:  1, zone: 'low' },
  { y: 636, side: -1, zone: 'low' }
];
/* ===== 乱数（seed指定でテスト再現可能） ===== */
function makeRng(seed) {
  var s = (seed >>> 0) || 88675123;
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* ===== ゲーム状態 ===== */
function createGame(seed) {
  return {
    time: CONST.TIME, over: false,
    score: 0, combo: 0, maxCombo: 0,
    gauge: 0, fever: 0, feverCount: 0,
    ladder: 0,          /* ハシゴ危険カウンタ */
    lock: 0,            /* 落下ロス残り秒 */
    fruits: 0, cuts: 0, justCount: 0, penalties: 0, falls: 0,
    tool: 'futomaru',   /* 'futomaru' | 'lr' */
    items: new Array(SLOTS.length).fill(null),
    respawn: new Array(SLOTS.length).fill(0),
    rng: makeRng(seed || (Date.now() & 0xffffffff))
  };
}
function isFever(st) { return st.fever > 0; }
/* ===== 枝の生成 =====
   force: {slot, kind, thick} でテスト用に固定生成できる
   終盤（残りLATE_AT秒以下）は高所スロット優先＋低所40mm率アップで山場を作る */
function spawnBranch(st, force) {
  force = force || {};
  var late = !st.over && st.time <= CONST.LATE_AT;
  var slot = (typeof force.slot === 'number') ? force.slot : -1;
  if (slot < 0 && late) {
    for (var h = 0; h < SLOTS.length; h++) {
      if (!st.items[h] && st.respawn[h] <= 0 && SLOTS[h].zone === 'high') { slot = h; break; }
    }
  }
  if (slot < 0) {
    for (var i = 0; i < SLOTS.length; i++) {
      if (!st.items[i] && st.respawn[i] <= 0) { slot = i; break; }
    }
  }
  if (slot < 0 || st.items[slot]) return null;
  var def = SLOTS[slot];
  var r = st.rng();
  var kind = force.kind ||
    (r < 0.12 ? 'bud' : r < 0.19 ? 'nest' : 'branch');
  var thick = force.thick || 0;
  if (!thick) {
    var t = st.rng();
    if (def.zone === 'high') thick = t < 0.55 ? 10 : 25;
    else if (late) thick = t < 0.18 ? 10 : t < 1 - CONST.LATE_40 ? 25 : 40;
    else thick = t < 0.34 ? 10 : t < 0.70 ? 25 : 40;
  }
  if (kind !== 'branch') thick = 10;
  var item = {
    slot: slot, zone: def.zone, side: def.side, y: def.y,
    kind: kind, thick: thick,
    len: 96 + Math.floor(st.rng() * 36),
    cutT: 0.42 + st.rng() * 0.2,   /* 切断ライン位置(枝の付け根からの割合) */
    age: 0, anim: 0
  };
  st.items[slot] = item;
  return item;
}
/* ===== 切断試行 =====
   offset: 切断ラインからの誤差px / opts.charge: テコゲージ(0..1) */
function attemptCut(st, item, offset, opts) {
  opts = opts || {};
  if (st.over) return { type: 'over' };
  if (st.lock > 0) return { type: 'locked' };
  if (!item) return { type: 'miss' };
  /* 1) 届くか？ 高所×太丸＝ハシゴ危険 */
  if (st.tool === 'futomaru' && item.zone === 'high') {
    st.ladder++;
    if (st.ladder >= CONST.LADDER_FALL_AT) {
      st.ladder = 0; st.falls++; st.combo = 0;
      st.lock = CONST.FALL_LOCK;
      return { type: 'fall', msg: TEXT.fallMsg, hint: TEXT.fallHint };
    }
    return { type: 'ladder', count: st.ladder, msg: TEXT.ladderMsg };
  }
  if (st.tool === 'lr' && item.zone === 'low') {
    return { type: 'wrongTool', msg: TEXT.wrongToolMsg };
  }
  /* 2) 禁止対象（新芽・鳥の巣） */
  if (item.kind !== 'branch') {
    st.score = Math.max(0, st.score - CONST.PENALTY);
    st.combo = 0; st.penalties++;
    st.items[item.slot] = null;
    st.respawn[item.slot] = CONST.SPAWN_DELAY;
    return {
      type: 'forbidden', kind: item.kind, penalty: CONST.PENALTY,
      msg: item.kind === 'bud' ? TEXT.budMsg : TEXT.nestMsg
    };
  }
  /* 3) 太さ判定（太丸のみ。フィーバー中は一撃） */
  if (st.tool === 'futomaru' && !isFever(st) &&
      item.thick > CONST.TAP_MAX && (opts.charge || 0) < CONST.CHARGE_NEED) {
    return { type: 'tooThick', msg: TEXT.tooThickMsg };
  }
  /* 4) 切断成功 → JUST/GOOD/OK */
  var off = Math.abs(offset || 0);
  var grade = off <= CONST.JUST ? 'JUST' : off <= CONST.GOOD ? 'GOOD' : 'OK';
  var pts = Math.round(CONST.BASE[grade] * CONST.THICK_MULT[item.thick]);
  pts += Math.min(st.combo, CONST.COMBO_CAP) * CONST.COMBO_STEP;
  if (isFever(st)) pts *= CONST.FEVER_MULT;
  st.combo++;
  if (st.combo > st.maxCombo) st.maxCombo = st.combo;
  st.score += pts; st.cuts++;
  if (grade === 'JUST') st.justCount++;
  var fruit = CONST.FRUIT[grade];
  st.fruits += fruit;
  var feverStart = false;
  if (!isFever(st)) {
    st.gauge += CONST.GAUGE_GAIN[grade];
    if (st.gauge >= CONST.GAUGE_MAX) {
      st.gauge = 0; st.fever = CONST.FEVER_TIME;
      st.feverCount++; feverStart = true;
    }
  }
  st.items[item.slot] = null;
  st.respawn[item.slot] = CONST.SPAWN_DELAY;
  return {
    type: 'cut', grade: grade, pts: pts, fruit: fruit,
    feverStart: feverStart,
    msg: grade === 'JUST' ? TEXT.justMsg : ''
  };
}
/* ===== 時間経過 ===== */
function tick(st, dt) {
  if (st.over) return;
  if (st.lock > 0) st.lock = Math.max(0, st.lock - dt);
  if (st.fever > 0) st.fever = Math.max(0, st.fever - dt);
  for (var i = 0; i < SLOTS.length; i++) {
    if (st.respawn[i] > 0) st.respawn[i] = Math.max(0, st.respawn[i] - dt);
  }
  st.time -= dt;
  if (st.time <= 0) { st.time = 0; st.over = true; }
}
/* ===== 集計・ランク ===== */
function finalize(st) {
  var harvest = st.fruits * CONST.FRUIT_BONUS;
  var total = st.score + harvest;
  return {
    cutScore: st.score, harvest: harvest, total: total,
    fruits: st.fruits, maxCombo: st.maxCombo,
    falls: st.falls, penalties: st.penalties,
    rank: rankOf(total)
  };
}
function rankOf(total) {
  for (var i = 0; i < RANKS.length; i++) {
    if (total >= RANKS[i].min) return RANKS[i].name;
  }
  return RANKS[RANKS.length - 1].name;
}
/* ===== 図鑑（累計スコアで解放） ===== */
function unlockedZukan(totalCum) {

    ctx.beginPath(); ctx.arc(0, 0, 18, -Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    ctx.strokeStyle = pr >= K.CHARGE_NEED ? '#ffd24a' : '#E8590C'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(0, 0, 18, -Math.PI / 2, -Math.PI / 2 + pr * Math.PI * 2); ctx.stroke();
    ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(pr >= K.CHARGE_NEED ? '離せ!' : 'テコ!', 0, 4);
    ctx.restore();
  }
  /* フィーバーバナー */
  if (fx.feverBanner > 0) {
    var fb = fx.feverBanner;
    var bx = fb > 0.8 ? (fb - 0.8) / 0.2 * -420 : fb < 0.15 ? (1 - fb / 0.15) * 420 : 0;
    ctx.save(); ctx.translate(bx, 0);
    ctx.fillStyle = 'rgba(232,89,12,.92)';
    ctx.fillRect(0, 330, W, 62);
    ctx.font = '900 24px sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(TX.feverMsg, W / 2, 368);
    ctx.restore();
  }
  /* 中央ヒント（落下時など） */
  if (fx.hintT > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, fx.hintT);
    ctx.font = '900 19px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(28,43,51,.9)';
    ctx.strokeText(fx.hint, W / 2, 300);
    ctx.fillStyle = '#ffd24a'; ctx.fillText(fx.hint, W / 2, 300);
    ctx.restore();
  }
}
/* ---- 入力 ---- */
function toLogical(e) {
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function hitTool(p) {
  for (var i = 0; i < TOOL_BTNS.length; i++) {
    var b = TOOL_BTNS[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b.id;
  }
  return null;
}
function hitItem(p) {
  var best = null, bd = 1e9;
  for (var i = 0; i < st.items.length; i++) {
    var it = st.items[i];
    if (!it) continue;
    var gm = branchGeom(it);
    var x0 = Math.min(gm.baseX, gm.tipX) - 16, x1 = Math.max(gm.baseX, gm.tipX) + 24;
    if (p.x >= x0 && p.x <= x1 && Math.abs(p.y - it.y) <= 34) {
      var d = Math.abs(p.x - gm.cutX) + Math.abs(p.y - it.y) * 0.3;
      if (d < bd) { bd = d; best = it; }
    }
  }
  return best;
}
function switchTool(id) {
  if (st.tool === id) return;
  st.tool = id;
  fx.toolFlash = 1; fx.mood = 'point'; fx.moodT = 0.5;
  se.swap();
  cancelCharge();
}
function cancelCharge() { fx.charging = false; fx.chargeItem = null; fx.chargeT = 0; }
var chargeTick = 0;
cv.addEventListener('pointerdown', function (e) {
  unlockAudio();
  if (scene !== 'play' || paused) return;
  var p = toLogical(e);
  var tb = hitTool(p);
  if (tb) { se.btn(); switchTool(tb); return; }
  if (st.over || st.lock > 0) return;
  var it = hitItem(p);
  if (!it) { addLeaves(p.x, p.y, 3); return; }
  /* 低所×太丸×40mm＝長押しテコ */
  if (st.tool === 'futomaru' && !C.isFever(st) && it.zone === 'low' &&
      it.kind === 'branch' && it.thick > K.TAP_MAX) {
    fx.charging = true; fx.chargeItem = it; fx.chargeT = 0; chargeTick = 0;
    fx.pressP = p;
    return;
  }
  resolveCut(it, p, 0);
});
cv.addEventListener('pointerup', function (e) {
  if (scene !== 'play' || paused) return;
  if (fx.charging && fx.chargeItem) {
    var it = fx.chargeItem, ch = Math.min(1, fx.chargeT);
    var p = fx.pressP || toLogical(e);
    cancelCharge();
    if (st.items[it.slot] === it) resolveCut(it, p, ch);
  }
});
cv.addEventListener('pointercancel', cancelCharge);
window.addEventListener('keydown', function (e) {
  if (scene !== 'play') return;
  if (e.key === '1') switchTool('futomaru');
  if (e.key === '2') switchTool('lr');
});
/* ---- 切断結果 → 演出 ---- */
function resolveCut(it, p, charge) {
  var gm = branchGeom(it);
  var off = p.x - gm.cutX;
  var res = C.attemptCut(st, it, off, { charge: charge });
  var cx = gm.cutX, cy = it.y;
  if (res.type === 'cut') {
    var gold = res.grade === 'JUST';
    addChips(cx, cy, gold ? 26 : it.thick === 40 ? 20 : 12, gold);
    addLeaves(gm.tipX, cy, 5);
    stumps.push({ x: gm.baseX, y: cy, dir: it.side, hw: thickPx(it.thick) / 2 + 1, t: 0, gold: gold });
    fallers.push({ x: cx, y: cy, dir: it.side, len2: it.len * (1 - it.cutT),
      hw: thickPx(it.thick) / 2, vy: -60, rot: 0, vr: it.side * (2 + Math.random() * 2), t: 0 });
    addFloat(cx, cy - 30, '+' + res.pts, gold ? '#ffd24a' : '#F6EFE3', gold);
    if (gold) {
      addFloat(cx, cy - 58, TX.justMsg, '#ffd24a', true);
      addBurst(cx, cy, '#ffd76e', 10);
      se.just(); fx.shake = Math.max(fx.shake, 3);
      fx.mood = 'joy'; fx.moodT = 0.8;
    } else {
      addFloat(cx, cy - 52, res.grade, res.grade === 'GOOD' ? '#a5e06a' : '#F6EFE3');
    }
    if (it.thick === 40) { se.thick(); fx.shake = Math.max(fx.shake, 4); }
    else se.snip();
    /* 果実が実る */
    for (var f2 = 0; f2 < res.fruit; f2++) {
      fruitsOnTree.push({
        x: gm.baseX + it.side * (14 + f2 * 16), y: cy + 14,
        t: -f2 * 0.14, ph: Math.random() * 6.3
      });
      setTimeout(se.fruit, 200 + f2 * 160);
    }
    if (res.fruit > 0) addFloat(cx, cy + 6, '実がなったで！ +' + res.fruit, '#ffb054');
    if (res.feverStart) {
      fx.feverBanner = 1; se.fever(); fx.shake = Math.max(fx.shake, 5);
      fx.mood = 'joy'; fx.moodT = 1.2;
    }
    if (st.combo >= 2) fx.comboPop = 1;
  } else if (res.type === 'ladder') {
    fx.ladderT = 1.25; fx.ladderY = it.y; fx.ladderSide = it.side;
    addFloat(W / 2, 320, TX.ladderMsg, '#ffd24a', true);
    se.ladder(); fx.shake = Math.max(fx.shake, 2.5);
    fx.mood = 'sad'; fx.moodT = 1.2;
  } else if (res.type === 'fall') {
    fx.fallT = K.FALL_LOCK; fx.ladderY = it.y; fx.ladderSide = it.side; fx.ladderT = 0;
    fx.hint = TX.fallHint; fx.hintT = K.FALL_LOCK;
    addFloat(W / 2, 260, TX.fallMsg, '#ff8a5c', true);
    se.fall(); fx.shake = 9;
  } else if (res.type === 'forbidden') {
    addBurst(cx, cy, '#ff6a3c', 8);
    addFloat(cx, cy - 30, '-' + res.penalty, '#ff6a3c', true);
    addFloat(cx, cy - 58, res.msg, '#ff8a5c');
    se.bad(); fx.shake = Math.max(fx.shake, 5);
    fx.mood = 'sad'; fx.moodT = 1;
  } else if (res.type === 'tooThick') {
    it.anim = 0.72; /* ぷるぷるバウンス */
    addFloat(cx, cy - 34, res.msg, '#ffd24a');
    se.thick();
  } else if (res.type === 'wrongTool') {
    addFloat(cx, cy - 34, res.msg, '#ffd24a');
    se.bad();
  }
}
/* ---- 画面遷移 ---- */
function show(id, on) { $(id).classList.toggle('on', on); }
function startGame() {
  st = C.createGame();
  fruitsOnTree = []; stumps = []; fallers = []; parts.length = 0; floats.length = 0;
  fx.shake = 0; fx.ladderT = 0; fx.fallT = 0; fx.feverBanner = 0;
  fx.hintT = 0; fx.mood = 'normal'; fx.moodT = 0;
  cancelCharge();
  for (var i = 0; i < C.SLOTS.length; i++) C.spawnBranch(st);
  scene = 'play';
  show('titleScr', false); show('resultScr', false); show('zukanScr', false);
  if (!save.tut) openTutorial(); else paused = false;
}
/* ---- チュートリアル（初回のみ・3枚） ---- */
var TUT = [
  { mood: 'normal', txt: '低い枝は <b>太丸</b> でタップや！<br>40mmの太い枝は <b>長押し→テコゲージ</b> がたまったら離してバッサリやで！' },
  { mood: 'point', txt: '高い枝はボタンで <b>のびのび高枝切</b> に持ち替えるんや！<br>ハシゴいらずで、<b>地面から安全</b>に切れるで。' },
  { mood: 'joy', txt: '<b>新芽</b> と <b>鳥の巣</b> は切ったらアカンで！<br>ラインぴったり <b>JUST</b> で切ったら果実がたわわに実るで！' }
];
var tutIdx = 0;
function openTutorial() {
  paused = true; tutIdx = 0; show('tutScr', true); renderTut();
}
function renderTut() {
  var t2 = TUT[tutIdx];
  $('tutTxt').innerHTML = t2.txt;
  $('tutNext').textContent = tutIdx === TUT.length - 1 ? 'はじめる！' : 'つぎへ';
  var d = '';
  for (var i = 0; i < TUT.length; i++) d += i === tutIdx ? '●' : '○';
  $('tutDots').textContent = d;
  var tc = $('tutNishie').getContext('2d');
  tc.clearRect(0, 0, 140, 120);
  drawNishie(tc, 70, 112, 0.85, t2.mood, gTime);
}
$('tutNext').addEventListener('click', function () {
  se.btn(); tutIdx++;
  if (tutIdx >= TUT.length) {
    show('tutScr', false); paused = false;
    save.tut = 1; storeSave(save);
  } else renderTut();
});
/* ---- リザルト ---- */
var resMood = 'normal';
function finishGame() {
  scene = 'result';
  cancelCharge();
  var fin = C.finalize(st);
  var prevTotal = save.total, prevBest = save.best;
  save.total += fin.total;
  var isBest = fin.total > save.best;
  if (isBest) save.best = fin.total;
  storeSave(save);
  var newUnlocks = C.unlockedZukan(save.total).filter(function (id) {
    return C.unlockedZukan(prevTotal).indexOf(id) < 0;
  });
  se.finish();
  $('resCutPts').textContent = fin.cutScore + ' pt';
  $('resHarvest').textContent = '果実×' + fin.fruits + ' ＝ +' + fin.harvest + ' pt';
  $('resCombo').textContent = fin.maxCombo + '';
  $('resRank').textContent = 'ランク：' + fin.rank;
  $('resBest').textContent = isBest ? '★ ベスト更新！ ' + fin.total + ' pt ★'
    : 'ベスト ' + Math.max(prevBest, save.best) + ' pt';
  $('resUnlock').innerHTML = newUnlocks.length
    ? '図鑑解放！ ' + newUnlocks.map(function (id) {
        return '「' + C.ZUKAN.filter(function (z) { return z.id === id; })[0].name + '」';
      }).join('') : '';
  resMood = (isBest || fin.rank === '職人' || fin.rank === '匠') ? 'joy'
    : (fin.falls > 0 && fin.rank === '見習い') ? 'bandage' : 'normal';
  show('resultScr', true);
  /* スコアカウントアップ */
  var el = $('resScore'), t0 = performance.now();
  (function cnt(now) {
    var k = Math.min(1, (now - t0) / 900);
    el.textContent = Math.round(fin.total * easeOut(k)) + ' pt';
    if (k < 1) requestAnimationFrame(cnt);
  })(t0);
  updateTitleBest();
}
/* ---- 図鑑 ---- */
function openZukan() {
  var ul = C.unlockedZukan(save.total);
  $('zukanSub').textContent = '累計スコア ' + save.total + ' pt ／ 解放 ' + ul.length + '/' + C.ZUKAN.length;
  var list = $('zukanList');
  list.innerHTML = '';
  C.ZUKAN.forEach(function (z) {
    var got = ul.indexOf(z.id) >= 0;
    var card = document.createElement('div');
    card.className = 'zcard' + (got ? '' : ' locked');
    var ic = document.createElement('canvas');
    ic.width = 56; ic.height = 56; ic.className = 'zic';
    var txt = document.createElement('div');
    txt.innerHTML = '<div class="zn">' + (got ? z.name : '？？？') + '</div>' +
      '<div class="zt">' + (got ? z.trivia : '累計 ' + z.need + ' pt で解放') + '</div>';
    card.appendChild(ic); card.appendChild(txt);
    list.appendChild(card);
    var icc = ic.getContext('2d');
    if (got) drawToolIcon(icc, z.id, 28, 32, 1.1);
    else {
      icc.fillStyle = 'rgba(246,239,227,.35)';
      icc.font = '900 26px sans-serif'; icc.textAlign = 'center';
      icc.fillText('?', 28, 38);
    }
  });
  show('zukanScr', true);
}
$('startBtn').addEventListener('click', function () { unlockAudio(); se.btn(); startGame(); });
$('zukanBtn').addEventListener('click', function () { unlockAudio(); se.btn(); openZukan(); });
$('againBtn').addEventListener('click', function () { se.btn(); startGame(); });
$('resZukanBtn').addEventListener('click', function () { se.btn(); openZukan(); });
$('resTitleBtn').addEventListener('click', function () {
  se.btn(); scene = 'title';
  show('resultScr', false); show('titleScr', true);
});
$('zukanClose').addEventListener('click', function () { se.btn(); show('zukanScr', false); });
function updateTitleBest() {
  $('bestLine').textContent = save.best > 0
    ? 'ベスト ' + save.best + ' pt ／ 累計 ' + save.total + ' pt'
    : 'めざせ、匠の剪定！';
}
updateTitleBest();
/* ---- タブ非表示でポーズ ---- */
var hiddenPause = false;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { hiddenPause = true; cancelCharge(); }
  else { hiddenPause = false; last = performance.now(); }
});
/* ---- メインループ ---- */
var last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (hiddenPause) return;
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  gTime += dt;
  var t = gTime;
  var playing = scene === 'play' && !paused;
  if (playing) {
    C.tick(st, dt);
    /* スロット補充（少しずつ） */
    spawnTick -= dt;
    if (spawnTick <= 0) { C.spawnBranch(st); spawnTick = 0.22; }
    for (var i = 0; i < st.items.length; i++) {
      var it3 = st.items[i];
      if (it3) { it3.age += dt; it3.anim = Math.min(1, it3.anim + dt * 3.2); }
    }
    if (fx.charging) {
      fx.chargeT = Math.min(1, fx.chargeT + dt);
      chargeTick -= dt;
      if (chargeTick <= 0) { se.charge(fx.chargeT); chargeTick = 0.15; }
    }
    if (fx.moodT > 0) { fx.moodT -= dt; if (fx.moodT <= 0) fx.mood = 'normal'; }
    if (fx.toolFlash > 0) fx.toolFlash = Math.max(0, fx.toolFlash - dt * 3);
    if (fx.feverBanner > 0) fx.feverBanner = Math.max(0, fx.feverBanner - dt * 0.5);
    if (fx.hintT > 0) fx.hintT -= dt;
    if (st.over) { finishGame(); }
  }
  /* ---- 描画 ---- */
  ctx.save();
  if (fx.shake > 0) {
    fx.shake = Math.max(0, fx.shake - dt * 18);
    ctx.translate((Math.random() - 0.5) * fx.shake * 2, (Math.random() - 0.5) * fx.shake * 2);
  }
  drawBG(t);
  drawTree(t);
  if (scene === 'play' || scene === 'result') {
    drawStumps(paused ? 0 : dt);
    for (var j = 0; j < st.items.length; j++) {
      if (st.items[j]) drawItem(st.items[j], t);
    }
    drawFruits(t, paused ? 0 : dt);
    drawFallers(paused ? 0 : dt);
    var nishieBusy = drawLadderFx(t, paused ? 0 : dt);
    if (!nishieBusy) drawNishie(ctx, 64, GROUND_Y + 8, 0.86, fx.mood, t);
    /* フィーバー中の空気感 */
    if (C.isFever(st)) {
      ctx.fillStyle = 'rgba(232,89,12,' + (0.05 + Math.sin(t * 8) * 0.03) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    drawParts(paused ? 0 : dt);
    if (scene === 'play') drawHUD(t);
  } else {
    /* タイトル背景: そよぐ果樹園＋ニシー */
    drawNishie(ctx, 96, GROUND_Y + 8, 0.9, 'joy', t);
    drawParts(dt);
  }
  ctx.restore();
  /* タイトルのニシー小キャンバス */
  if (scene === 'title' && $('titleScr').classList.contains('on')) {
    var tc2 = $('titleNishie').getContext('2d');
    tc2.clearRect(0, 0, 150, 120);
    drawNishie(tc2, 75, 112, 0.88, 'normal', t);
  }
  if ($('tutScr').classList.contains('on')) renderTut();
  if ($('resultScr').classList.contains('on')) {
    var rc = $('resNishie').getContext('2d');
    rc.clearRect(0, 0, 150, 110);
    drawNishie(rc, 75, 104, 0.8, resMood, t);
  }
}
requestAnimationFrame(frame);
})();
</script>
