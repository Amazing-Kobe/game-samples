<body>

<button id="btnMute" class="ovbtn" type="button">音ON</button>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
'use strict';
/*CORE_START*/
/* ============================================================
 * 刈吉のトピアリー庭園 — ゲームコア（DOM非依存・純粋ロジック）
 * node のヘッドレステストから module.exports 経由で利用する
 * ============================================================ */
var KKCore = (function () {
  'use strict';
  var COLS = 12, ROWS = 16;
  var CELL_EMPTY = 0, CELL_OVER = 1, CELL_OK = 2, CELL_HOLE = 3;

  /* 8レベル定義: shape は 16行×12文字（'#'=シルエット内側） */
  var LEVELS = [
    { id: 0, name: 'まる', label: 'まる',
      density: [0.50, 0.00], minOver: 6,
      trivia: 'かりきちの「は」は、プロも つかう 高級刃物鋼（こうきゅう はものこう）。だから スパッと きれるんだ！',
      shape: [
        '............','............','....####....','..########..',
        '..########..','.##########.','.##########.','.##########.',
        '..########..','..########..','....####....','.....##.....',
        '.....##.....','.....##.....','............','............'] },
    { id: 1, name: 'ハート', label: 'はーと',
      density: [0.60, 0.05], minOver: 8,
      trivia: 'かりきちは、しょくにんさんが 一本（いっぽん）ずつ 手（て）で しあげて いるんだよ。',
      shape: [
        '............','............','..##....##..','.####..####.',
        '.##########.','.##########.','.##########.','..########..',
        '...######...','....####....','.....##.....','.....##.....',
        '.....##.....','.....##.....','............','............'] },
    { id: 2, name: '小鳥', label: 'ことり',
      density: [0.65, 0.10], minOver: 9,
      trivia: 'ニシガキこうぎょうの ある 三木（みき）は、むかしから つづく「金物（かなもの）のまち」なんだ。',
      shape: [
        '............','............','......####..','.....######.',
        '.....######.','....######..','..########..','.#########..',
        '.#########..','..########..','...######...','....####....',
        '.....##.....','.....##.....','............','............'] },
    { id: 3, name: '星', label: 'ほし',
      density: [0.70, 0.15], minOver: 10,
      trivia: 'たかい えだを きる「高枝切鋏（たかえだきりばさみ）」を せかいで はじめて つくったのは ニシガキなんだ！',
      shape: [
        '............','.....##.....','....####....','....####....',
        '############','.##########.','..########..','...######...',
        '..########..','..###..###..','.###....###.','.....##.....',
        '.....##.....','.....##.....','............','............'] },
    { id: 4, name: 'ニシー', label: 'にしー',
      density: [0.75, 0.20], minOver: 12,
      trivia: '「太丸（ふとまる）」は テコの ちからで 40ミリの ふとい えだも かるく きれるよ。',
      shape: [
        '............','.###....###.','.###....###.','..#......#..',
        '..##....##..','..########..','.##########.','.##########.',
        '.##########.','..########..','..#.#..#.#..','.#..#..#..#.',
        '.....##.....','.....##.....','............','............'] },
    { id: 5, name: '鋏', label: 'はさみ',
      density: [0.80, 0.30], minOver: 12,
      trivia: 'でんどうの「太丸充電（ふとまる じゅうでん）プロ」は、40ミリの えだを たった 1びょうで カット！',
      shape: [
        '............','.##......##.','..##....##..','...##..##...',
        '....####....','.....##.....','....####....','...##..##...',
        '..##....##..','.###....###.','.###....###.','.....##.....',
        '.....##.....','.....##.....','............','............'] },
    { id: 6, name: 'マンゴー', label: 'まんごー',
      density: [0.85, 0.35], minOver: 14,
      trivia: 'ニシガキの どうぐは うみの むこうでも だいかつやく。フランスや スペイン、インドの マンゴーばたけにも とどいて いるんだよ。',
      shape: [
        '............','........#...','.......##...','....######..',
        '..#########.','.##########.','.##########.','.##########.',
        '.#########..','..########..','...######...','....####....',
        '............','............','............','............'] },
    { id: 7, name: 'カニびしロゴ', label: 'かにびし ロゴ',
      density: [0.90, 0.45], minOver: 16,
      trivia: 'カニの びしがたマークは ニシガキの ロゴ。カニの ツメは まるで はさみ！ ニシーの ツメも ほんものの せんていばさみ なんだ。',
      shape: [
        '............','.....##.....','....####....','...######...',
        '..########..','.##########.','############','############',
        '.##########.','..########..','...######...','....####....',
        '.....##.....','............','............','............'] }
  ];

  /* 決定論的な乱数（テスト再現用） */
  function mulberry32(a) {
    a = a >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function validateLevels() {
    for (var i = 0; i < LEVELS.length; i++) {
      var s = LEVELS[i].shape;
      if (s.length !== ROWS) return false;
      for (var r = 0; r < ROWS; r++) {
        if (s[r].length !== COLS) return false;
        if (/[^#.]/.test(s[r])) return false;
      }
    }
    return LEVELS.length === 8;
  }

  function inSil(shape, c, r) {
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
    return shape[r].charAt(c) === '#';
  }

  /* 生垣グリッド生成: シルエット内=OK、外周1〜2セルに確率で「はみ出し」 */
  function genGrid(levelIndex, seed) {
    var lv = LEVELS[levelIndex];
    var rng = mulberry32(seed);
    var cells = new Array(ROWS * COLS);
    var r, c, i;
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
      cells[r * COLS + c] = inSil(lv.shape, c, r) ? CELL_OK : CELL_EMPTY;
    }
    /* 外側セルのシルエットまでのチェビシェフ距離(1 or 2)を求める */
    function nearSil(c0, r0, d) {
      for (var rr = r0 - d; rr <= r0 + d; rr++)
        for (var cc = c0 - d; cc <= c0 + d; cc++)
          if (inSil(lv.shape, cc, rr)) return true;
      return false;
    }
    var ring1 = [], ring2 = [];
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
      if (cells[r * COLS + c] !== CELL_EMPTY) continue;
      if (nearSil(c, r, 1)) ring1.push([c, r]);
      else if (nearSil(c, r, 2)) ring2.push([c, r]);
    }
    var over = 0;
    for (i = 0; i < ring1.length; i++) {
      if (rng() < lv.density[0]) { cells[ring1[i][1] * COLS + ring1[i][0]] = CELL_OVER; over++; }
    }
    for (i = 0; i < ring2.length; i++) {
      var p = ring2[i];
      /* ring2 は ring1 が茂っている隣にだけ生える（浮きセル防止） */
      var touch = false;
      for (var rr = p[1] - 1; rr <= p[1] + 1 && !touch; rr++)
        for (var cc = p[0] - 1; cc <= p[0] + 1 && !touch; cc++) {
          if (cc < 0 || cc >= COLS || rr < 0 || rr >= ROWS) continue;
          if (cells[rr * COLS + cc] === CELL_OVER) touch = true;
        }
      if (touch && rng() < lv.density[1]) { cells[p[1] * COLS + p[0]] = CELL_OVER; over++; }
    }
    /* はみ出しが少なすぎる場合は ring1 から確定追加 */
    for (i = 0; i < ring1.length && over < lv.minOver; i++) {
      var q = ring1[i];
      if (cells[q[1] * COLS + q[0]] === CELL_EMPTY) { cells[q[1] * COLS + q[0]] = CELL_OVER; over++; }
    }
    var okTotal = 0;
    for (i = 0; i < cells.length; i++) if (cells[i] === CELL_OK) okTotal++;
    return {
      level: levelIndex, cols: COLS, rows: ROWS, cells: cells,
      okTotal: okTotal, overTotal: over, cut: 0, holes: 0
    };
  }

  function cellAt(st, c, r) {
    if (c < 0 || c >= st.cols || r < 0 || r >= st.rows) return -1;
    return st.cells[r * st.cols + c];
  }

  /* 道具の当たりセル: 幅1=1セル / 幅3=スワイプ方向と垂直に3セル */
  function cellsForTool(c, r, width, dx, dy) {
    if (width <= 1) return [[c, r]];
    if (Math.abs(dx) >= Math.abs(dy)) {
      return [[c, r - 1], [c, r], [c, r + 1]];   /* 横スワイプ→縦3列 */
    }
    return [[c - 1, r], [c, r], [c + 1, r]];      /* 縦スワイプ→横3列 */
  }

  /* 刈り適用: OVER→刈れた(good) / OK→穴(bad) */
  function applyCut(st, list) {
    var good = [], bad = [];
    for (var i = 0; i < list.length; i++) {
      var c = list[i][0], r = list[i][1];
      var v = cellAt(st, c, r);
      if (v === CELL_OVER) {
        st.cells[r * st.cols + c] = CELL_EMPTY; st.cut++; good.push([c, r]);
      } else if (v === CELL_OK) {
        st.cells[r * st.cols + c] = CELL_HOLE; st.holes++; bad.push([c, r]);
      }
    }
    return { good: good, bad: bad };
  }

  function remainingOver(st) {
    var n = 0;
    for (var i = 0; i < st.cells.length; i++) if (st.cells[i] === CELL_OVER) n++;
    return n;
  }
  function isComplete(st) { return remainingOver(st) === 0; }

  /* 精度%: 穴あきで減点。星: 98%→3 / 85%→2 / それ以下→1 */
  function accuracy(st) {
    if (st.okTotal <= 0) return 100;
    return Math.max(0, Math.round(100 * (st.okTotal - st.holes) / st.okTotal));
  }
  function starsFor(acc) { return acc >= 98 ? 3 : acc >= 85 ? 2 : 1; }

  /* ブレゼンハム: スワイプの取りこぼし防止 */
  function lineCells(c0, r0, c1, r1) {
    var out = [], dc = Math.abs(c1 - c0), dr = Math.abs(r1 - r0);
    var sc = c0 < c1 ? 1 : -1, sr = r0 < r1 ? 1 : -1, err = dc - dr;
    for (var guard = 0; guard < 64; guard++) {
      out.push([c0, r0]);
      if (c0 === c1 && r0 === r1) break;
      var e2 = 2 * err;
      if (e2 > -dr) { err -= dr; c0 += sc; }
      if (e2 < dc) { err += dc; r0 += sr; }
    }
    return out;
  }

  /* ---- セーブ・庭園 ---- */
  function defaultSave() { return { v: 1, best: {}, tut: 0 }; }
  function encodeSave(s) { return JSON.stringify(s); }
  function decodeSave(str) {
    try {
      var o = JSON.parse(str);
      if (!o || typeof o !== 'object' || o.v !== 1 || typeof o.best !== 'object' || o.best === null) return defaultSave();
      var clean = defaultSave();
      clean.tut = o.tut ? 1 : 0;
      for (var k in o.best) {
        var li = parseInt(k, 10), st = o.best[k] | 0;
        if (li >= 0 && li < LEVELS.length && st >= 1 && st <= 3) clean.best[String(li)] = st;
      }
      return clean;
    } catch (e) { return defaultSave(); }
  }
  function recordResult(save, levelIndex, stars) {
    var k = String(levelIndex), cur = save.best[k] || 0;
    if (stars > cur) save.best[k] = stars;
    return save;
  }
  function totalStars(save) {
    var t = 0; for (var k in save.best) t += save.best[k];
    return t;
  }
  function isUnlocked(save, levelIndex) {
    if (levelIndex === 0) return true;
    return (save.best[String(levelIndex - 1)] || 0) > 0;
  }
  function wideUnlocked(save) { return totalStars(save) >= 6; }
  /* 庭のにぎわい: 星2→ちょうちょ+1(最大6) 星4→ことり+1(最大4) 星8→ちょうちん+1(最大3) */
  function gardenSummary(save) {
    var t = totalStars(save);
    return {
      totalStars: t,
      butterflies: Math.min(6, Math.floor(t / 2)),
      birds: Math.min(4, Math.floor(t / 4)),
      lanterns: Math.min(3, Math.floor(t / 8))
    };
  }

  return {
    COLS: COLS, ROWS: ROWS,
    CELL_EMPTY: CELL_EMPTY, CELL_OVER: CELL_OVER, CELL_OK: CELL_OK, CELL_HOLE: CELL_HOLE,
    LEVELS: LEVELS, mulberry32: mulberry32, validateLevels: validateLevels,
    inSil: inSil, genGrid: genGrid, cellAt: cellAt, cellsForTool: cellsForTool,
    applyCut: applyCut, remainingOver: remainingOver, isComplete: isComplete,
    accuracy: accuracy, starsFor: starsFor, lineCells: lineCells,
    defaultSave: defaultSave, encodeSave: encodeSave, decodeSave: decodeSave,
    recordResult: recordResult, totalStars: totalStars, isUnlocked: isUnlocked,
    wideUnlocked: wideUnlocked, gardenSummary: gardenSummary
  };
})();
if (typeof module !== 'undefined' && module.exports) { module.exports = KKCore; }
/*CORE_END*/
/* ============================================================
 * ここから下はブラウザ実行部（描画・音・入力）
 * ============================================================ */
var W = 420, H = 740;
var PAL = {
  amber: '#D98E32', amberDk: '#B9741F', amberLt: '#E8A85C',
  steel: '#AEB6BB', steelLt: '#D5DADD', steelDk: '#6B7176',
  green: '#2E5E3A', leaf: '#7CB342', leafLt: '#9CCC65', leafDk: '#1F4429',
  orange: '#E8590C', navy: '#1C2B33', cream: '#F6EFE3', creamDim: 'rgba(246,239,227,.82)'
};
var LSK = { save: 'nishigaki_g3_save', mute: 'nishigaki_g3_mute' };

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
function fit() {
  var s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ---- セーブ ---- */
function loadSave() {
  var raw = null;
  try { raw = localStorage.getItem(LSK.save); } catch (e) {}
  return KKCore.decodeSave(raw || '');
}
function persistSave(s) {
  try { localStorage.setItem(LSK.save, KKCore.encodeSave(s)); } catch (e) {}
}
var SAVE = loadSave();

/* ---- WebAudio 合成SE ---- */
var SFX = (function () {
  var ac = null, muted = false;
  try { muted = localStorage.getItem(LSK.mute) === '1'; } catch (e) {}
  function ensure() {
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noiseBuf(a) {
    var len = Math.floor(a.sampleRate * 0.12);
    var b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  var nb = null;
  function tone(type, f0, f1, t0, dur, vol) {
    var a = ac, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function play(fn) { if (muted) return; var a = ensure(); if (!a) return; fn(a, a.currentTime); }
  return {
    unlock: ensure,
    isMuted: function () { return muted; },
    toggle: function () {
      muted = !muted;
      try { localStorage.setItem(LSK.mute, muted ? '1' : '0'); } catch (e) {}
      return muted;
    },
    /* シャキン: 金属スイープ＋ノイズの刃ずれ音 */
    snip: function (pitch) {
      play(function (a, t) {
        if (!nb) nb = noiseBuf(a);
        var s = a.createBufferSource(); s.buffer = nb;
        var bp = a.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.setValueAtTime(5200 * pitch, t); bp.Q.value = 1.4;
        var g = a.createGain();
        g.gain.setValueAtTime(0.20, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
        s.connect(bp).connect(g).connect(a.destination);
        s.start(t); s.stop(t + 0.1);
        tone('sine', 2400 * pitch, 5600 * pitch, t, 0.07, 0.10);
        tone('square', 900 * pitch, 900 * pitch, t, 0.02, 0.05);
      });
    },
    bad: function () {
      play(function (a, t) {
        tone('triangle', 170, 70, t, 0.28, 0.16);
        tone('sine', 120, 60, t + 0.02, 0.25, 0.10);
      });
    },
    blip: function () { play(function (a, t) { tone('sine', 520, 660, t, 0.07, 0.08); }); },
    pop: function () { play(function (a, t) { tone('sine', 300, 720, t, 0.09, 0.10); }); },
    done: function () {
      play(function (a, t) {
        var n = [523, 659, 784, 1047];
        for (var i = 0; i < n.length; i++) tone('sine', n[i], n[i], t + i * 0.13, 0.22, 0.10);
      });
    },
    star: function (i) {
      play(function (a, t) {
        tone('sine', 880 + i * 220, 1180 + i * 220, t, 0.16, 0.11);
        tone('triangle', 1760 + i * 440, 1760 + i * 440, t + 0.02, 0.10, 0.05);
      });
    },
    chirp: function () {
      play(function (a, t) {
        tone('sine', 2300, 3100, t, 0.06, 0.05);
        tone('sine', 2800, 2200, t + 0.09, 0.07, 0.045);
      });
    }
  };
})();
var btnMute = document.getElementById('btnMute');
function muteFace() { btnMute.textContent = SFX.isMuted() ? '音OFF' : '音ON'; }
btnMute.addEventListener('click', function () { SFX.toggle(); muteFace(); SFX.blip(); });
muteFace();

/* ---- 画像 try-load（成功時のみ使用、失敗時は内蔵ベクター） ---- */
var IMG = {};
['mascot', 'mascot_joy', 'mascot_sad', 'mascot_point', 'title_game3'].forEach(function (n) {
  var im = new Image();
  im.onload = function () { IMG[n] = im; };
  im.src = 'assets/img/' + n + '.png';
});

/* ---- 描画ヘルパ ---- */
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function hash2(c, r) { var n = (c * 73856093) ^ (r * 19349663); n = (n ^ (n >> 13)) >>> 0; return (n % 1000) / 1000; }

/* ---- ニシー（内蔵ベクター）: 木製ボディ＋剪定鋏のツメ ---- */
function drawShear(g, open, flip) {
  /* 原点=ボルト位置。steel の湾曲刃2枚＋ボルト。open=開き具合0..1 */
  g.save();
  if (flip) g.scale(-1, 1);
  for (var i = 0; i < 2; i++) {
    g.save();
    g.rotate((i === 0 ? -1 : 1) * (0.22 + open * 0.5));
    var grad = g.createLinearGradient(0, -4, 0, 4);
    grad.addColorStop(0, PAL.steelLt); grad.addColorStop(1, PAL.steel);
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(0, 0);
    g.quadraticCurveTo(10, (i === 0 ? -7 : 7), 21, (i === 0 ? -4 : 4));
    g.quadraticCurveTo(11, (i === 0 ? -1.5 : 1.5), 0, 2.6);
    g.closePath(); g.fill();
    g.strokeStyle = PAL.steelDk; g.lineWidth = 0.7; g.stroke();
    g.restore();
  }
  /* 短い木ハンドル（腕側） */
  g.fillStyle = PAL.amberDk;

  if (!play || play.done) return;
  var res = KKCore.applyCut(play.st, KKCore.cellsForTool(c, r, play.toolW, dx, dy));
  var i, cx = 0, cy = 0;
  if (res.good.length || res.bad.length) gridDirty = true;
  for (i = 0; i < res.good.length; i++) {
    cx = GX + res.good[i][0] * CS + CS / 2; cy = GY + res.good[i][1] * CS + CS / 2;
    spawnLeaves(cx, cy, 7, true);
    play.combo++;
    if (T - play.lastSnip > 0.035) { SFX.snip(1 + Math.min(10, play.combo) * 0.035); play.lastSnip = T; }
    addShake(1.6, 0.07);

function act(id) {
  if (id === 'start') { scene = 'garden'; SFX.pop(); return; }

  if (id === 'toolThin') { play.toolW = 1; SFX.blip(); return; }
  if (id === 'toolWide') {
    if (KKCore.wideUnlocked(SAVE)) { play.toolW = 3; SFX.blip(); }
    else { addFloat(320, 540, TEXT.toolLockSub, '#FFCC80'); SFX.bad(); }
    return;
  }
  if (id === 'resGarden') { play = null; result = null; scene = 'garden'; SFX.blip(); return; }
  if (id === 'resNext') { var n = result.li + 1; SFX.pop(); startLevel(n); return; }
  if (id.indexOf('lock') === 0) { addFloat(W / 2, 420, TEXT.lockedMsg, '#FFE0B2'); SFX.bad(); return; }

function drawHedgeCellStatic(g, px, py, c, r) {

}
function drawHole(g, px, py, c, r) {

  g.beginPath(); g.moveTo(px + CS - 6, py + CS - 8); g.lineTo(px + CS - 12, py + 12); g.stroke();
}
function renderGridCache() {
  var g = gridCtx, st = play.st, lv = KKCore.LEVELS[play.li], c, r, px, py;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, GW, GH);
  /* 目標シルエット（半透明）＋点線の輪郭 */
  g.fillStyle = 'rgba(255,255,255,.30)';
  for (r = 0; r < st.rows; r++) for (c = 0; c < st.cols; c++) {
    if (KKCore.inSil(lv.shape, c, r)) g.fillRect(c * CS, r * CS, CS, CS);
  }
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.6; g.setLineDash([5, 4]);
  g.beginPath();
  for (r = 0; r < st.rows; r++) for (c = 0; c < st.cols; c++) {
    if (!KKCore.inSil(lv.shape, c, r)) continue;
    px = c * CS; py = r * CS;
    if (!KKCore.inSil(lv.shape, c, r - 1)) { g.moveTo(px, py); g.lineTo(px + CS, py); }
    if (!KKCore.inSil(lv.shape, c, r + 1)) { g.moveTo(px, py + CS); g.lineTo(px + CS, py + CS); }
    if (!KKCore.inSil(lv.shape, c - 1, r)) { g.moveTo(px, py); g.lineTo(px, py + CS); }
    if (!KKCore.inSil(lv.shape, c + 1, r)) { g.moveTo(px + CS, py); g.lineTo(px + CS, py + CS); }
  }
  g.stroke(); g.setLineDash([]);
  for (r = 0; r < st.rows; r++) for (c = 0; c < st.cols; c++) {
    var v = st.cells[r * st.cols + c];
    px = c * CS; py = r * CS;
    if (v === KKCore.CELL_OK) drawHedgeCellStatic(g, px, py, c, r);
    else if (v === KKCore.CELL_HOLE) drawHole(g, px, py, c, r);
  }
}
function drawOverCell(g, c, r, t) {

function drawPlay(g) {
  var lv = KKCore.LEVELS[play.li], st = play.st, i, c, r;
  drawSky(g, false);
  var gg = g.createLinearGradient(0, 536, 0, H);
  gg.addColorStop(0, '#69A653'); gg.addColorStop(1, '#47713C');
  g.fillStyle = gg; g.fillRect(0, 536, W, H - 536);

  g.drawImage(gridCv, GX, GY, GW, GH);

    if (st.cells[r * st.cols + c] === KKCore.CELL_OVER) drawOverCell(g, c, r, T);
  }
  /* スワイプ軌跡 */
  if (play.trail.length > 1) {
    g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
    for (i = 1; i < play.trail.length; i++) {
      var a = play.trail[i], b = play.trail[i - 1];

      g.lineWidth = 6 * al + 1;
      g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(a.x, a.y); g.stroke();
    }
    g.restore();
  }
  /* カーソルの刈吉 */
  if (play.cur && !play.done) {
    g.save(); g.translate(play.cur.x, play.cur.y - 4); g.rotate(-0.6); g.scale(1.7, 1.7);
    drawShear(g, (Math.sin(T * 14) + 1) / 2 * 0.8, false);

  if (pr > 0) { g.fillStyle = PAL.orange; rr(g, 16, 74, Math.max(8, 284 * pr), 8, 4); g.fill(); }
  drawGhostBtn(g, 'retry', 316, 52, 92, 30, TEXT.retry);
  /* 道具 */
  drawToolBtn(g, 'toolThin', 136, 552, 128, 56, TEXT.toolThin, TEXT.toolThinSub, play.toolW === 1, true);
  var wOk = KKCore.wideUnlocked(SAVE);
  drawToolBtn(g, 'toolWide', 272, 552, 136, 56, TEXT.toolWide, wOk ? TEXT.toolWideSub : TEXT.toolLockSub, play.toolW === 3, wOk);
  /* ニシーとふきだし */
  var mood = play.done ? 'joy' : play.sadT > 0 ? 'sad' : 'norm';
  var talk = play.done ? TEXT.doneTalk : play.sadT > 0 ? TEXT.sadTalk : TEXT.playTips[Math.floor(T / 7) % TEXT.playTips.length];
  drawBubble(g, 126, 622, 284, 92, talk, 15);

    g.fillStyle = 'rgba(255,255,240,' + ((0.35 - play.doneT) * 1.6).toFixed(3) + ')';
    g.fillRect(0, 0, W, H);
  }
}

function drawButterfly(g, x, y, t, i) {

  g.beginPath(); g.arc(360, 490, 44, 0, 7); g.fill();
  g.beginPath(); g.arc(330, 520, 34, 0, 7); g.fill();
  g.fillRect(348, 540, 14, 70);
  var gg = g.createLinearGradient(0, 600, 0, H);
  gg.addColorStop(0, '#69A653'); gg.addColorStop(1, '#4C7A41');
  g.fillStyle = gg; g.fillRect(0, 600, W, 140);
  for (var i = 0; i < ambient.length; i++) {
    var am = ambient[i];
    g.save(); g.translate(am.x, am.y); g.rotate(am.rot); g.globalAlpha = 0.8;
    g.fillStyle = am.col; g.beginPath(); g.ellipse(0, 0, 5, 2.8, 0, 0, 7); g.fill();
    g.restore();
  }
  drawLogo(g, W / 2, 190);
  g.fillStyle = 'rgba(232,89,12,.92)'; rr(g, 56, 286, 308, 30, 15); g.fill();
  g.fillStyle = PAL.cream; g.textAlign = 'center'; g.font = 'bold 12.5px ' + FONT;
  g.fillText(TEXT.ribbon, W / 2, 306);
  drawNishie(g, W / 2, 468, 1.75, Math.sin(T * 0.8) > 0.55 ? 'joy' : 'norm', T);
  var pu = 1 + 0.05 * Math.sin(T * 3.4);
  var bw = 216, bh = 60, bx = W / 2 - bw / 2, by = 574;
  pushHit('start', bx, by, bw, bh);
  g.save(); g.translate(W / 2, by + bh / 2); g.scale(pu, pu);
  var og = g.createLinearGradient(0, -bh / 2, 0, bh / 2);
  og.addColorStop(0, '#F1732B'); og.addColorStop(1, '#D64E06');
  g.fillStyle = og; rr(g, -bw / 2, -bh / 2, bw, bh, bh / 2); g.fill();
  g.strokeStyle = PAL.cream; g.lineWidth = 3; g.stroke();
  g.fillStyle = PAL.cream; g.font = 'bold 23px ' + FONT; g.textAlign = 'center';
  g.fillText(TEXT.start, 0, 8);
  g.restore();
  var ts = KKCore.totalStars(SAVE);
  g.font = 'bold 13px ' + FONT; g.fillStyle = 'rgba(28,43,51,.8)'; g.textAlign = 'center';
  g.fillText(ts > 0 ? TEXT.totalStar + ' ★' + ts + '　' + TEXT.titleCont : TEXT.titleNew, W / 2, 668);
  g.fillStyle = 'rgba(28,43,51,.5)'; g.font = '11px ' + FONT;
  g.fillText(TEXT.credit, W / 2, 722);
}

function drawResultOverlay(g) {
  var lv = KKCore.LEVELS[result.li], i;
  g.fillStyle = 'rgba(28,43,51,.72)'; g.fillRect(0, 0, W, H);
  var px = 28, py = 128, pw = 364, ph = 478;
  g.fillStyle = '#FBF4E4'; rr(g, px, py, pw, ph, 20); g.fill();
  g.strokeStyle = PAL.amber; g.lineWidth = 3; g.stroke();
  g.textAlign = 'center';
  g.font = 'bold 34px ' + FONT;
  g.strokeStyle = 'rgba(232,89,12,.25)'; g.lineWidth = 8; g.lineJoin = 'round';
  g.strokeText(TEXT.clear, W / 2, py + 58);
  g.fillStyle = PAL.orange; g.fillText(TEXT.clear, W / 2, py + 58);
  g.font = 'bold 14px ' + FONT; g.fillStyle = PAL.navy;
  g.fillText('レベル' + (result.li + 1) + '「' + lv.name + '」', W / 2, py + 86);
  for (i = 0; i < 3; i++) {
    var sx = W / 2 - 66 + i * 66, sy = py + 140;
    var u = Math.min(1, Math.max(0, (result.t - (0.45 + i * 0.35)) / 0.3));
    var on = i < result.stars && u > 0;
    g.save(); g.translate(sx, sy);
    if (on) { var e = easeOutBack(u); g.scale(e, e); }
    pathStar(g, 0, 0, 27);
    g.fillStyle = on ? '#FFD54F' : 'rgba(28,43,51,.12)';
    g.fill();
    if (on) { g.strokeStyle = '#B9741F'; g.lineWidth = 2; g.stroke(); }
    g.restore();
  }
  var p = Math.min(1, Math.max(0, (result.t - 0.2) / 0.9));
  g.font = 'bold 24px ' + FONT; g.fillStyle = PAL.navy; g.textAlign = 'center';
  g.fillText(TEXT.acc + ' ' + Math.round(result.acc * p) + '%', W / 2, py + 204);
  var msgy = py + 232;
  if (result.newBest && result.t > 1.2) {
    g.font = 'bold 15px ' + FONT; g.fillStyle = PAL.orange;
    g.fillText('★ ' + TEXT.newBest + ' ★', W / 2, msgy); msgy += 24;
  }
  if (result.wideNew && result.t > 1.2) {
    g.fillStyle = PAL.orange; rr(g, px + 26, msgy - 16, pw - 52, 24, 12); g.fill();
    g.fillStyle = PAL.cream; g.font = 'bold 12px ' + FONT;
    g.fillText(TEXT.toolGet, W / 2, msgy + 1);
  }
  var ty = py + 272;
  g.fillStyle = 'rgba(217,142,50,.16)'; rr(g, px + 20, ty, pw - 40, 118, 12); g.fill();
  g.strokeStyle = 'rgba(217,142,50,.5)'; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = '#B9741F'; g.font = 'bold 13px ' + FONT;
  g.fillText('〜 ' + TEXT.triviaHead + ' 〜', W / 2, ty + 22);
  g.fillStyle = '#4A3A22'; g.font = '12.5px ' + FONT; g.textAlign = 'left';
  wrapText(g, lv.trivia, px + 34, ty + 46, pw - 68, 19);
  if (result.t > 1.1) {
    drawPrimaryBtn(g, 'resGarden', px + 30, py + ph - 72, 148, 50, TEXT.btnGarden, false);
    if (result.li < KKCore.LEVELS.length - 1) {
      drawPrimaryBtn(g, 'resNext', px + 190, py + ph - 72, 148, 50, TEXT.btnNext, true);
    }
  }
}

function drawTut(g) {
  g.fillStyle = 'rgba(28,43,51,.66)'; g.fillRect(0, 0, W, H);
  var pg = play.tut;
  if (pg === 0) {
    var u = (T % 1.7) / 1.7, dx = GX + 24 + u * (GW - 48), dy = GY + 60;
    g.strokeStyle = 'rgba(255,250,232,.85)'; g.lineWidth = 5; g.lineCap = 'round';
    g.setLineDash([2, 12]);
    g.beginPath(); g.moveTo(GX + 24, dy); g.lineTo(dx, dy); g.stroke();
    g.setLineDash([]);
    g.save(); g.translate(dx, dy - 4); g.rotate(-0.5); g.scale(2, 2);
    drawShear(g, (Math.sin(T * 12) + 1) / 2 * 0.8, false); g.restore();
  }
  var bx = 34, by = 380, bw = 352, bh = 170;
  g.fillStyle = PAL.cream;
  g.beginPath(); g.moveTo(bx + 30, by + bh - 2); g.lineTo(bx + 16, by + bh + 26); g.lineTo(bx + 58, by + bh - 2); g.closePath(); g.fill();
  rr(g, bx, by, bw, bh, 16); g.fill();
  g.strokeStyle = PAL.amber; g.lineWidth = 2.5; g.stroke();
  g.fillStyle = PAL.navy; g.textAlign = 'left'; g.font = 'bold 16px ' + FONT;
  wrapText(g, TEXT.tut[pg], bx + 22, by + 38, bw - 44, 26);
  for (var i = 0; i < TEXT.tut.length; i++) {
    g.fillStyle = i === pg ? PAL.orange : 'rgba(28,43,51,.25)';
    g.beginPath(); g.arc(W / 2 - 20 + i * 20, by + bh - 40, 4.5, 0, 7); g.fill();
  }
  if (Math.sin(T * 4) > -0.3) {
    g.fillStyle = PAL.orange; g.textAlign = 'center'; g.font = 'bold 13px ' + FONT;
    g.fillText(pg === TEXT.tut.length - 1 ? TEXT.tutGo : TEXT.tutNext, W / 2, by + bh - 16);
  }
  drawNishie(g, 78, 646, 1.35, 'point', T);
}

/* ============================================================
 * PART5: 更新・メインループ・ポーズ
 * ============================================================ */
function update(dt) {
  T += dt;
  updateFx(dt, (scene === 'play' || scene === 'result') ? GROUNDY : H - 30);
  var i;
  if (play) {
    if (play.sadT > 0) play.sadT -= dt;
    if (play.badCd > 0) play.badCd -= dt;
    for (i = play.trail.length - 1; i >= 0; i--) {
      play.trail[i].age += dt;
      if (play.trail[i].age > 0.5) play.trail.splice(i, 1);
    }
    if (play.done) {
      play.doneT += dt;
      if (play.doneT >= 1.5 && scene === 'play') buildResult();
    }
    if (gridDirty) { renderGridCache(); gridDirty = false; }
  }
  if (result) {
    result.t += dt;
    while (result.snd < result.stars && result.t > 0.45 + result.snd * 0.35) {
      SFX.star(result.snd);
      spawnSpark(W / 2 - 66 + result.snd * 66, 268, '#FFD54F');
      result.snd++;
    }
  }
  if (scene === 'title' || scene === 'garden') {
    ambT -= dt;
    if (ambT <= 0 && ambient.length < 14) {
      ambT = 0.45;
      ambient.push({
        x: Math.random() * W, y: -12,
        vx: 12 + Math.random() * 26, vy: 26 + Math.random() * 30,
        rot: Math.random() * 7, vr: (Math.random() - 0.5) * 3,
        col: Math.random() < 0.5 ? PAL.leaf : PAL.leafLt
      });
    }
    for (i = ambient.length - 1; i >= 0; i--) {
      var am = ambient[i];
      am.x += Math.sin(T * 1.3 + am.rot) * 22 * dt + am.vx * dt * 0.3;
      am.y += am.vy * dt; am.rot += am.vr * dt;
      if (am.y > H + 14) ambient.splice(i, 1);
    }
    if (scene === 'garden' && KKCore.gardenSummary(SAVE).birds > 0 && T - lastChirp > 8) {
      lastChirp = T + Math.random() * 5;
      SFX.chirp();
    }
  }
}
function render() {
  hits = [];
  var g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  g.save();
  if (shakeT > 0) g.translate((Math.random() - 0.5) * 2 * shakeAmp, (Math.random() - 0.5) * 2 * shakeAmp);
  if (scene === 'title') { drawTitle(g); drawFx(g); }
  else if (scene === 'garden') { drawGarden(g); drawFx(g); }
  else if (scene === 'play' && play) {
    drawPlay(g); drawFx(g);
    if (play.tut >= 0) drawTut(g);
  }
  else if (scene === 'result' && play && result) {
    drawPlay(g); drawResultOverlay(g); drawFx(g);
  }
  g.restore();
}
var lastTs = 0, hidden = false;
function frame(ts) {
  var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  if (!hidden) { update(dt); render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', function () {
  hidden = document.hidden;
  if (hidden) persistSave(SAVE);
  else lastTs = performance.now();
});
</script>
