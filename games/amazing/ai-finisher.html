 cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
 cv.style.width=vw+'px';cv.style.height=vh+'px';
 scaleV=Math.min(vw/W,vh/H);ox=(vw-W*scaleV)/2;oy=(vh-H*scaleV)/2;}
window.addEventListener('resize',fit);fit();

var tG=0,shakeT=0,paused=false,titleSayT=2.5;

function say(txt,mood,dur){masco.msg=txt;masco.msgT=dur||2.2;if(mood){masco.mood=mood;masco.t=dur||2.2;}}
function toast(txt){toasts.push({txt:txt,t:0});}
function burst(x,y,col,n){for(var i=0;i<(n||14);i++){var a=Math.random()*TAU,sp=40+Math.random()*130;
 parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,t:0,life:0.5+Math.random()*0.45,col:col,r:1.5+Math.random()*3});}}

/* ================= ゲーム進行 ================= */
function startGame(){
 game={round:0,score:0,combo:0,maxCombo:0,flame:0,flameTarget:0,fixed:0,over:false,clear:false,newBest:false,phase:'intro',phaseT:0,time:0,timeMax:0,scene:null,slots:[],lastTick:99};
 order=shuffle([0,1,2,3,4]);
 startRound();state='play';
 say('検品スタートや！','point',1.8);}
function startRound(){
 game.round++;
 if((game.round-1)%SCENES.length===0&&game.round>1)order=shuffle(order);
 var sc=SCENES[order[(game.round-1)%SCENES.length]];
 game.scene=sc;
 var n=Math.min(2+((game.round-1)>>1),4);
 var idx=shuffle(sc.slots.map(function(_,i){return i;})).slice(0,n);
 game.slots=sc.slots.map(function(s,i){var b=idx.indexOf(i)>=0;
  return {def:s,broken:b,fix:b?0:1,found:false};});
 game.timeMax=Math.max(20,45-(game.round-1)*3);
 game.time=game.timeMax;game.lastTick=99;
 game.phase='intro';game.phaseT=0;
 lastShot={scene:sc,broken:idx.slice()};}
function brokenLeft(){var c=0;game.slots.forEach(function(s){if(s.broken&&!s.found)c++;});return c;}
function regZukan(type){
 var isNew=!save.zukan[type];
 save.zukan[type]=(save.zukan[type]||0)+1;persist();
 if(isNew){toast('図鑑に登録：'+GLITCH_INFO[type].n);sfx.zukan();}
 return isNew;}
function fixSlot(st){
 st.found=true;
 game.combo++;if(game.combo>game.maxCombo)game.maxCombo=game.combo;
 var gain=(60+Math.ceil(game.time)*10)*game.combo;
 game.score+=gain;game.fixed++;
 var px=VX+st.def.x,py=VY+st.def.y;
 burst(px,py,CYAN,16);burst(px,py,GOLD,8);kiran(px,py);
 floatTxt(px,py-20,'+'+fmt(gain)+(game.combo>1?'  ×'+game.combo:''),GOLD);
 sfx.fix();
 say(FIX_LINES[st.def.type]||'ナイス修正！','joy');
 regZukan(st.def.type);
 if(brokenLeft()===0){
  game.phase='stamp';game.phaseT=0;
  var bonus=Math.ceil(game.time)*15;
  game.score+=bonus;
  floatTxt(W/2,VY+120,'納品ボーナス +'+fmt(bonus),GOLD);
  sfx.stamp();}}
function timeUp(){
 var missed=brokenLeft();
 game.flameTarget=game.flame+missed*25;
 game.phase='flame';game.phaseT=0;
 sfx.flame();
 say(FLAME_LINES[Math.floor(Math.random()*FLAME_LINES.length)],'sad',2.4);
 for(var i=0;i<6;i++)spawnTweet(0.1+i*0.14);}
function spawnTweet(delay){tweets.push({x:30+Math.random()*(W-160),y:H+20,vy:-(120+Math.random()*100),sway:Math.random()*TAU,t:-(delay||0),life:2.2});}
function endGame(clear){
 game.over=true;game.clear=clear;
 if(game.score>save.best){save.best=game.score;save.bestRank=rankOf(game.score);game.newBest=true;}
 save.plays=(save.plays||0)+1;if(clear)save.clears=(save.clears||0)+1;
 persist();buildCard();state='result';
 if(clear){sfx.fanfare();say('全カット納品！さすがや！','joy',3);}
 else{sfx.over();say('次はもっと直せるって！','sad',3);}}

/* ================= 入力 ================= */
function toLogical(e){var r=cv.getBoundingClientRect();
 return {x:((e.clientX-r.left)-ox)/scaleV,y:((e.clientY-r.top)-oy)/scaleV};}
function onPointer(p){
 initAudio();
 for(var i=buttons.length-1;i>=0;i--){var b=buttons[i];
  if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sfx.tap();b.cb();return;}}
 if(state==='play'&&game&&game.phase==='play'){
  var sx=p.x-VX,sy=p.y-VY;
  if(sx<0||sy<0||sx>VW||sy>VH)return;
  var hit=null,hd=1e9,nearFixed=false;
  game.slots.forEach(function(st){
   if(!st.broken)return;
   var d=Math.hypot(sx-st.def.x,sy-st.def.y),rad=Math.max(st.def.r,22);
   if(d<=rad){if(st.found){nearFixed=true;}else if(d<hd){hd=d;hit=st;}}});
  if(hit){fixSlot(hit);return;}
  if(nearFixed)return;
  game.time=Math.max(0,game.time-2);
  game.combo=0;shakeT=0.25;
  floatTxt(p.x,p.y-14,'-2秒',PINK);
  burst(p.x,p.y,PINK,6);
  sfx.miss();
  say(MISS_LINES[Math.floor(Math.random()*MISS_LINES.length)],'sad',1.6);
  if(game.time<=0)timeUp();}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();onPointer(toLogical(e));});

/* ================= 更新 ================= */
function update(dt){
 tG+=dt;
 if(shakeT>0)shakeT-=dt;
 parts.forEach(function(p){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;});
 parts=parts.filter(function(p){return p.t<p.life;});
 stars.forEach(function(s){s.t+=dt;});stars=stars.filter(function(s){return s.t<s.life;});
 floats.forEach(function(f){f.t+=dt;f.y-=34*dt;});floats=floats.filter(function(f){return f.t<f.life;});
 toasts.forEach(function(o){o.t+=dt;});toasts=toasts.filter(function(o){return o.t<2.4;});
 tweets.forEach(function(w){w.t+=dt;if(w.t>0){w.y+=w.vy*dt;w.sway+=dt*3;}});
 tweets=tweets.filter(function(w){return w.t<w.life;});
 if(masco.msgT>0)masco.msgT-=dt;
 if(masco.t>0){masco.t-=dt;if(masco.t<=0)masco.mood='base';}
 if(state==='title'){titleSayT-=dt;
  if(titleSayT<=0){titleSayT=4.5;say(TITLE_LINES[Math.floor(Math.random()*TITLE_LINES.length)],'base',2.4);}}
 if(state!=='play'||!game)return;
 game.slots.forEach(function(st){if(st.found&&st.fix<1)st.fix=Math.min(1,st.fix+dt/0.4);});
 game.phaseT+=dt;
 if(game.phase==='intro'){if(game.phaseT>1.3){game.phase='play';game.phaseT=0;}}
 else if(game.phase==='play'){
  game.time-=dt;
  if(game.time<=5.5&&game.time>0){var c=Math.ceil(game.time);
   if(c!==game.lastTick){game.lastTick=c;sfx.tick();}}
  if(game.time<=0){game.time=0;timeUp();}}
 else if(game.phase==='stamp'){
  if(game.phaseT>1.7){if(game.round>=10)endGame(true);else startRound();}}
 else if(game.phase==='flame'){
  if(game.flame<game.flameTarget)game.flame=Math.min(game.flameTarget,game.flame+dt*60);
  if(game.phaseT>2.1){if(game.flameTarget>=100)endGame(false);else startRound();}}}

function uiBtn(x,y,w,h,label,cb,primary){
 buttons.push({x:x,y:y,w:w,h:h,cb:cb,label:label});
 ctx.save();
 ctx.shadowColor='rgba(106,215,255,.45)';ctx.shadowBlur=primary?14:6;
 ctx.fillStyle=primary?BLUE:NAVY2;rr(ctx,x,y,w,h,h/2);ctx.fill();
 ctx.shadowBlur=0;
 ctx.strokeStyle=primary?CYAN:'rgba(106,215,255,.5)';ctx.lineWidth=2;rr(ctx,x,y,w,h,h/2);ctx.stroke();
 ctx.fillStyle=INK;ctx.font=F(Math.min(18,h*0.4),true);ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(label,x+w/2,y+h/2+1);
 ctx.restore();}
function renderSceneInto(g,scene,slots,t){
 scene.drawBase(g,t);
 slots.forEach(function(st){var s=st.def;
  if(!st.broken){s.normal(g,t);return;}
  var f=st.fix;
  if(f>=1){s.normal(g,t);return;}
  if(f<=0){g.save();g.translate(Math.sin(t*7+s.x)*0.7,Math.cos(t*6+s.y)*0.7);s.broken(g,t);g.restore();return;}
  g.save();g.globalAlpha=1-f;
  g.translate((Math.random()-0.5)*5*(1-f),(Math.random()-0.5)*5*(1-f));
  s.broken(g,t);g.restore();
  g.save();g.globalAlpha=Math.max(0,Math.min(1,f));s.normal(g,t);g.restore();});}
function drawMascot(x,y,s,titleMode){
 var bob=Math.sin(tG*3)*2;
 var im=IMGS[masco.mood]||IMGS.base;
 if(!drawImg(ctx,im,x,y+bob,s,s)){
  dot(ctx,x+s/2,y+s/2+bob,s*0.42,RED);
  ctx.fillStyle=INK;ctx.font=F(s*0.3,true);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(masco.mood==='sad'?'@@':'^^',x+s/2,y+s/2+bob);}
 if(masco.msgT>0&&masco.msg){
  ctx.save();
  var txt=masco.msg;ctx.font=F(12.5,true);
  var tw=Math.min(280,txt.length*13.5+22);
  var bx=titleMode?x+s-6:x+s+2, by=y+6+bob;
  if(bx+tw>W-6)bx=W-6-tw;
  ctx.fillStyle=INK;rr(ctx,bx,by,tw,32,10);ctx.fill();
  ctx.beginPath();ctx.moveTo(bx+4,by+20);ctx.lineTo(bx-8,by+26);ctx.lineTo(bx+4,by+28);ctx.closePath();ctx.fill();
  ctx.fillStyle=NAVY2;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(txt,bx+tw/2,by+17);
  ctx.restore();}}
function drawFlameIcon(g,x,y,s,shake){
 g.save();g.translate(x+(shake?Math.sin(tG*40)*1.6:0),y);
 g.fillStyle=RED;g.beginPath();
 g.moveTo(0,-s);g.quadraticCurveTo(s*0.9,-s*0.25,s*0.62,s*0.35);
 g.quadraticCurveTo(s*0.5,s*0.8,0,s*0.85);
 g.quadraticCurveTo(-s*0.5,s*0.8,-s*0.62,s*0.35);
 g.quadraticCurveTo(-s*0.9,-s*0.25,0,-s);g.closePath();g.fill();
 g.fillStyle=GOLD;g.beginPath();
 g.moveTo(0,-s*0.35);g.quadraticCurveTo(s*0.4,0,s*0.26,s*0.4);
 g.quadraticCurveTo(0,s*0.66,-s*0.26,s*0.4);
 g.quadraticCurveTo(-s*0.4,0,0,-s*0.35);g.closePath();g.fill();
 g.restore();}
function drawEffects(){
 parts.forEach(function(p){ctx.globalAlpha=Math.max(0,1-p.t/p.life);dot(ctx,p.x,p.y,p.r,p.col);});
 ctx.globalAlpha=1;
 stars.forEach(function(s){var p=s.t/s.life,sc=(p<0.4?p/0.4:1-(p-0.4)/0.6)*18;
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(p*1.4);
  ctx.fillStyle=GOLD;ctx.beginPath();
  for(var i=0;i<4;i++){var a=i*Math.PI/2;
   ctx.lineTo(Math.cos(a)*sc,Math.sin(a)*sc);
   ctx.lineTo(Math.cos(a+Math.PI/4)*sc*0.28,Math.sin(a+Math.PI/4)*sc*0.28);}
  ctx.closePath();ctx.fill();ctx.restore();});
 floats.forEach(function(f){ctx.globalAlpha=Math.max(0,1-f.t/f.life);
  ctx.font=F(16,true);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);});
 ctx.globalAlpha=1;
 tweets.forEach(function(w){if(w.t<0)return;
  ctx.save();ctx.globalAlpha=Math.max(0,0.92*(1-w.t/w.life));
  var wx=w.x+Math.sin(w.sway)*14;
  ctx.fillStyle=INK;rr(ctx,wx,w.y,124,34,8);ctx.fill();
  dot(ctx,wx+14,w.y+13,7,RED);
  ctx.fillStyle='rgba(10,15,30,.3)';
  rr(ctx,wx+26,w.y+8,84,5,2.5);ctx.fill();rr(ctx,wx+26,w.y+18,60,5,2.5);ctx.fill();

 toasts.forEach(function(o,i){

  ctx.strokeStyle=GOLD;ctx.lineWidth=1.5;rr(ctx,bx,by,tw,28,14);ctx.stroke();
  ctx.fillStyle=GOLD;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(o.txt,W/2,by+15);ctx.restore();});}

   ctx.beginPath();ctx.arc(st.def.x,st.def.y,Math.max(st.def.r,22)+Math.sin(tG*8)*3,0,TAU);ctx.stroke();
   ctx.setLineDash([]);ctx.restore();
   drawFlameIcon(ctx,st.def.x,st.def.y-st.def.r-12,10,true);}});}
 ctx.restore();
 /* ラベル */
 ctx.fillStyle='rgba(10,15,30,.75)';rr(ctx,VX+6,VY+6,128,20,10);ctx.fill();
 ctx.fillStyle=CYAN;ctx.font=F(10,true);ctx.textAlign='left';
 ctx.fillText('AI生成カット ▶ 検品中',VX+14,VY+16.5);
 /* のこり破綻・コンボ */
 ctx.textAlign='left';ctx.fillStyle=INK;ctx.font=F(13,true);
 ctx.fillText('のこり破綻',16,548);
 var bi=0;
 game.slots.forEach(function(st){if(!st.broken)return;
  var bx=92+bi*26;bi++;
  ctx.save();ctx.translate(bx,548);
  if(st.found){ctx.strokeStyle=GOLD;ctx.lineWidth=3.5;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-1.5,5);ctx.lineTo(7,-5);ctx.stroke();}
  else{ctx.rotate(Math.PI/4);ctx.fillStyle=PINK;ctx.fillRect(-6,-6,12,12);}
  ctx.restore();});
 if(game.combo>1){ctx.textAlign='right';ctx.fillStyle=GOLD;ctx.font=F(16,true);
  ctx.fillText('×'+game.combo+' コンボ',406,548);}
 if(game.round===1&&game.phase==='play'&&game.phaseT<4){
  ctx.textAlign='center';ctx.fillStyle='rgba(106,215,255,.8)';ctx.font=F(12,true);
  ctx.fillText('怪しいところをタップ！',W/2,572);}
 /* フェーズ演出 */
 if(game.phase==='intro'){
  ctx.fillStyle='rgba(10,15,30,.72)';ctx.fillRect(VX,VY,VW,VH);
  ctx.textAlign='center';
  ctx.fillStyle=GOLD;ctx.font=F(30,true);ctx.fillText('CUT '+(game.round<10?'0':'')+game.round,W/2,VY+140);
  ctx.fillStyle=INK;ctx.font=F(18,true);ctx.fillText('『'+game.scene.title+'』',W/2,VY+180);
  ctx.fillStyle=CYAN;ctx.font=F(12,false);ctx.fillText('依頼主：'+game.scene.client,W/2,VY+208);
  ctx.fillStyle=PINK;ctx.font=F(14,true);
  ctx.fillText('破綻 ×'+game.slots.filter(function(s){return s.broken;}).length+' を探して修正せよ！',W/2,VY+244);}
 if(game.phase==='stamp'){
  var p=Math.min(1,game.phaseT/0.35),s=easeOutBack(p);
  ctx.save();ctx.translate(W/2,VY+190);ctx.rotate(-0.18);ctx.scale(2.6-1.6*s,2.6-1.6*s);
  ctx.globalAlpha=Math.min(1,p*1.4);
  ctx.strokeStyle=RED;ctx.lineWidth=5;rr(ctx,-92,-40,184,80,10);ctx.stroke();
  ctx.lineWidth=2;rr(ctx,-84,-32,168,64,7);ctx.stroke();
  ctx.fillStyle=RED;ctx.font=F(44,true);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('納品！',0,2);
  ctx.restore();
  if(game.phaseT>0.3&&game.phaseT<0.4)burst(W/2,VY+190,GOLD,3);}
 ctx.restore();
 drawMascot(10,H-100,88,false);
 drawEffects();}
function rResult(){
 bgGrid();
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillStyle=game.clear?GOLD:PINK;ctx.font=F(20,true);
 ctx.fillText(game.clear?'全カット納品完了！':'炎上により作業中断…',W/2,34);
 if(cardCv){try{ctx.drawImage(cardCv,59,54,302,460);}catch(e){}}
 if(game.newBest){
  ctx.save();ctx.translate(330,80);ctx.rotate(0.25+Math.sin(tG*5)*0.05);
  ctx.fillStyle=GOLD;ctx.font=F(16,true);ctx.fillText('NEW RECORD!',0,0);ctx.restore();}
 uiBtn(24,532,180,48,'画像を保存',saveCard,true);
 uiBtn(216,532,180,48,'もういちど',startGame,false);
 uiBtn(24,592,180,48,'破綻図鑑',function(){state='zukan';},false);
 uiBtn(216,592,180,48,'タイトルへ',function(){state='title';},false);
 ctx.fillStyle='rgba(243,239,230,.45)';ctx.font=F(10.5,false);ctx.textAlign='center';
 ctx.fillText('結果カードを保存してシェアしよう',W/2,668);
 drawMascot(10,H-92,80,false);
 drawEffects();}
function render(){
 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(dpr*scaleV,0,0,dpr*scaleV,dpr*ox,dpr*oy);
 buttons.length=0;
 if(state==='title')rTitle();
 else if(state==='howto')rHowto();
 else if(state==='zukan')rZukan();
 else if(state==='play')rPlay();
 else if(state==='result')rResult();
 if(state!=='play'&&state!=='result')drawEffects();
 if(paused){ctx.fillStyle='rgba(10,15,30,.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=INK;ctx.font=F(20,true);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('一時停止中',W/2,H/2);}}
/* ================= ビフォーアフター共有カード ================= */
function buildCard(){
 cardCv=document.createElement('canvas');
 cardCv.width=840;cardCv.height=1280;
 var c=cardCv.getContext('2d');
 c.scale(2,2);
 c.fillStyle=NAVY;c.fillRect(0,0,420,640);
 c.strokeStyle='rgba(47,123,255,.08)';c.lineWidth=1;
 for(var i=0;i<11;i++){c.beginPath();c.moveTo(i*42,0);c.lineTo(i*42,640);c.stroke();}
 for(i=0;i<16;i++){c.beginPath();c.moveTo(0,i*42);c.lineTo(420,i*42);c.stroke();}
 /* コーナーブラケット */
 c.strokeStyle=CYAN;c.lineWidth=3;
 [[12,12,1,1],[408,12,-1,1],[12,628,1,-1],[408,628,-1,-1]].forEach(function(b){
  c.beginPath();c.moveTo(b[0]+22*b[2],b[1]);c.lineTo(b[0],b[1]);c.lineTo(b[0],b[1]+22*b[3]);c.stroke();});
 c.textAlign='center';c.textBaseline='middle';
 c.fillStyle=CYAN;c.font=F(17,true);c.fillText('AIフィニッシャー 検収レポート',210,36);
 c.fillStyle=game.clear?GOLD:PINK;c.font=F(21,true);
 c.fillText(game.clear?'全カット納品完了！':'炎上により作業中断…',210,66);
 c.fillStyle='rgba(243,239,230,.5)';c.font=F(10,false);
 c.fillText('〜80点を100点にする者〜',210,90);
 /* ビフォーアフター */
 var k=150/380;
 c.fillStyle=PINK;c.font=F(13,true);c.fillText('修正前',115,116);
 c.fillStyle=CYAN;c.fillText('修正後',305,116);
 [[40,'before'],[230,'after']].forEach(function(pn){
  var px=pn[0],mode=pn[1];
  var slots=lastShot.scene.slots.map(function(s,i){
   var b=mode==='before'&&lastShot.broken.indexOf(i)>=0;
   return {def:s,broken:b,fix:b?0:1,found:false};});
  c.save();
  rr(c,px,126,150,158,8);c.clip();
  c.translate(px,126);c.scale(k,k);
  renderSceneInto(c,lastShot.scene,slots,0.7);
  c.restore();
  c.strokeStyle=mode==='before'?PINK:CYAN;c.lineWidth=2;
  rr(c,px,126,150,158,8);c.stroke();
  lastShot.broken.forEach(function(bi){
   var s=lastShot.scene.slots[bi];
   var mx=px+s.x*k,my=126+s.y*k,mr=Math.max(10,s.r*k*0.8);
   if(mode==='before'){c.strokeStyle=PINK;c.lineWidth=2;c.setLineDash([4,3]);
    c.beginPath();c.arc(mx,my,mr,0,TAU);c.stroke();c.setLineDash([]);}
   else{c.strokeStyle=GOLD;c.lineWidth=2.5;c.lineCap='round';
    c.beginPath();c.moveTo(mx-5,my);c.lineTo(mx-1,my+4.5);c.lineTo(mx+6,my-5);c.stroke();}});});
 /* 矢印 */
 c.fillStyle=GOLD;c.beginPath();
 c.moveTo(200,196);c.lineTo(216,196);c.lineTo(216,189);c.lineTo(228,205);c.lineTo(216,221);c.lineTo(216,214);c.lineTo(200,214);c.closePath();c.fill();
 /* スコア */
 c.fillStyle='rgba(106,215,255,.7)';c.font=F(12,true);c.fillText('SCORE',210,322);
 c.save();c.shadowColor='rgba(255,196,0,.6)';c.shadowBlur=12;
 c.fillStyle=GOLD;c.font=F(42,true);c.fillText(fmt(game.score),210,358);c.restore();
 /* 称号 */
 c.strokeStyle=PINK;c.lineWidth=2;rr(c,100,388,220,38,19);c.stroke();
 c.fillStyle=PINK;c.font=F(17,true);c.fillText('称号：'+rankOf(game.score),210,407);
 /* 統計 */
 var zc=GLIST.filter(function(kk){return save.zukan[kk];}).length;
 c.fillStyle=INK;c.font=F(12.5,false);
 c.fillText('修正した破綻 '+game.fixed+'　／　最大コンボ ×'+game.maxCombo,210,448);
 c.fillText('到達 CUT '+(game.round<10?'0':'')+game.round+'　／　破綻図鑑 '+zc+'/'+GLIST.length,210,472);
 c.strokeStyle='rgba(106,215,255,.25)';c.lineWidth=1;
 c.beginPath();c.moveTo(60,500);c.lineTo(360,500);c.stroke();
 /* マスコット＋ひとこと */
 var mim=game.clear?IMGS.joy:IMGS.sad;
 if(!drawImg(c,mim,34,516,70,70)){c.fillStyle=RED;c.beginPath();c.arc(69,551,30,0,TAU);c.fill();}
 c.textAlign='left';c.fillStyle=INK;c.font=F(12.5,true);
 c.fillText(game.clear?'このカット、キミが仕上げた。':'破綻は、見つけた者から直せる。',116,540);
 c.fillStyle='rgba(243,239,230,.55)';c.font=F(10.5,false);
 c.fillText('#AIフィニッシャー #80点を100点に',116,562);
 /* フッター */
 c.textAlign='center';
 c.fillStyle=INK;c.font=F(14,true);c.fillText('株式会社Amazing',210,600);
 c.fillStyle=CYAN;c.font=F(10.5,false);c.fillText('想像を超える、AI映像表現。',210,620);}
function saveCard(){
 if(!cardCv){toast('保存できませんでした');return;}
 try{
  var a=document.createElement('a');
  a.download='amazing_ai-finisher_result.png';
  a.href=cardCv.toDataURL('image/png');
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('画像を保存しました');
 }catch(e){toast('保存できませんでした');}}

/* ================= メインループ ================= */
var lastTs=0;
function loop(ts){
 requestAnimationFrame(loop);
 var dt=Math.min(0.05,Math.max(0,(ts-lastTs)/1000));
 lastTs=ts;
 if(!paused){update(dt);render();}}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',function(){
 if(document.hidden){paused=true;persist();render();}
 else{paused=false;}});
window.addEventListener('pagehide',persist);

/* ================= テストフック ================= */
var AF={
 startGame:startGame,endGame:endGame,startRound:startRound,onPointer:onPointer,
 buildCard:buildCard,saveCard:saveCard,persist:persist,fixSlot:fixSlot,timeUp:timeUp,
 buttons:buttons,save:save,SCENES:SCENES,GLITCH_INFO:GLITCH_INFO,GLIST:GLIST,
 VX:VX,VY:VY,VW:VW,VH:VH,rankOf:rankOf
};
Object.defineProperty(AF,'state',{get:function(){return state;},set:function(v){state=v;}});
Object.defineProperty(AF,'game',{get:function(){return game;}});
Object.defineProperty(AF,'card',{get:function(){return cardCv;}});
window.__AF__=AF;

})();
