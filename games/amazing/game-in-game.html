const SKEY='amzg_gameingame_v1';
let SAVE={stars:new Array(10).fill(0),dl:0,mute:false};
function loadSave(){
  try{
    if(typeof localStorage==='undefined')return;
    const s=localStorage.getItem(SKEY);
    if(s){const o=JSON.parse(s);
      if(o&&Array.isArray(o.stars)){SAVE.stars=o.stars.slice(0,10);
        while(SAVE.stars.length<10)SAVE.stars.push(0);}
      if(o&&typeof o.dl==='number')SAVE.dl=o.dl;
      if(o)SAVE.mute=!!o.mute;}
  }catch(e){}
}
function persist(){
  try{if(typeof localStorage!=='undefined')localStorage.setItem(SKEY,JSON.stringify(SAVE));}catch(e){}
}
function totalStars(){return SAVE.stars.reduce((a,b)=>a+b,0);}
function rank(){
  const t=totalStars();
  if(t>=27)return '伝説のクリエイター';

}

/* ---------- サウンド（WebAudio合成のみ） ---------- */
let AC=null,MG=null,nzBuf=null;
function ensureAudio(){
  if(!IS_BROWSER)return;
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      MG=AC.createGain();MG.gain.value=SAVE.mute?0:0.5;MG.connect(AC.destination);
      nzBuf=AC.createBuffer(1,AC.sampleRate*0.25,AC.sampleRate);
      const d=nzBuf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
function setMute(m){SAVE.mute=m;persist();if(MG)MG.gain.value=m?0:0.5;}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||SAVE.mute)return;
  try{
    const t=AC.currentTime+(delay||0);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(Math.max(1,f0),t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1||f0),t+dur);
    g.gain.setValueAtTime(vol||0.15,t);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
function nz(dur,vol,fc,delay){
  if(!AC||SAVE.mute)return;
  try{
    const t=AC.currentTime+(delay||0);
    const s=AC.createBufferSource();s.buffer=nzBuf;
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fc||900;f.Q.value=1.1;
    const g=AC.createGain();
    g.gain.setValueAtTime(vol||0.1,t);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+dur+0.03);
  }catch(e){}
}

/* ---------- 物理シミュレーション（決定論・固定ステップ） ---------- */
function newSim(li,placed){
  const L=LEVELS[li];
  const g=[];let start={c:1,r:8},flag={c:12,r:8};
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++){
      const ch=L.rows[r][c];
      if(ch==='P'){start={c,r};row.push('.');}
      else if(ch==='F'){flag={c,r};row.push('.');}
      else row.push(ch);
    }
    g.push(row);
  }
  return {li,g,placed:placed||{},start,flag,barrier:true,swHit:{},
    x:start.c*CELL+(CELL-RW)/2,y:start.r*CELL+CELL-RH,
    vy:0,boost:0,ground:false,t:0,done:null,events:[],anim:0};
}
function tileAt(s,c,r){
  if(c<0||c>=COLS)return '#';
  if(r<0||r>=ROWS)return '.';
  const p=s.placed[c+','+r];
  if(p)return p;
  return s.g[r][c];
}
function isSolid(s,t){
  return t==='#'||(t==='X'&&s.barrier)||t==='blk'||t==='br'||t==='bl';
}
function ev(s,type,x,y){s.events.push({type,x:(x!==undefined)?x:s.x+RW/2,y:(y!==undefined)?y:s.y+RH});}
function bounceSim(s){s.vy=-SPRINGV;s.ground=false;ev(s,'spring');}
function hstep(s){
  const vx=RUN+s.boost;
  let nx=s.x+vx*SDT;
  let hitSpr=false;
  if(vx>0){
    const fx=nx+RW,c=Math.floor(fx/CELL);
    let blocked=false;
    for(const py of [s.y+2,s.y+RH*0.5,s.y+RH-2]){
      const t=tileAt(s,c,Math.floor(py/CELL));
      if(t==='spr')hitSpr=true;
      else if(isSolid(s,t))blocked=true;
    }
    if(blocked){
      nx=c*CELL-RW-0.01;hitSpr=false;
      if(s.ground){s.vy=-JUMPV;s.ground=false;ev(s,'jump');}
    }
  }else if(vx<0){
    const c=Math.floor(nx/CELL);
    let blocked=false;
    for(const py of [s.y+2,s.y+RH*0.5,s.y+RH-2]){
      const t=tileAt(s,c,Math.floor(py/CELL));
      if(t==='spr')hitSpr=true;
      else if(isSolid(s,t))blocked=true;
    }
    if(blocked){nx=(c+1)*CELL+0.01;hitSpr=false;}
  }
  s.x=Math.max(0,Math.min(nx,GW-RW));
  if(hitSpr)bounceSim(s);
}
function floorUnder(s,fromY){
  let best=null;
  const feet=[s.x+2,s.x+RW-2];
  for(let i=0;i<feet.length;i++){
    const fx=feet[i],c=Math.floor(fx/CELL);
    for(let r=Math.max(0,Math.floor(fromY/CELL));r<ROWS;r++){
      const t=tileAt(s,c,r);
      let sy=null;
      if(t==='rmp'){
        sy=(r+1)*CELL-(fx-c*CELL);
        if(sy<r*CELL)sy=r*CELL;
      }else if(isSolid(s,t)||t==='spr'){
        sy=r*CELL;
      }
      if(sy!==null){
        if(!best||sy<best.y-0.25||(sy<=best.y+0.25&&i===1))best={y:sy,t,c,r};
        break;
      }
    }
  }
  return best;
}
function vstep(s){
  s.vy=Math.min(s.vy+GRAV*SDT,MAXFALL);
  let ny=s.y+s.vy*SDT;
  if(s.vy<0){
    const r=Math.floor(ny/CELL);
    let hit=false;
    for(const fx of [s.x+2,s.x+RW-2]){
      const t=tileAt(s,Math.floor(fx/CELL),r);
      if(isSolid(s,t)||t==='spr')hit=true;
    }
    if(hit){ny=(r+1)*CELL+0.01;s.vy=0;}
    s.y=ny;s.ground=false;
  }else{
    const surf=floorUnder(s,s.y+RH-7);
    if(surf&&ny+RH>=surf.y-0.001){
      const wasAir=!s.ground;
      s.y=surf.y-RH;s.vy=0;
      if(surf.t==='spr'){bounceSim(s);}
      else{
        s.ground=true;
        if(wasAir)ev(s,'land');
        if(surf.t==='br')s.boost=BELTV;
        else if(surf.t==='bl')s.boost=-BELTV;
        else s.boost=0;
      }
    }else{s.y=ny;s.ground=false;}
  }
}
function checkOverlap(s){
  const x1=s.x+1,x2=s.x+RW-1,y1=s.y+1,y2=s.y+RH-1;
  const fb={x:s.flag.c*CELL+5,y:s.flag.r*CELL+3,w:CELL-10,h:CELL-6};
  if(x2>fb.x&&x1<fb.x+fb.w&&y2>fb.y&&y1<fb.y+fb.h)return 'clear';
  const c1=Math.max(0,Math.floor(x1/CELL)),c2=Math.min(COLS-1,Math.floor(x2/CELL));
  const r1=Math.max(0,Math.floor(y1/CELL)),r2=Math.min(ROWS-1,Math.floor(y2/CELL));
  for(let c=c1;c<=c2;c++)for(let r=r1;r<=r2;r++){
    const t=tileAt(s,c,r);
    if(t==='^'){
      if(y2>r*CELL+CELL-16)return 'spike';
    }else if(t==='sw'&&!s.swHit[c+','+r]){
      s.swHit[c+','+r]=true;
      if(s.barrier){s.barrier=false;ev(s,'switch',c*CELL+CELL/2,r*CELL+CELL/2);}
    }
  }
  return null;
}
function simStep(s){
  if(s.done)return s.done;
  s.t+=SDT;s.anim+=SDT;
  hstep(s);
  vstep(s);
  const o=checkOverlap(s);
  if(o){s.done=o;return o;}
  if(s.y>GH+30){s.done='fall';return 'fall';}
  if(s.t>=TLIMIT){s.done='timeout';return 'timeout';}
  return null;
}
function simulate(li,placed){
  const s=newSim(li,placed);
  let n=Math.ceil((TLIMIT+1)/SDT);
  while(!s.done&&n-->0)simStep(s);
  return {result:s.done||'timeout',t:s.t};
}

/* ---------- ステージコード（発行・読込） ---------- */
function cks(str){
  let h=7;
  for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%46656;
  return h.toString(36).padStart(3,'0');
}
function encodeCode(li,placed){
  const arr=Object.keys(placed).sort().map(k=>{
    const p=k.split(',');
    return [+p[0],+p[1],PART_ORDER.indexOf(placed[k])];
  });
  const payload=btoa(JSON.stringify([li,arr]));
  return 'AMZG1.'+payload+'.'+cks(payload);
}
function decodeCode(str){
  try{
    const m=String(str).trim().match(/^AMZG1\.([A-Za-z0-9+/=]+)\.([a-z0-9]{3})$/);
    if(!m)return null;
    if(cks(m[1])!==m[2])return null;
    const d=JSON.parse(atob(m[1]));
    if(!Array.isArray(d)||d.length!==2)return null;
    const li=d[0];
    if(!(Number.isInteger(li)&&li>=0&&li<LEVELS.length))return null;
    const placed={},counts={};
    if(!Array.isArray(d[1]))return null;
    for(const it of d[1]){
      if(!Array.isArray(it)||it.length!==3)return null;
      const c=it[0],r=it[1],p=PART_ORDER[it[2]];
      if(!p)return null;
      if(!(Number.isInteger(c)&&c>=0&&c<COLS&&Number.isInteger(r)&&r>=0&&r<ROWS))return null;
      if(LEVELS[li].rows[r][c]!=='.')return null;
      const key=c+','+r;
      if(placed[key])return null;
      counts[p]=(counts[p]||0)+1;
      if(counts[p]>(LEVELS[li].budget[p]||0))return null;
      placed[key]=p;
    }
    return {li,placed};
  }catch(e){return null;}
}

function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(f>=0){r+= (255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}
  else{r*=1+f;g*=1+f;b*=1+f;}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function fontStr(size,bold){
  return (bold?'bold ':'')+size+"px 'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','BIZ UDGothic',sans-serif";
}
function txt(str,x,y,size,color,align,bold,alpha){
  ctx.save();

  ctx.font=fontStr(size,bold);
  ctx.fillStyle=color||C.ink;

  ctx.textBaseline='middle';

function wrapLines(str,maxW,size){
  ctx.font=fontStr(size);

    if(ctx.measureText(cur+ch).width>maxW){out.push(cur);cur=ch;}
    else cur+=ch;
  }
  if(cur)out.push(cur);
  return out;
}

function drawStage(li,placed,sim,mode){
  const L=LEVELS[li],skin=L.skin;
  const ox=GX+(shake>0?(Math.random()-0.5)*shake:0);
  const oy=GY+(shake>0?(Math.random()-0.5)*shake:0);

  ctx.strokeStyle='rgba(106,215,255,0.55)';ctx.lineWidth=1.5;
  rrect(ox-6,oy-6,GW+12,GH+12,10);ctx.stroke();
  ctx.save();
  ctx.beginPath();ctx.rect(ox,oy,GW,GH);ctx.clip();
  const bg=ctx.createLinearGradient(0,oy,0,oy+GH);
  bg.addColorStop(0,shade(C.navy2,-0.1));
  bg.addColorStop(1,C.navy);
  ctx.fillStyle=bg;ctx.fillRect(ox,oy,GW,GH);
  ctx.translate(ox,oy);
  drawDeco(skin.deco,gtime);
  /* ホロ略グリッド */
  ctx.strokeStyle='rgba(106,215,255,0.14)';ctx.lineWidth=1;
  ctx.beginPath();
  for(let c=1;c<COLS;c++){ctx.moveTo(c*CELL+0.5,0);ctx.lineTo(c*CELL+0.5,GH);}
  for(let r=1;r<ROWS;r++){ctx.moveTo(0,r*CELL+0.5);ctx.lineTo(GW,r*CELL+0.5);}
  ctx.stroke();
  const s=sim||{g:null,barrier:true,swHit:{},flag:null,start:null};
  const base=sim||newSimCache(li,placed);
  /* 固定タイル */
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ch=base.g[r][c],x=c*CELL,y=r*CELL;
    if(ch==='#')drawBlockTile(x,y,skin.a);
    else if(ch==='^')drawSpikeTile(x,y,skin.b);
    else if(ch==='X'&&base.barrier)drawBarrierTile(x,y,gtime);
  }
  /* 配置パーツ */
  const pl=sim?sim.placed:placed;
  for(const k in pl){
    const p=pl[k],q=k.split(','),x=+q[0]*CELL,y=+q[1]*CELL;
    if(p==='blk')drawPlacedBlock(x,y);
    else if(p==='spr')drawSpringTile(x,y,gtime);
    else if(p==='br')drawBeltTile(x,y,1,gtime);
    else if(p==='bl')drawBeltTile(x,y,-1,gtime);
    else if(p==='sw')drawSwitchTile(x,y,!!(sim&&sim.swHit[k]));
    else if(p==='rmp')drawRampTile(x,y);
  }
  drawStartPad(base.start.c*CELL,base.start.r*CELL);
  drawFlag(base.flag.c*CELL,base.flag.r*CELL,skin,gtime);
  if(sim)drawRobot(sim.x,sim.y,sim.anim,sim.ground,sim.vy,
    sim.done==='clear'?'joy':(sim.done?'sad':'normal'));
  drawFx(0,0);
  ctx.restore();
  ctx.restore();
  return {ox,oy};
}

/* ---------- テストプレイ ---------- */
const WATCH=['たのむで〜！','いけいけ！','おっ、ええ感じや！','がんばれロボ！','ドキドキするわ…'];
let watchIdx=0,watchT=0,doneT=0;
function startTest(){
  sim=newSim(LI,placed);
  stepAcc=0;footT=0;failInfo=null;doneT=0;watchIdx=Math.floor(Math.random()*WATCH.length);watchT=0;
  SFX.tap();
  goto('test');
}
function updateTest(dt){
  watchT+=dt;
  if(watchT>2.2){watchT=0;watchIdx=(watchIdx+1)%WATCH.length;}
  if(!sim)return;
  if(!sim.done){
    stepAcc+=dt;
    let guard=600;
    while(stepAcc>=SDT&&!sim.done&&guard-->0){
      stepAcc-=SDT;
      simStep(sim);
      for(const e of sim.events){
        if(e.type==='jump'){SFX.jump();burst(e.x,e.y,5,C.cyan,50,200,0.3);}
        else if(e.type==='spring'){SFX.spring();burst(e.x,e.y,10,C.pink,90,250,0.45);shake=4;}
        else if(e.type==='land'){SFX.land();burst(e.x,e.y,4,shade(C.ink,-0.3),40,150,0.25);}
        else if(e.type==='switch'){SFX.sw();SFX.open();burst(e.x,e.y,14,C.gold,80,60,0.6);shake=5;}
      }
      sim.events.length=0;
    }
    if(sim.ground&&Math.abs(RUN+sim.boost)>20){
      footT+=dt;
      if(footT>0.16){footT=0;SFX.step();}
    }
    if(sim.done){
      doneT=0;
      if(sim.done==='clear'){SFX.star();burst(sim.x+RW/2,sim.y+RH/2,20,C.gold,110,150,0.7);}
      else{
        failInfo=sim.done;shake=7;
        if(sim.done==='fall')SFX.fall();
        else if(sim.done==='spike')SFX.spike();
        else SFX.timeup();
        burst(Math.max(8,Math.min(GW-8,sim.x+RW/2)),Math.min(GH-8,sim.y),16,C.pink,100,200,0.6);
      }
    }
  }else{
    doneT+=dt;
    if(sim.done==='clear'&&doneT>0.7)deliver();
    else if(sim.done!=='clear'&&doneT>1.5){goto('edit');sim=null;}
  }
}

  const L=LEVELS[LI];
  ctx.fillStyle=C.navy;ctx.fillRect(0,0,W,H);
  topBar('テストプレイ中');

  const tleft=sim?Math.max(0,TLIMIT-sim.t):TLIMIT;
  txt('残り時間 '+tleft.toFixed(1)+'s',GX+2,GY+GH+13,11,tleft<5?C.pink:C.cyan,'left');
  txt(replayMode?'納品データ再生中':'クライアント立ち会い中',GX+GW-2,GY+GH+13,11,C.gold,'right');
  /* 観戦コメント */
  ctx.fillStyle=shade(C.ink,-0.04);rrect(60,390,W-120,54,12);ctx.fill();
  drawFlagIcon(L.skin.flag,86,417);
  txt(WATCH[watchIdx],110,417,15,C.navy,'left',true);
  if(failInfo){
    ctx.fillStyle='rgba(10,15,30,0.78)';ctx.fillRect(0,0,W,H);
    if(IMG.mascot_sad&&IMG.mascot_sad.complete&&IMG.mascot_sad.naturalWidth)
      ctx.drawImage(IMG.mascot_sad,W/2-75,240,150,150);
    ctx.fillStyle=C.navy2;rrect(50,410,W-100,80,12);ctx.fill();
    ctx.strokeStyle=C.pink;ctx.lineWidth=2;rrect(50,410,W-100,80,12);ctx.stroke();
    txt(FAILMSG[failInfo]||'失敗！',W/2,438,16,C.pink,'center',true);
    txt('大丈夫、リトライは無制限や！配置を見直そう',W/2,466,12,C.ink,'center');
  }else{
    btn(W/2-80,470,160,40,'■ 中止して編集に戻る',()=>{goto('edit');sim=null;},{ghost:1,size:13,color:C.pink});
  }
}

/* ---------- 納品（クリア） ---------- */
function deliver(){
  const uc=usedCount(),st=starsFor(LI,uc);
  const canScore=unlocked(LI);
  const gain=(900+Math.floor(Math.random()*600))*st+(LI+1)*150;
  result={stars:st,used:uc,gain,phase:'joy',timer:0,dlShown:SAVE.dl,starsShown:0,
    code:encodeCode(LI,placed),canScore};
  SFX.fanfare();
  goto('result');
  confetti();
}
function drawResult(dt){
  const L=LEVELS[LI],R=result;
  R.timer+=dt;
  ctx.fillStyle=C.navy;ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){
    ctx.strokeStyle='rgba(106,215,255,0.'+String(12-i).padStart(2,'0')+')';
    ctx.beginPath();ctx.arc(W/2,300,40+i*44+Math.sin(gtime*2+i)*6,0,7);ctx.stroke();
  }
  topBar('納品完了！');
  if(R.phase==='joy'){
    txt('DAY '+(LI+1)+'　'+L.corp,W/2,80,15,C.cyan,'center',true);
    if(IMG.mascot_joy&&IMG.mascot_joy.complete&&IMG.mascot_joy.naturalWidth)
      ctx.drawImage(IMG.mascot_joy,W/2-95,100+Math.sin(gtime*5)*6,190,190);
    const lines=wrapLines(L.joy,W-110,14);
    const bh=lines.length*21+28;
    ctx.fillStyle=shade(C.ink,-0.04);rrect(36,320,W-72,bh,14);ctx.fill();
    ctx.beginPath();ctx.moveTo(W/2-14,320);ctx.lineTo(W/2,302);ctx.lineTo(W/2+14,320);ctx.closePath();ctx.fill();
    lines.forEach((ln,i)=>txt(ln,55,344+i*21,14,C.navy,'left'));
    txt('クリア納品、確認したで！',W/2,340+bh+16,13,C.gold,'center',true);
    btn(W/2-130,400+bh,260,56,'リリースする！',()=>{
      SFX.release();R.phase='count';R.timer=0;
      if(R.canScore){
        if(R.stars>SAVE.stars[LI])SAVE.stars[LI]=R.stars;
        SAVE.dl+=R.gain;persist();
      }
    },{size:19,color:C.gold,tcol:C.navy});
  }else{
    const k=Math.min(1,R.timer/1.6);
    const ease=1-Math.pow(1-k,3);
    const target=R.canScore?SAVE.dl:R.dlShown+R.gain;
    const show=Math.floor(R.dlShown+(target-R.dlShown)*ease);
    if(k<1&&((R.timer*20)|0)!==((R.timer-dt)*20|0))SFX.count();
    txt('ゲーム、世界にリリース中…',W/2,120,15,C.cyan,'center',true);
    txt('ダウンロード数',W/2,190,14,shade(C.ink,-0.2),'center');
    ctx.save();ctx.shadowColor=C.gold;ctx.shadowBlur=18;
    txt(String(show).replace(/\B(?=(\d{3})+(?!\d))/g,','),W/2,240,44,C.gold,'center',true);
    ctx.restore();
    txt('+'+R.gain.toLocaleString()+' DL',W/2,285,15,C.cyan,'center',true);
    /* 星 */
    for(let i=0;i<3;i++){
      const on=i<R.stars&&R.timer>1.7+i*0.35;
      if(on&&R.timer-dt<=1.7+i*0.35){SFX.star();burst(W/2+(i-1)*70,350,12,C.gold,90,150,0.6);}
      txt(i<R.stars?(on?'★':'☆'):'☆',W/2+(i-1)*70,352,44,on?C.gold:shade(C.ink,-0.55),'center');
    }
    txt('使用パーツ '+R.used+'個（金星ライン '+L.par+'個）',W/2,395,12,C.ink,'center');
    if(R.stars===3)txt('納期前倒し！ボーナス金星や！',W/2,417,13,C.gold,'center',true);
    if(!R.canScore)txt('※コード再生のため実績には未反映',W/2,417,11,C.pink,'center');
    txt('肩書き：'+rank(),W/2,443,13,C.cyan,'center');
    if(R.timer>2.4){
      btn(W/2-130,478,260,50,LI<9?'次の依頼へ':'受注リストへ',()=>{
        SFX.tap();
        if(LI<9&&unlocked(LI+1))startRequest(LI+1);else goto('select');
      },{size:17});
      btn(W/2-130,538,260,40,'この配置のコードを発行',()=>{SFX.sw();openShareModal(R.code);},{ghost:1,color:C.cyan,size:14});
      btn(W/2-130,586,125,34,'もう一度',()=>{SFX.tap();goto('edit');},{ghost:1,size:12});
      btn(W/2+7,586,123,34,'タイトルへ',()=>{SFX.tap();goto('title');},{ghost:1,size:12});
    }
  }
  drawFx(0,0);
}

/* ---------- モーダル（コード発行・入力） ---------- */
function modalEls(){
  return {
    root:document.getElementById('modal'),
    title:document.getElementById('mTitle'),
    text:document.getElementById('mText'),
    a:document.getElementById('mBtnA'),
    b:document.getElementById('mBtnB'),
    info:document.getElementById('mInfo')
  };
}
function closeModal(){if(!IS_BROWSER)return;modalEls().root.classList.remove('on');}
function openShareModal(code){
  if(!IS_BROWSER)return;
  const m=modalEls();
  m.title.textContent='納品データコードを発行';
  m.text.value=code;m.text.readOnly=true;m.info.textContent='友だちに送って同じ配置で遊んでもらおう！';
  m.a.textContent='コピーする';
  m.a.onclick=()=>{
    m.text.select();m.text.setSelectionRange(0,99999);
    const done=()=>{m.info.textContent='コピーしたで！';SFX.sw();};
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(code).then(done,()=>{try{document.execCommand('copy');done();}catch(e){}});
    else{try{document.execCommand('copy');done();}catch(e){}}
  };
  m.b.onclick=()=>{closeModal();};
  m.root.classList.add('on');
}
function openCodeModal(){
  if(!IS_BROWSER)return;
  const m=modalEls();
  m.title.textContent='コードで遊ぶ';
  m.text.value='';m.text.readOnly=false;
  m.text.placeholder='AMZG1. から始まるコードを貼り付けてや';
  m.info.textContent='';
  m.a.textContent='再生する';
  m.a.onclick=()=>{
    const d=decodeCode(m.text.value);
    if(!d){m.info.textContent='コードが読めへん…もう一度確認してや';SFX.ng();return;}
    closeModal();
    LI=d.li;placed=d.placed;selPart=null;hintUsed=false;showHint2=false;replayMode=true;
    SFX.place();
    startTest();
  };
  m.b.onclick=()=>{closeModal();};
  m.root.classList.add('on');
}

/* ---------- 入力 ---------- */
function onPointer(e){
  if(!IS_BROWSER)return;
  ensureAudio();
  const rect=cv.getBoundingClientRect();
  const lx=(e.clientX-rect.left)*W/rect.width;
  const ly=(e.clientY-rect.top)*H/rect.height;
  for(let i=buttons.length-1;i>=0;i--){
    const b=buttons[i];
    if(lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h){
      if(!b.disabled)b.cb();
      return;
    }
  }
  if(SCR==='edit')editTap(lx,ly);
}

/* ---------- メインループ ---------- */
let lastTs=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(document.hidden){lastTs=ts;return;}
  let dt=(ts-lastTs)/1000;lastTs=ts;
  if(!(dt>0))dt=0.016;
  if(dt>0.05)dt=0.05;
  gtime+=dt;
  updateFx(dt);
  buttons=[];
  if(SCR==='test')updateTest(dt);
  ctx.setTransform(fitScale,0,0,fitScale,0,0);
  if(SCR==='title')drawTitle(dt);
  else if(SCR==='select')drawSelect();
  else if(SCR==='request')drawRequest();
  else if(SCR==='edit')drawEdit();
  else if(SCR==='test')drawTest();
  else if(SCR==='result')drawResult(dt);
}
function resize(){
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const fw=window.innerWidth,fh=window.innerHeight;
  const fit=Math.min(fw/W,fh/H);
  cv.style.width=(W*fit)+'px';
  cv.style.height=(H*fit)+'px';
  cv.width=Math.round(W*fit*dpr);
  cv.height=Math.round(H*fit*dpr);
  fitScale=fit*dpr;
}
function boot(){
  loadSave();
  cv=document.getElementById('cv');
  ctx=cv.getContext('2d');
  for(const n of ['mascot','mascot_joy','mascot_sad','mascot_point']){
    const im=new Image();im.src='assets/'+n+'.png';IMG[n]=im;
  }
  resize();
  window.addEventListener('resize',resize);
  cv.addEventListener('pointerdown',onPointer);
  document.addEventListener('visibilitychange',()=>{persist();});
  window.addEventListener('pagehide',persist);
  requestAnimationFrame(frame);
}
if(IS_BROWSER)boot();
else loadSave();

/* ---------- ヘッドレス検証用API ---------- */
if(typeof window!=='undefined'){
  window.__testAPI={LEVELS,PART_ORDER,simulate,newSim,simStep,encodeCode,decodeCode,
    starsFor:(li,used)=>starsFor(li,used),
    state:()=>({scr:SCR,li:LI,placed:Object.assign({},placed),stars:SAVE.stars.slice(),dl:SAVE.dl})};
}
</script>
