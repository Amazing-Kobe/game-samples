/* ---------------- セーブ ---------------- */
function defaultSave(){
  var zs=[]; for(var i=0;i<ZONES.length;i++) zs.push({unlocked:i===0, surveyed:false, recovery:0, stock:null, job:null});
  return {v:1, money:150, zones:zs, sonarLv:1, factoryLv:1, craneLv:1,
          catalog:[], muted:false, tut:0, finale:false, last:Date.now()};
}
function mergeSave(sv){
  var d = defaultSave();
  if(!sv || typeof sv!=='object') return d;
  var keys=['money','sonarLv','factoryLv','craneLv','muted','tut','finale','last'];
  for(var k=0;k<keys.length;k++){ if(sv[keys[k]]!==undefined && sv[keys[k]]!==null) d[keys[k]]=sv[keys[k]]; }
  if(typeof d.money!=='number' || !isFinite(d.money) || d.money<0) d.money=0;
  ['sonarLv','factoryLv','craneLv'].forEach(function(k){
    d[k]=Math.max(1,Math.min(MAXLV,Math.floor(Number(d[k])||1)));
  });
  if(Array.isArray(sv.catalog)) d.catalog = sv.catalog.filter(function(p){return !!productOf(p);});
  if(Array.isArray(sv.zones)){
    for(var i=0;i<d.zones.length;i++){
      var z=sv.zones[i]; if(!z) continue;
      d.zones[i].unlocked = !!z.unlocked || i===0;
      d.zones[i].surveyed = !!z.surveyed;
      d.zones[i].recovery = Math.max(0,Math.min(3,Number(z.recovery)||0));
      d.zones[i].stock = (z.stock && productOf(z.stock)) ? z.stock : null;
      if(z.job && productOf(z.job.pid) && Number(z.job.remain)>0){
        d.zones[i].job={pid:z.job.pid, total:Number(z.job.total)||6, remain:Number(z.job.remain)};
      }
    }
  }
  return d;
}
function checksum36(s){
  var n=0; for(var i=0;i<s.length;i++) n=(n+s.charCodeAt(i))%9973;
  return n.toString(36);
}
function encodeSave(sv){
  var j=JSON.stringify(sv);
  return 'REEF1.'+btoa(unescape(encodeURIComponent(j)))+'.'+checksum36(j);
}
function decodeSave(code){
  try{
    var p=String(code).trim().split('.');
    if(p.length!==3 || p[0]!=='REEF1') return null;
    var j=decodeURIComponent(escape(atob(p[1])));
    if(checksum36(j)!==p[2]) return null;
    var sv=JSON.parse(j);
    if(!sv || !sv.zones) return null;
    return sv;
  }catch(e){ return null; }
}
function saveGame(){
  S.last=Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadGame(){
  try{
    var j=localStorage.getItem(SAVE_KEY);
    if(j) return mergeSave(JSON.parse(j));
  }catch(e){}
  return defaultSave();
}

/* ---------------- ロジック（純粋系） ---------------- */
function stageOf(z){ return Math.min(3, Math.floor(z.recovery + 1e-9)); }
function zoneIncomeOf(z, i){ return stageOf(z)*2*ZONES[i].tier; }
function totalIncomeOf(sv){
  var t=0; for(var i=0;i<sv.zones.length;i++) t+=zoneIncomeOf(sv.zones[i],i);
  return t;
}
function offlineGain(sv, now){
  var sec=Math.max(0, Math.min((now-(sv.last||now))/1000, OFFLINE_CAP));
  return {sec:sec, gain:Math.floor(totalIncomeOf(sv)*sec*OFFLINE_RATE)};
}
function perfectThr(lv){ return 0.9 - 0.02*(lv-1); }
function constructEffect(correct, acc, craneLv){
  var p = acc >= perfectThr(craneLv);
  var m = p ? 1.25 : 0.55 + 0.65*acc;
  return {amount:(correct?1:1/3)*m, perfect:p};
}
function upgradeCost(u, lv){ return Math.round(u.base*Math.pow(3, lv-1)); }
function jobsCount(sv){
  var n=0; for(var i=0;i<sv.zones.length;i++) if(sv.zones[i].job) n++;
  return n;
}
function mfgTime(){ return 6.0; }
function allDone(sv){
  for(var i=0;i<sv.zones.length;i++) if(sv.zones[i].recovery<3-1e-9) return false;
  return true;
}
/* 施工を確定させる（クレーン結果から呼ぶ） */
function applyConstruction(i, acc){
  var z=S.zones[i], zd=ZONES[i];
  var pid=z.stock; z.stock=null;
  var correct = pid===zd.correct;
  var eff=constructEffect(correct, acc, S.craneLv);
  var oldStage=stageOf(z);
  z.recovery=Math.min(3, z.recovery+eff.amount);
  var newStage=stageOf(z);
  var registered=false;
  if(correct && S.catalog.indexOf(pid)<0){ S.catalog.push(pid); registered=true; }
  var gain=Math.round(25*zd.tier*(eff.perfect?1.6:1)*(correct?1:0.5));
  S.money+=gain;
  return {pid:pid, correct:correct, perfect:eff.perfect, amount:eff.amount,
          oldStage:oldStage, newStage:newStage, gain:gain, registered:registered};
}

/* ---------------- サウンド (WebAudio合成) ---------------- */
var ACctor = (typeof window!=='undefined') ? (window.AudioContext||window.webkitAudioContext) : null;
var ac=null;
function audio(){
  if(!ACctor) return null;
  if(!ac){ try{ ac=new ACctor(); }catch(e){ ACctor=null; return null; } if(ac) bgmStart(); }
  if(ac.state==='suspended'){ try{ac.resume();}catch(e){} }
  return ac;
}
function tone(f, dur, type, vol, delay, f2){
  var a=audio(); if(!a || S.muted) return;
  try{
    var t0=a.currentTime+(delay||0);
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f, t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol||0.12, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function noiseBurst(dur, vol, freq, delay){
  var a=audio(); if(!a || S.muted) return;
  try{
    var t0=a.currentTime+(delay||0);
    var len=Math.max(1, Math.floor(a.sampleRate*dur));
    var buf=a.createBuffer(1, len, a.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var src=a.createBufferSource(); src.buffer=buf;
    var fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=freq||1000;
    var g=a.createGain();
    g.gain.setValueAtTime(vol||0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(fl); fl.connect(g); g.connect(a.destination);
    src.start(t0);
  }catch(e){}
}
/* ---------- BGM（WebAudio自動演奏・静かな壮大系 84BPM） ---------- */
var BGM={on:false, step:0, next:0, timer:null, bus:null};
var BGM_SPB=60/84/2, BGM_LOOP=32;
var BGM_CH=[[48,55,60,64],[43,55,59,62],[45,57,60,64],[41,53,57,60]]; /* C G Am F */
var BGM_MEL=[[72,79],[71,74],[76,81],[72,77]];
function bnF(n){ return 440*Math.pow(2,(n-69)/12); }
function bgmBus(){ if(!BGM.bus){ BGM.bus=ac.createGain(); BGM.bus.gain.value=0.9; BGM.bus.connect(ac.destination); } return BGM.bus; }
function bgmNote(t,midi,dur,type,vol,lp,mul){
  var o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(bnF(midi)*(mul||1),t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.06);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);
  if(lp){ var fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp; g.connect(fl); fl.connect(bgmBus()); }
  else g.connect(bgmBus());
  o.start(t); o.stop(t+dur+0.08);
}
function bgmHat(t,vol){
  var n=Math.floor(ac.sampleRate*0.05), buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource(); s.buffer=buf;
  var f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=5500;
  var g=ac.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(bgmBus()); s.start(t);
}
function bgmStep(st,t){
  if(S.muted) return;
  var bar=Math.floor(st/8)%4, ch=BGM_CH[bar], ib=st%8, i;
  if(ib===0){
    for(i=1;i<4;i++){
      bgmNote(t, ch[i], 2.6, 'sawtooth', 0.02, 750, 0.997);
      bgmNote(t, ch[i], 2.6, 'sawtooth', 0.02, 750, 1.003);
    }
  }
  if(ib===0||ib===4) bgmNote(t, ch[0], 0.34, 'sine', 0.085);
  if(ib===2) bgmNote(t, BGM_MEL[bar][0], 0.6, 'sine', 0.045, 3200);
  if(ib===6){ bgmNote(t, BGM_MEL[bar][1], 0.6, 'sine', 0.045, 3200); bgmHat(t, 0.008); }
}
function bgmTick(){
  if(!ac||!BGM.on) return;
  var ahead=ac.currentTime+0.2;
  while(BGM.next<ahead){ try{ bgmStep(BGM.step,BGM.next); }catch(e){} BGM.step=(BGM.step+1)%BGM_LOOP; BGM.next+=BGM_SPB; }
}
function bgmStart(){
  if(!ac||BGM.on) return;
  BGM.on=true; BGM.step=0; BGM.next=ac.currentTime+0.15;
  BGM.timer=setInterval(bgmTick,50);
}

/* ---------------- キャンバス ---------------- */
var cv = document.getElementById('cv');
var ctx = cv ? cv.getContext('2d') : null;
var fitScale=1;
function resize(){
  if(!cv) return;
  var iw=window.innerWidth||W, ih=window.innerHeight||H;
  fitScale=Math.min(iw/W, ih/H);
  var dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*fitScale*dpr);
  cv.height=Math.round(H*fitScale*dpr);
  cv.style.width=(W*fitScale)+'px';
  cv.style.height=(H*fitScale)+'px';
  if(ctx) ctx.setTransform(fitScale*dpr,0,0,fitScale*dpr,0,0);
}

/* ---------------- 汎用描画 ---------------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function txt(t,x,y,size,color,align,bold,alpha){
  ctx.save();
  if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.font=(bold?'bold ':'')+size+'px '+FONT;
  ctx.fillStyle=color;
  ctx.textAlign=align||'center';
  ctx.textBaseline='middle';
  ctx.fillText(t,x,y);
  ctx.restore();
}
function txtO(t,x,y,size,color,outline,align,bold){
  ctx.save();
  ctx.font=(bold?'bold ':'')+size+'px '+FONT;

function hex2rgb(h){
  return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];
}
function lerpColor(a,b,t){
  t=Math.max(0,Math.min(1,t));
  var A=hex2rgb(a),B=hex2rgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';
}
function fmt(n){ return Math.floor(n).toLocaleString('ja-JP'); }
function wrapJ(t, n){
  var out=[], lines=String(t).split('\n');
  for(var i=0;i<lines.length;i++){
    var s=lines[i];
    while(s.length>n){ out.push(s.slice(0,n)); s=s.slice(n); }
    out.push(s);
  }
  return out;
}

function desiredFish(zi){
  var st=stageOf(S.zones[zi]);
  return st>=3?12 : st===2?6 : 0;
}
function manageFish(){
  var counts=[0,0,0,0,0,0];
  for(var i=0;i<fishes.length;i++) counts[fishes[i].z]++;
  for(var z=0;z<6;z++){
    var want=desiredFish(z);
    if(counts[z]<want) spawnFish(z, Math.min(3,want-counts[z]), 46);
    else if(counts[z]>want){
      var rm=counts[z]-want;
      for(var j=fishes.length-1;j>=0 && rm>0;j--){
        if(fishes[j].z===z){ fishes.splice(j,1); rm--; }
      }
    }
  }
}
function updateFish(dt){
  for(var i=0;i<fishes.length;i++){
    var f=fishes[i], zd=ZONES[f.z];
    var ax=0, ay=0;
    var dx=zd.x-f.x, dy=zd.y-f.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    if(d>f.roam){ ax+=dx/d*80; ay+=dy/d*80; }
    var cx=0, cy=0, n=0;
    for(var j=0;j<fishes.length;j++){
      if(j===i) continue;
      var o=fishes[j]; if(o.z!==f.z) continue;
      var ox=f.x-o.x, oy=f.y-o.y, od2=ox*ox+oy*oy;
      if(od2<110 && od2>0.01){ ax+=ox*4; ay+=oy*4; }
      if(od2<900){ cx+=o.vx; cy+=o.vy; n++; }
    }
    if(n){ ax+=(cx/n-f.vx)*0.9; ay+=(cy/n-f.vy)*0.9; }
    ax+=Math.sin(time*2+f.ph)*20;
    ay+=Math.cos(time*1.6+f.ph)*14;
    f.vx+=ax*dt; f.vy+=ay*dt;
    var sp=Math.sqrt(f.vx*f.vx+f.vy*f.vy);
    if(sp>f.spd){ f.vx*=f.spd/sp; f.vy*=f.spd/sp; }
    if(sp<10){ f.vx+=(Math.random()-0.5)*20*dt+4*dt; }
    f.x+=f.vx*dt; f.y+=f.vy*dt;
  }
}
function drawFish(){
  for(var i=0;i<fishes.length;i++){
    var f=fishes[i];
    var a=Math.atan2(f.vy,f.vx);
    ctx.save();
    ctx.translate(f.x,f.y); ctx.rotate(a);
    ctx.globalAlpha=0.9;
    ctx.fillStyle=f.hue;
    ctx.beginPath();
    ctx.moveTo(f.size,0);
    ctx.quadraticCurveTo(0,-f.size*0.6,-f.size*0.8,0);
    ctx.quadraticCurveTo(0,f.size*0.6,f.size,0);
    ctx.fill();
    var w=Math.sin(time*10+f.ph)*0.5;
    ctx.beginPath();
    ctx.moveTo(-f.size*0.7,0);
    ctx.lineTo(-f.size*1.5,-f.size*0.5+w);
    ctx.lineTo(-f.size*1.5,f.size*0.5+w);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function tracePoly(pts, grow){
  ctx.beginPath();
  var cxm=0, cym=0;
  for(var i=0;i<pts.length;i++){ cxm+=pts[i][0]; cym+=pts[i][1]; }
  cxm/=pts.length; cym/=pts.length;
  for(var j=0;j<pts.length;j++){
    var px=pts[j][0], py=pts[j][1];
    if(grow){ px=cxm+(px-cxm)*grow; py=cym+(py-cym)*grow; }
    if(j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);

  ctx.closePath();
}

    grad.addColorStop(0,lerpColor('#43555f','#4fd8e8',k));
    grad.addColorStop(1,base);
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(zd.x,zd.y,r-4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=st>=3?COL.green:COL.aqua; ctx.lineWidth=st>=3?3:2;
    ctx.globalAlpha=st>=3?0.9:0.55;
    ctx.beginPath(); ctx.arc(zd.x,zd.y,r-3,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
    // 状態アイコン
    if(!z.surveyed){
      var pulse=1+Math.sin(time*3)*0.1;
      txtO('？',zd.x,zd.y,26*pulse,COL.white,COL.navy,'center',true);
    }else if(z.job){
      ctx.save(); ctx.translate(zd.x,zd.y); ctx.rotate(time*2.4);
      ctx.fillStyle=COL.sand;
      for(var g2=0;g2<6;g2++){ ctx.rotate(Math.PI/3); ctx.fillRect(-2,-11,4,22); }
      ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=COL.navy; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }else if(z.stock){
      drawProductIcon(z.stock,zd.x,zd.y-2,22);
      txtO('施工!',zd.x,zd.y+16,11,COL.coral,COL.navy,'center',true);
    }else if(st>=3){
      // キラキラ
      var tw=0.5+0.5*Math.sin(time*5+i);
      ctx.globalAlpha=tw;
      txtO('✦',zd.x-12,zd.y-10,14,COL.white,COL.navy);
      ctx.globalAlpha=1-tw*0.5;
      txtO('✦',zd.x+10,zd.y+6,10,COL.sand,COL.navy);
      ctx.globalAlpha=1;
    }else{
      txtO('製造へ',zd.x,zd.y,13,COL.white,COL.navy,'center',true);
    }
    // 回復ピップ
    for(var p=0;p<3;p++){
      ctx.fillStyle = st>p ? COL.green : 'rgba(244,249,255,0.28)';
      ctx.beginPath(); ctx.arc(zd.x-12+p*12, zd.y+27, 3.4, 0, Math.PI*2); ctx.fill();
    }
  }
  // 海藻（stage2以上）
  if(z.unlocked && stageOf(z)>=2){
    ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.lineCap='round';
    for(var s2=0;s2<3;s2++){
      var bx=zd.x-26+s2*26, by=zd.y+34;

      ctx.quadraticCurveTo(bx+sway,by-4,bx+sway*1.4,by-12);
      ctx.stroke();
    }
  }
  txtO(zd.name, zd.x, zd.y+48, 13, COL.white, COL.navy, 'center', true);
  ctx.restore();
  if(view.name==='map'){
    (function(idx){
      addHit(zd.x-44,zd.y-44,88,88,function(){ zoneTap(idx); });
    })(i);
  }
  // 初回誘導矢印
  if(S.tut>=3 && i===0 && !z.surveyed && view.name==='map' && !modal){

/* ---------------- パーティクル更新/描画 ---------------- */
function updateFx(dt){
  var i;
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.age+=dt;
    if(p.age>=p.life){ particles.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(i=floaters.length-1;i>=0;i--){
    var f=floaters[i]; f.age+=dt;
    if(f.age>=f.life){ floaters.splice(i,1); continue; }
    f.y-=32*dt;
  }
  for(i=bubblesFx.length-1;i>=0;i--){
    var b=bubblesFx[i]; b.age+=dt;
    if(b.age>=b.life){ bubblesFx.splice(i,1); continue; }
    b.y+=b.vy*dt; b.x+=Math.sin(b.age*5+b.wob)*12*dt;
  }
  for(i=waveRings.length-1;i>=0;i--){
    var wr=waveRings[i]; wr.age+=dt;
    if(wr.age>=wr.life){ waveRings.splice(i,1); continue; }
    wr.r=wr.max*(wr.age/wr.life);
  }
  for(i=smokes.length-1;i>=0;i--){
    smokes[i].age+=dt;
    if(smokes[i].age>=smokes[i].life) smokes.splice(i,1);
  }
  if(jobsCount(S)>0 && Math.random()<dt*4){
    smokes.push({x:FACT.x+15,y:FACT.y-40,age:0,life:1.6,wob:Math.random()*7});
  }
  if(shakeT>0) shakeT-=dt;
}
function drawFx(){
  var i;
  for(i=0;i<waveRings.length;i++){
    var wr=waveRings[i], k=wr.age/wr.life;
    ctx.globalAlpha=(1-k)*0.8;
    ctx.strokeStyle=wr.color; ctx.lineWidth=2.5*(1-k)+0.5;
    ctx.beginPath(); ctx.arc(wr.x,wr.y,wr.r,0,Math.PI*2); ctx.stroke();
  }
  for(i=0;i<particles.length;i++){
    var p=particles[i], k2=p.age/p.life;
    ctx.globalAlpha=1-k2;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1-k2*0.5),0,Math.PI*2); ctx.fill();
  }
  for(i=0;i<bubblesFx.length;i++){
    var b=bubblesFx[i], k3=b.age/b.life;
    ctx.globalAlpha=(1-k3)*0.7;
    ctx.strokeStyle=COL.white; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(i=0;i<floaters.length;i++){
    var f=floaters[i], k4=f.age/f.life;
    ctx.globalAlpha=k4<0.8?1:(1-(k4-0.8)/0.2);
    txtO(f.t,f.x,f.y,f.size,f.color,COL.navy,'center',true);
  }
  ctx.globalAlpha=1;
}

function zoneTap(i){

function startJob(i,pid){
  var pr=productOf(pid);
  if(jobsCount(S)>=S.factoryLv){
    sfx.denied();
    floater(W/2,H/2,'工場ラインがいっぱい！',COL.coral,15);
    return;
  }
  if(S.money<pr.cost){
    sfx.denied();
    floater(W/2,H/2,'お金がたりない！',COL.coral,15);
    return;
  }
  S.money-=pr.cost;
  S.zones[i].job={pid:pid, total:mfgTime(), remain:mfgTime()};
  sfx.clank();
  burst(FACT.x,FACT.y-20,8,COL.sand,90);
  modal={type:'mfg', zone:i};
  saveGame();
}

/* ---------------- ソナーミニゲーム ---------------- */
function sonarSpeed(){ return Math.max(85, 150-18*(S.sonarLv-1)); }
function updateSonar(dt){
  var v=view;
  v.t+=dt;
  if(v.phase==='sail'){
    if(v.t>=1.5){ v.phase='play'; v.t=0; v.ringR=0; sfx.ping(); }
  }else if(v.phase==='play'){
    v.ringR+=sonarSpeed()*dt;
    if(v.flashT>0) v.flashT-=dt;
    if(v.ringR>168){ registerPing(0); }
  }else if(v.phase==='result'){
    if(v.flashT>0) v.flashT-=dt;
  }
}
function registerPing(acc){
  var v=view;
  v.accs.push(acc);
  v.flashT=0.55;
  if(acc>=0.9){ v.flashTxt='PERFECT!'; v.flashCol=COL.coral; sfx.perfect();
    waveRings.push({x:210,y:330,r:10,max:150,age:0,life:0.6,color:COL.aqua});
    waveRings.push({x:210,y:330,r:10,max:110,age:0,life:0.5,color:COL.white});
    waveRings.push({x:210,y:330,r:10,max:70,age:0,life:0.4,color:COL.coral});
    shake(3,0.2);
  }
  else if(acc>=0.6){ v.flashTxt='GOOD!'; v.flashCol=COL.aqua; sfx.good(); }
  else if(acc>0.25){ v.flashTxt='OK'; v.flashCol=COL.sand; sfx.click(); }
  else { v.flashTxt='MISS…'; v.flashCol='#8a9aa5'; sfx.miss(); }
  if(v.accs.length>=3){
    v.phase='result'; v.t=0;
    var avg=(v.accs[0]+v.accs[1]+v.accs[2])/3;
    var zd=ZONES[v.zone];
    v.bonus=Math.round((20+avg*45*(1+0.4*(S.sonarLv-1)))*Math.sqrt(zd.tier));
    S.zones[v.zone].surveyed=true;
    S.money+=v.bonus;
    sfx.chime();
    saveGame();
  }else{
    v.ringR=0;
    v.target=60+Math.random()*65;
    sfx.ping();
  }
}
function drawSonar(){
  var v=view, zd=ZONES[v.zone];
  drawMapBase();
  if(v.phase==='sail'){
    var k=Math.min(1,v.t/1.5), e=1-Math.pow(1-k,3);
    var sx=PORT.x+(zd.x-PORT.x)*e, sy=PORT.y+(zd.y-PORT.y)*e-Math.sin(e*Math.PI)*24;
    var ang=Math.atan2(zd.y-PORT.y, zd.x-PORT.x)*0.25;
    if(Math.random()<0.4) bubblesFx.push({x:sx-14,y:sy+8,vy:-8,r:1.5+Math.random()*2,age:0,life:0.8,wob:Math.random()*6});
    drawFx();
    drawSurveyShip(sx,sy,ang,1.25,false);
    drawTopBar();
    txtO('オリテク号、出航！', W/2, 120, 20, COL.white, COL.navy, 'center', true);
    return;
  }
  ctx.fillStyle='rgba(7,18,28,0.82)';
  ctx.fillRect(0,0,W,H);
  var cx2=210, cy2=330, R=150;
  if(v.phase==='play'){
    // スコープ
    ctx.save();
    var sg=ctx.createRadialGradient(cx2,cy2,10,cx2,cy2,R);
    sg.addColorStop(0,'#0f3a52'); sg.addColorStop(1,'#0a2438');
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.arc(cx2,cy2,R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=COL.aqua; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx2,cy2,R,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=0.25; ctx.lineWidth=1;
    for(var g3=40;g3<R;g3+=40){ ctx.beginPath(); ctx.arc(cx2,cy2,g3,0,Math.PI*2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(cx2-R,cy2); ctx.lineTo(cx2+R,cy2);
    ctx.moveTo(cx2,cy2-R); ctx.lineTo(cx2,cy2+R); ctx.stroke();
    ctx.globalAlpha=1;
    // 回転スイープ
    var sa=time*1.8;
    var swg=ctx.createConicGradient ? null : null;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx2,cy2,R,0,Math.PI*2); ctx.clip();
    ctx.globalAlpha=0.22;
    ctx.fillStyle=COL.aqua;
    ctx.beginPath(); ctx.moveTo(cx2,cy2);
    ctx.arc(cx2,cy2,R,sa-0.5,sa); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 的リング
    ctx.setLineDash([8,6]);
    ctx.strokeStyle=COL.coral; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(cx2,cy2,v.target,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    // 広がるリング
    if(v.ringR<=R+16){
      ctx.strokeStyle=COL.white; ctx.lineWidth=3;
      ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.arc(cx2,cy2,v.ringR,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=0.3;
      ctx.strokeStyle=COL.aqua; ctx.lineWidth=8;
      ctx.beginPath(); ctx.arc(cx2,cy2,v.ringR,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.restore();
    // 船（上に小さく）
    drawSurveyShip(cx2, 130, 0, 1.1, true);
    txtO('リングが重なった瞬間にタップ！', W/2, 540, 15, COL.white, COL.navy, 'center', true);
    for(var d2=0;d2<3;d2++){
      ctx.fillStyle = v.accs.length>d2 ? COL.aqua : 'rgba(244,249,255,0.3)';
      ctx.beginPath(); ctx.arc(cx2-24+d2*24, 578, 6, 0, Math.PI*2); ctx.fill();
    }
    if(v.flashT>0 && v.flashTxt){
      var fk=1-v.flashT/0.55;
      txtO(v.flashTxt, cx2, cy2-40-fk*24, 26, v.flashCol, COL.navy, 'center', true);
    }
    drawFx();
    addHit(0,60,W,H-60,function(){
      if(view.name==='sonar' && view.phase==='play'){
        var acc=Math.max(0, 1-Math.abs(view.ringR-view.target)/34);
        registerPing(acc);
      }
    });
  }else{ // result: 課題カード
    drawFx();
    var px=36, py=180, pw=W-72, ph=330;
    ctx.fillStyle=COL.white; rr(px,py,pw,ph,16); ctx.fill();
    ctx.strokeStyle=COL.coral; ctx.lineWidth=4; rr(px,py,pw,ph,16); ctx.stroke();
    ctx.fillStyle=COL.coral; rr(px,py,pw,44,16); ctx.fill(); ctx.fillRect(px,py+26,pw,18);
    txt('課題カード発見！', px+pw/2, py+22, 17, COL.white, 'center', true);
    txt(zd.name, px+pw/2, py+72, 18, COL.navy, 'center', true);
    var lines=wrapJ(zd.issue, 14);
    for(var l2=0;l2<lines.length;l2++)
      txt(lines[l2], px+pw/2, py+104+l2*20, 14, COL.coral, 'center', true);
    var hl=wrapJ('ヒント：'+zd.hint, 16);
    for(var l3=0;l3<hl.length;l3++)
      txt(hl[l3], px+pw/2, py+150+l3*17, 11.5, '#5a6b78', 'center');
    var avg=(v.accs[0]+v.accs[1]+v.accs[2])/3;
    txt('調査精度 '+Math.round(avg*100)+'%', px+pw/2, py+212, 13, COL.navy, 'center');
    txt('調査ボーナス +'+fmt(v.bonus), px+pw/2, py+236, 16, '#1d7a8c', 'center', true);
    bigButton(px+40, py+ph-64, pw-80, 46, 'なるほど！', COL.aqua, function(){
      view={name:'map'};
      modal={type:'zone', zone:v.zone};
      sfx.click();
    });
  }
  drawTopBar();
}

/* ---------------- クレーンミニゲーム ---------------- */
function craneSpeed(){ return Math.max(1.9, 3.4-0.35*(S.craneLv-1)); }
function updateCrane(dt){
  var v=view;
  v.t+=dt;
  if(v.phase==='sail'){
    if(v.t>=1.6){ v.phase='play'; v.t=0; }
  }else if(v.phase==='play'){
    v.pos=Math.sin(v.t*craneSpeed());
  }else if(v.phase==='drop'){
    v.dropT+=dt;
    if(v.dropT>=0.55 && !v.splashed){
      v.splashed=true;
      var zd=ZONES[v.zone];
      if(v.acc>=perfectThr(S.craneLv)){ sfx.bigsplash(); splashColumn(210,470,true); shake(6,0.4); }
      else { sfx.splash(); splashColumn(210,470,false); shake(3,0.25); }
      bubbleFx(210,480,14);
    }
    if(v.dropT>=1.1 && !v.applied){
      v.applied=true;
      v.res=applyConstruction(v.zone, v.acc);
      if(v.res.newStage>v.res.oldStage) stageUpFx(v.zone, v.res.newStage);
      if(v.res.registered){ catalogNew=true; }
      floater(210, 430, '+'+fmt(v.res.gain)+' 水揚げ', COL.sand, 16);
      sfx.coin();
      saveGame();
      v.phase='result'; v.t=0;
    }
  }
}

        drawProductIcon(r.pid, px+42, py+178, 34);
        txt('図鑑に登録！', px+66, py+160, 12, COL.green, 'left', true);
        txt(productOf(r.pid).name, px+66, py+178, 13, COL.navy, 'left', true);
        var dl=wrapJ(productOf(r.pid).desc, 20);
        for(var l4=0;l4<dl.length&&l4<2;l4++)
          txt(dl[l4], px+30, py+200+l4*15, 10, '#44555f', 'left');
      }
    }
    bigButton(px+40, py+ph-58, pw3-80, 44, 'マップへ', COL.aqua, function(){
      var zi=v.zone;
      view={name:'map'};
      if(S.zones[zi].recovery<3-1e-9) modal={type:'zone', zone:zi};
      sfx.click();
    });
  }
  drawFx();
  drawTopBar();
}

/* ---------------- フィナーレ ---------------- */
function startFinale(){
  view={name:'finale', t:0, fanfared:false};
}
function drawFinale(){
  var v=view, t=v.t;
  // 空: 夜明け
  var dawn=Math.min(1, t/4);
  var sky=ctx.createLinearGradient(0,0,0,H*0.62);
  sky.addColorStop(0, lerpColor('#0d2b45', '#3f6a8a', dawn));
  sky.addColorStop(0.65, lerpColor('#0d2b45', COL.coral, dawn*0.85));
  sky.addColorStop(1, lerpColor('#123a54', '#f0c04a', dawn));
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.62);
  // 太陽
  var sunY=H*0.62 - Math.min(1,t/5)*150;
  var sg2=ctx.createRadialGradient(210,sunY,4,210,sunY,90);
  sg2.addColorStop(0,'#fff3d0'); sg2.addColorStop(0.4,COL.gold); sg2.addColorStop(1,'rgba(240,192,74,0)');
  ctx.fillStyle=sg2;
  ctx.beginPath(); ctx.arc(210,sunY,90,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=COL.gold;
  ctx.beginPath(); ctx.arc(210,sunY,26,0,Math.PI*2); ctx.fill();
  // 海
  var sea=ctx.createLinearGradient(0,H*0.62,0,H);
  sea.addColorStop(0, lerpColor('#0d2b45','#1897b4',dawn));
  sea.addColorStop(1,'#0d2b45');
  ctx.fillStyle=sea; ctx.fillRect(0,H*0.62,W,H*0.38);
  // 太陽の道
  ctx.globalAlpha=0.35*dawn;
  ctx.fillStyle=COL.gold;
  ctx.beginPath();
  ctx.moveTo(195,H*0.62); ctx.lineTo(225,H*0.62); ctx.lineTo(250,H); ctx.lineTo(170,H);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  // きらめく波
  for(var i=0;i<14;i++){
    var wy=H*0.64+i*8, tw=0.3+0.3*Math.sin(time*3+i*1.7);
    ctx.globalAlpha=tw*dawn;
    ctx.fillStyle=COL.white;
    ctx.fillRect(80+((i*67)%260)+Math.sin(time+i)*8, wy, 14, 1.6);
  }
  ctx.globalAlpha=1;
  // 島シルエット＋橋
  ctx.save();
  ctx.translate(0,H*0.62-540);
  ctx.globalAlpha=0.92;
  ctx.fillStyle='#0a2036';
  tracePoly(ISLAND,1.06); ctx.fill();
  ctx.restore();
  drawBridge(245,H*0.62-540+150,338,H*0.62-540+80,true);
  drawBridge(150,H*0.62-540+548,80,H*0.62-540+610,true);
  // 魚のジャンプ
  if(t>1){
    var jt=(time*0.7)%2;
    if(jt<1){
      var jx=120+Math.sin(time*0.35)*60, jy=H*0.7-Math.sin(jt*Math.PI)*46;
      ctx.save(); ctx.translate(jx,jy); ctx.rotate(jt*Math.PI-Math.PI/2);
      ctx.fillStyle=COL.aqua;
      ctx.beginPath(); ctx.moveTo(8,0); ctx.quadraticCurveTo(0,-5,-7,0); ctx.quadraticCurveTo(0,5,8,0); ctx.fill();
      ctx.restore();
    }
  }
  drawFx();
  // メッセージ＆マスコット
  if(t>2){
    var mk2=Math.min(1,(t-2)/1);
    var msz=110*mk2;
    drawImgN('mascot_joy', W/2-msz/2, 300-msz/2, msz, msz);
  }
  if(t>2.8){
    var a2=Math.min(1,(t-2.8)/1);
    ctx.globalAlpha=a2;
    txtO('国生みの島に、', W/2, 400, 22, COL.white, COL.navy, 'center', true);
    txtO('豊かな海がもどった', W/2, 432, 22, COL.gold, COL.navy, 'center', true);
    ctx.globalAlpha=1;
  }
  // スタッフロール
  if(t>4.5){
    var sy2=H-((t-4.5)*34);
    ctx.save();
    ctx.beginPath(); ctx.rect(0,470,W,H-470-70); ctx.clip();
    for(var c=0;c<CREDITS.length;c++){
      var ly=sy2+c*30;
      if(ly>460 && ly<H-60){
        var big=c<2||CREDITS[c]==='THANK YOU FOR PLAYING';
        txtO(CREDITS[c], W/2, ly, big?17:13, big?COL.gold:COL.white, COL.navy, 'center', big);
      }
    }
    ctx.restore();
  }
  var rollDone = t>4.5+ (CREDITS.length*30+H)/34/1.35;
  if(t>6){
    bigButton(W/2-90, H-58, 180, 44, rollDone?'マップへもどる':'スキップ', COL.aqua, function(){
      view={name:'map'};
      sfx.click();
      saveGame();
    });
  }
}

/* ---------------- チュートリアル ---------------- */
function drawTutorial(){
  var step=TUT[S.tut];
  ctx.fillStyle='rgba(7,18,28,0.72)';
  ctx.fillRect(0,0,W,H);
  if(S.tut===0 && IMGS.game_logo_kuni && IMGS.game_logo_kuni.complete && IMGS.game_logo_kuni.naturalWidth){
    var logoW=330, logoH=logoW*IMGS.game_logo_kuni.naturalHeight/IMGS.game_logo_kuni.naturalWidth;
    ctx.drawImage(IMGS.game_logo_kuni,(W-logoW)/2,38,logoW,logoH);
  }
  var bob=Math.sin(time*2.4)*6;
  drawImgN(step.img, W/2-70, 220+bob, 140, 140);
  var px=30, py=400, pw=W-60, ph=190;
  ctx.fillStyle=COL.white; rr(px,py,pw,ph,16); ctx.fill();
  ctx.strokeStyle=COL.aqua; ctx.lineWidth=3; rr(px,py,pw,ph,16); ctx.stroke();
  // 吹き出しのしっぽ
  ctx.fillStyle=COL.white;
  ctx.beginPath(); ctx.moveTo(W/2-12,py+2); ctx.lineTo(W/2,py-16); ctx.lineTo(W/2+12,py+2); ctx.fill();
  var lines=step.t.split('\n');
  for(var l=0;l<lines.length;l++)
    txt(lines[l], px+pw/2, py+34+l*26, 14, COL.navy, 'center', l===0);
  txt('タップですすむ（'+(S.tut+1)+'/3）', px+pw/2, py+ph-24, 11, '#8a9aa5', 'center');
  addHit(0,0,W,H,function(){
    S.tut++;
    sfx.click();
    if(S.tut>=3) saveGame();
  });
}
function drawTitleSplash(){
  if(titleSplashT<=0 || !IMGS.game_logo_kuni || !IMGS.game_logo_kuni.complete || !IMGS.game_logo_kuni.naturalWidth) return;
  var alpha=Math.min(1,(4.5-titleSplashT)/0.4,titleSplashT/0.7);
  var logoW=340, logoH=logoW*IMGS.game_logo_kuni.naturalHeight/IMGS.game_logo_kuni.naturalWidth;
  ctx.save(); ctx.globalAlpha=Math.max(0,alpha);
  ctx.fillStyle='rgba(7,18,28,0.78)'; rr(22,66,W-44,logoH+20,20); ctx.fill();
  ctx.strokeStyle='rgba(53,201,221,0.42)'; ctx.lineWidth=1.5; rr(22,66,W-44,logoH+20,20); ctx.stroke();
  ctx.drawImage(IMGS.game_logo_kuni,(W-logoW)/2,76,logoW,logoH);
  ctx.restore();
}

/* ---------------- 更新・描画ルート ---------------- */
function update(dt){
  time+=dt;
  if(titleSplashT>0) titleSplashT-=dt;
  updateFx(dt);
  // 収益
  S.money+=totalIncomeOf(S)*dt;
  // 製造ジョブ
  for(var i=0;i<S.zones.length;i++){
    var z=S.zones[i];
    if(z.job){
      z.job.remain-=dt;
      if(z.job.remain<=0){
        z.stock=z.job.pid; z.job=null;
        sfx.good();
        floater(FACT.x, FACT.y-46, '製造完了！', COL.green, 14);
        burst(FACT.x, FACT.y-20, 10, COL.sand, 100);
      }
    }
  }
  fishTimer+=dt;
  if(fishTimer>0.5){ fishTimer=0; manageFish(); }
  updateFish(dt);
  if(view.name==='sonar') updateSonar(dt);
  else if(view.name==='crane') updateCrane(dt);
  else if(view.name==='finale'){
    view.t+=dt;
    if(!view.fanfared && view.t>0.4){ view.fanfared=true; sfx.fanfare(); }
    if(Math.random()<dt*2) burst(40+Math.random()*340, 480+Math.random()*180, 2, COL.gold, 40, -30);
  }
  // フィナーレ判定
  if(view.name==='map' && !S.finale && allDone(S)){
    S.finale=true;
    saveGame();
    startFinale();
  }
  saveTimer+=dt;
  if(saveTimer>6){ saveTimer=0; saveGame(); }
}
function draw(){
  hits.length=0;
  ctx.save();
  if(shakeT>0){
    ctx.translate((Math.random()-0.5)*shakeMag*2, (Math.random()-0.5)*shakeMag*2);
  }
  if(view.name==='sonar'){ drawSonar(); }
  else if(view.name==='crane'){ drawCrane(); }
  else if(view.name==='finale'){ drawFinale(); drawTopBar(); }
  else{
    drawMapBase();
    drawFx();
    drawTopBar();
    drawBottomBar();
    if(modal){
      if(modal.type==='zone') drawZonePanel();
      else if(modal.type==='factory') drawFactoryModal();
      else if(modal.type==='mfg') drawMfgModal();
      else if(modal.type==='catalog') drawCatalogModal();
      else if(modal.type==='upgrade') drawUpgradeModal();
      else if(modal.type==='settings') drawSettingsModal();
      else if(modal.type==='resetConfirm') drawResetConfirm();
      else if(modal.type==='offline') drawOfflineModal();
    }
    if(S.tut<3) drawTutorial();
    else if(!modal) drawTitleSplash();
  }
  ctx.restore();
}
function frame(ms){
  requestAnimationFrame(frame);
  var now=ms/1000;
  var dt=now-lastT; lastT=now;
  if(dt>0.05) dt=0.05;
  if(dt<0) dt=0;
  if(document.hidden) return;
  update(dt);
  if(ctx) draw();
}

/* ---------------- 入力 ---------------- */
function toLogical(e){
  var rect=cv.getBoundingClientRect();
  var sc=rect.width/W || 1;
  return {x:(e.clientX-rect.left)/sc, y:(e.clientY-rect.top)/sc};
}
if(cv){
  cv.addEventListener('pointerdown', function(e){
    e.preventDefault();
    audio(); // 初回解錠
    var p=toLogical(e);
    tapRipple(p.x,p.y);
    for(var i=hits.length-1;i>=0;i--){
      var h=hits[i];
      if(p.x>=h.x && p.x<=h.x+h.w && p.y>=h.y && p.y<=h.y+h.h){
        h.fn(p.x,p.y);
        return;
      }
    }
  });
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    hiddenAt=Date.now();
    saveGame();
    if(ac){ try{ ac.suspend(); }catch(e){} }
  }else{
    if(ac){ try{ ac.resume(); }catch(e){} }
    var el=(Date.now()-hiddenAt)/1000;
    if(el>8){
      var g=Math.floor(totalIncomeOf(S)*Math.min(el,OFFLINE_CAP)*OFFLINE_RATE);
      if(g>0){
        S.money+=g;
        floater(W/2, 300, 'るす中の水揚げ +'+fmt(g), COL.aqua, 15);
        sfx.coin();
      }
    }
  }
});

/* ---------------- 引き継ぎコードUI ---------------- */
var elBox=document.getElementById('codebox');
var elText=document.getElementById('cb_text');
var elCopy=document.getElementById('cb_copy');
var elLoad=document.getElementById('cb_load');
var elClose=document.getElementById('cb_close');
var elMsg=document.getElementById('cb_msg');
var elTitle=document.getElementById('cb_title');
function showCodebox(mode){
  if(!elBox) return;
  elBox.style.display='block';
  if(elMsg) elMsg.textContent='';
  if(mode==='export'){
    saveGame();
    if(elTitle) elTitle.textContent='引き継ぎコード（コピーして保存）';
    if(elText){ elText.value=encodeSave(S); elText.readOnly=true; }
    if(elCopy) elCopy.style.display='inline-block';
    if(elLoad) elLoad.style.display='none';
  }else{
    if(elTitle) elTitle.textContent='コードをよみこむ（貼り付けてね）';
    if(elText){ elText.value=''; elText.readOnly=false; }
    if(elCopy) elCopy.style.display='none';
    if(elLoad) elLoad.style.display='inline-block';
  }
}
if(elCopy) elCopy.addEventListener('click', function(){
  try{
    elText.select();
    if(document.execCommand) document.execCommand('copy');
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(elText.value);
    if(elMsg){ elMsg.style.color='#3fae6a'; elMsg.textContent='コピーしました！'; }
  }catch(e){
    if(elMsg) elMsg.textContent='手動で選択してコピーしてね';
  }
});
if(elLoad) elLoad.addEventListener('click', function(){
  var sv=decodeSave(elText?elText.value:'');
  if(sv){
    S=mergeSave(sv);
    saveGame();
    fishes.length=0;
    modal=null; view={name:'map'};
    elBox.style.display='none';
    sfx.chime();
    floater(W/2, H/2, 'よみこみ成功！', COL.aqua, 17);
  }else{
    if(elMsg){ elMsg.style.color='#ff7f66'; elMsg.textContent='コードが正しくありません…'; }
    sfx.denied();
  }
});
if(elClose) elClose.addEventListener('click', function(){
  elBox.style.display='none';
});

/* ---------------- 起動 ---------------- */
resize();
window.addEventListener('resize', resize);
// オフライン精算レポート
(function(){
  var og=offlineGain(S, Date.now());
  if(og.sec>90 && og.gain>0 && S.tut>=3){
    modal={type:'offline', gain:og.gain, sec:og.sec};
  }
  S.last=Date.now();
})();
manageFish();
requestAnimationFrame(frame);

/* ---------------- テストフック ---------------- */
if(typeof window!=='undefined'){
  window.__test={
    checksum36:checksum36, encodeSave:encodeSave, decodeSave:decodeSave,
    defaultSave:defaultSave, mergeSave:mergeSave, offlineGain:offlineGain,
    constructEffect:constructEffect, perfectThr:perfectThr,
    stageOf:stageOf, zoneIncomeOf:zoneIncomeOf, totalIncomeOf:totalIncomeOf,
    applyConstruction:applyConstruction, allDone:allDone,
    saveGame:saveGame, loadGame:loadGame, upgradeCost:upgradeCost,
    ZONES:ZONES, PRODUCTS:PRODUCTS,
    getS:function(){ return S; },
    setS:function(v){ S=v; }
  };
}
