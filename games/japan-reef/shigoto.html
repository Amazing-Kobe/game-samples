  var dpr=Math.min(window.devicePixelRatio||1,2);
  VS=Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.style.width=(W*VS)+'px'; cv.style.height=(H*VS)+'px';
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',fit); fit();

function imOK(k){ var im=IMG[k]; return im && im.complete && im.naturalWidth>0; }
function drawIm(k,x,y,w,h){
  if(!imOK(k)) return false;
  var im=IMG[k];

/* ---------- サウンド（WebAudio合成／音声ファイル不使用） ---------- */
var AC=null, master=null, muted=false;
function ensureAudio(){
  if(AC) { if(AC.state==='suspended'){ try{AC.resume();}catch(e){} } return; }
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AC=new C(); master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination);
    bgmStart();
  }catch(e){}
}
function tone(f,dur,type,vol,slide){
  if(!AC||muted) return;
  try{
    var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function noiseBurst(dur,vol,freq){
  if(!AC||muted) return;
  try{
    var t=AC.currentTime, len=Math.floor(AC.sampleRate*dur);
    var buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var s=AC.createBufferSource(); s.buffer=buf;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||900;
    var g=AC.createGain(); g.gain.value=vol||0.2;
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }catch(e){}
}
var sfx={
  tap:function(){ tone(660,0.07,'triangle',0.12); },
  ping:function(){ tone(1200,0.35,'sine',0.14,400); },
  good:function(){ tone(700,0.09,'triangle',0.16); tone(1050,0.16,'triangle',0.14); },
  perfect:function(){ tone(780,0.08,'triangle',0.16); tone(1170,0.1,'triangle',0.15); tone(1560,0.22,'triangle',0.14); },
  miss:function(){ tone(220,0.22,'sawtooth',0.1,110); },
  splash:function(){ noiseBurst(0.3,0.22,700); },
  drop:function(){ tone(300,0.25,'sine',0.15,80); },
  fanfare:function(){
    var seq=[523,659,784,1047]; for(var i=0;i<seq.length;i++)(function(f,d){ setTimeout(function(){ tone(f,0.28,'triangle',0.17); },d); })(seq[i],i*130);
  },
  chime:function(){ tone(880,0.3,'sine',0.12); tone(1320,0.4,'sine',0.08); }
};
/* かんたんBGM（8ステップループ） */
var bgmTimer=null, bgmStep=0;
var BGM_BASS=[131,131,98,98,110,110,123,123];
var BGM_MEL=[523,0,659,784,0,659,587,0];
function bgmStart(){
  if(bgmTimer) return;
  bgmTimer=setInterval(function(){
    if(!AC||muted) return;
    var s=bgmStep%8;
    tone(BGM_BASS[s],0.32,'triangle',0.05);
    if(BGM_MEL[s]) tone(BGM_MEL[s],0.24,'sine',0.035);
    if(s%2===0) noiseBurst(0.03,0.015,4000);
    bgmStep++;
  },340);
}
var muteBtn=document.getElementById('muteBtn');
muteBtn.addEventListener('click',function(){
  muted=!muted; muteBtn.innerHTML=muted?'&#9834; OFF':'&#9834; ON';
  if(!muted) ensureAudio();
  persist();
});

/* ---------- セーブ ---------- */
var SKEY='reef_shigoto';
var save={plays:0, best:null, mute:false};
try{
  var s0=localStorage.getItem(SKEY);

  if(save.mute){ muted=true; muteBtn.innerHTML='&#9834; OFF'; }
}catch(e){}
function persist(){ save.mute=muted; try{ localStorage.setItem(SKEY,JSON.stringify(save)); }catch(e){} }

/* ---------- 描画ヘルパー ---------- */
function rr(x,y,w,h,r){
  if(r>w/2) r=w/2; if(r>h/2) r=h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function T(t,x,y,s,c,al,b){
  ctx.font=(b?'bold ':'')+s+'px '+FONT;
  ctx.fillStyle=c||COL.white;
  ctx.textAlign=al||'center';
  ctx.textBaseline='middle';
  ctx.fillText(t,x,y);
}
function wrap(t,maxW,s,b){
  ctx.font=(b?'bold ':'')+s+'px '+FONT;
  var out=[],line='';
  for(var i=0;i<t.length;i++){
    var ch=t[i];
    if(ch==='\n'){ out.push(line); line=''; continue; }
    if(ctx.measureText(line+ch).width>maxW){ out.push(line); line=ch; }
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function pText(t,x,y,maxW,s,c,lh,al,b){
  var ls=wrap(t,maxW,s,b);
  for(var i=0;i<ls.length;i++) T(ls[i],x,y+i*(lh||s*1.55),s,c,al||'left',b);
  return ls.length*(lh||s*1.55);
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }

/* ---------- ヒットテスト ---------- */
var HITS=[];
function addHit(x,y,w,h,fn){ HITS.push({x:x,y:y,w:w,h:h,fn:fn}); }
cv.addEventListener('pointerdown',function(e){
  e.preventDefault(); ensureAudio();
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)/VS, y=(e.clientY-r.top)/VS;
  for(var i=HITS.length-1;i>=0;i--){
    var h=HITS[i];
    if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){ h.fn(x,y); return; }
  }
},{passive:false});

/* ---------- ボタン描画 ---------- */
function drawBtn(x,y,w,h,label,fn,style){
  var press=0;
  ctx.save();
  if(style==='ghost'){
    rr(x,y,w,h,h/2); ctx.fillStyle='rgba(13,43,69,.7)'; ctx.fill();
    ctx.strokeStyle='rgba(53,201,221,.6)'; ctx.lineWidth=1.5; ctx.stroke();
    T(label,x+w/2,y+h/2+1,15,'#bfeef6','center',true);
  }else{
    var g=ctx.createLinearGradient(0,y,0,y+h);
    if(style==='green'){ g.addColorStop(0,'#7fd89a'); g.addColorStop(1,'#3fae6a'); }
    else { g.addColorStop(0,'#ffd27a'); g.addColorStop(1,'#f7a83a'); }
    ctx.fillStyle=(style==='green')?'#1d5c36':'#b06f14';
    rr(x,y+4,w,h,h/2); ctx.fill();
    rr(x,y,w,h,h/2); ctx.fillStyle=g; ctx.fill();
    T(label,x+w/2,y+h/2+1,17,(style==='green')?'#08290f':'#3a2400','center',true);
  }
  ctx.restore();
  addHit(x,y-4,w,h+10,fn);
}

/* ---------- 進行状態 ---------- */
var S={

];
function resetRun(){
  S.stats={obs:0,ana:0,pre:0,dec:0,team:0};
  S.qst={obs:0,ana:0,pre:0,dec:0,team:0};
  S.comp={ot:0,nr:0,mi:0};
  S.mg={sonar:0,factory:0,crane:0};
  S.result=null; S.flowIdx=-1;
}
function stageInfo(){ // done=完了したしごと数, cur=挑戦中のしごと(1-3, なければ0)
  var i=S.flowIdx, done=0, f=FLOW[i]||{};
  for(var k=0;k<i&&k<FLOW.length;k++) if(FLOW[k].t==='mg') done++;
  var cur=(f.t==='mg'||f.t==='brief')?done+1:0;
  return {done:done, cur:clamp(cur,0,3)};
}
function next(){
  S.flowIdx++;
  if(S.flowIdx>=FLOW.length){ S.scene='result'; return; }
  var f=FLOW[S.flowIdx];
  if(f.t==='dialog'){ startDialog(f.lines); }
  else if(f.t==='q'){ S.scene='q'; }
  else if(f.t==='brief'){ S.scene='brief'; }
  else if(f.t==='mg'){
    if(f.mg==='sonar') startSonar();
    else if(f.mg==='factory') startFactory();
    else startCrane();
  }
  else if(f.t==='calc'){ startCalc(); }
  else if(f.t==='result'){ computeResult(); S.scene='result'; sfx.fanfare(); }
}

/* ---------- 背景 ---------- */
var bubbles=[];
for(var bi=0;bi<24;bi++) bubbles.push({x:Math.random()*W, y:Math.random()*H, r:1.5+Math.random()*3.5, v:12+Math.random()*26, ph:Math.random()*6.28});
function drawSea(t,topY){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#12507a'); g.addColorStop(0.5,'#0d3a5e'); g.addColorStop(1,'#071829');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 光のすじ
  ctx.save(); ctx.globalAlpha=0.07; ctx.fillStyle='#bfeef6';
  for(var i=0;i<3;i++){
    var x0=70+i*130+Math.sin(t*0.4+i)*18;
    ctx.beginPath(); ctx.moveTo(x0,0); ctx.lineTo(x0+46,0); ctx.lineTo(x0-40,H*0.7); ctx.lineTo(x0-70,H*0.7); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // 泡
  ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#cfeef8';
  for(var j=0;j<bubbles.length;j++){
    var b=bubbles[j];
    var y=b.y - (t*b.v)%(H+40);
    if(y<-20) y+=H+40;
    var x=b.x+Math.sin(t*1.3+b.ph)*6;
    ctx.beginPath(); ctx.arc(x,y,b.r,0,6.28); ctx.fill();
  }
  ctx.restore();
}

}
function drawSteps(){

    ctx.save();
    rr(x-34,116,68,24,12);

/* =========================================================
   ミニゲーム1：ソナー調査（オリエンタルテクノ）
   ========================================================= */
var SN={};
function startSonar(){
  var cells=[];
  var CXN=5, CYN=6;
  for(var i=0;i<CXN*CYN;i++) cells.push({rev:false, fish:false, rt:0, heat:0});
  // 魚群4つをランダム配置（重複なし）
  var idxs=[];
  while(idxs.length<4){
    var r=Math.floor(Math.random()*CXN*CYN);
    if(idxs.indexOf(r)<0) idxs.push(r);
  }
  for(var k=0;k<idxs.length;k++) cells[idxs[k]].fish=true;
  SN={cells:cells, cxn:CXN, cyn:CYN, pings:10, found:0, done:false, doneT:0, fx:[]};
  S.scene='sonar';
}
function sonarCellPos(i){
  var gx=30, gy=180, cw=(W-60)/SN.cxn, ch=68;
  var cx=i%SN.cxn, cy=Math.floor(i/SN.cxn);
  return {x:gx+cx*cw, y:gy+cy*ch, w:cw, h:ch};
}
function sonarHeat(i){
  // 未発見の魚群までのチェビシェフ距離
  var cx=i%SN.cxn, cy=Math.floor(i/SN.cxn), best=99;
  for(var j=0;j<SN.cells.length;j++){
    var c=SN.cells[j];
    if(c.fish&&!c.rev){
      var d=Math.max(Math.abs(cx-j%SN.cxn),Math.abs(cy-Math.floor(j/SN.cxn)));
      if(d<best) best=d;
    }
  }
  return best;
}
function sonarEnd(){
  if(SN.done) return;
  SN.done=true; SN.doneT=0;
  var sc=(SN.found*20+SN.pings*5)/11; // 最大(80+30)/11=10
  S.mg.sonar=clamp(sc,0,10);
  S.comp.ot+=S.mg.sonar;
  S.stats.obs+=SN.found*1.3;
  S.stats.ana+=SN.pings*0.55;
  if(SN.found>=4) sfx.fanfare(); else sfx.chime();
}
function drawSonar(t,dt){
  drawSea(t);
  drawHeader('ソナー調査｜オリエンタルテクノ','タップした場所にピンを打つ');
  drawSteps();
  // グリッド
  for(var i=0;i<SN.cells.length;i++){
    var p=sonarCellPos(i), c=SN.cells[i];
    ctx.save();
    rr(p.x+3,p.y+3,p.w-6,p.h-6,10);
    if(!c.rev){
      ctx.fillStyle='rgba(22,69,107,.85)'; ctx.fill();
      ctx.strokeStyle='rgba(53,201,221,.25)'; ctx.stroke();
      T('？',p.x+p.w/2,p.y+p.h/2,16,'rgba(159,195,216,.5)','center',true);
    }else{
      c.rt+=dt;
      if(c.fish){
        ctx.fillStyle='rgba(63,174,106,.4)'; ctx.fill();
        ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.stroke();
        // 魚アイコン
        var fx=p.x+p.w/2, fy=p.y+p.h/2+Math.sin(t*3+i)*2;
        ctx.fillStyle=COL.sand;
        ctx.beginPath(); ctx.ellipse(fx-2,fy,11,6.5,0,0,6.28); ctx.fill();
        ctx.beginPath(); ctx.moveTo(fx+8,fy); ctx.lineTo(fx+15,fy-6); ctx.lineTo(fx+15,fy+6); ctx.closePath(); ctx.fill();
        ctx.fillStyle=COL.ink; ctx.beginPath(); ctx.arc(fx-7,fy-1.5,1.5,0,6.28); ctx.fill();
        T('発見!',p.x+p.w/2,p.y+p.h-11,10,COL.green,'center',true);
      }else{
        var hcol, htxt;
        if(c.heat<=1){ hcol=COL.coral; htxt='ちかい!'; }
        else if(c.heat===2){ hcol=COL.gold; htxt='まあまあ'; }
        else { hcol='#5b87a6'; htxt='とおい…'; }
        ctx.fillStyle='rgba(13,43,69,.75)'; ctx.fill();
        ctx.strokeStyle=hcol; ctx.lineWidth=2; ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x+p.w/2,p.y+p.h/2-6,5,0,6.28); ctx.fillStyle=hcol; ctx.fill();
        T(htxt,p.x+p.w/2,p.y+p.h-16,10.5,hcol,'center',true);
      }
      // 波紋
      if(c.rt<0.6){
        ctx.strokeStyle='rgba(53,201,221,'+(1-c.rt/0.6)+')'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(p.x+p.w/2,p.y+p.h/2,c.rt*60,0,6.28); ctx.stroke();
      }
    }
    ctx.restore();
  }
  // グリッド全体でひとつのヒット領域（タップ位置からセルを算出）
  if(!SN.done&&!SN.lock){
    addHit(30,180,W-60,SN.cyn*68,function(x,y){
      var cw=(W-60)/SN.cxn;
      var gx2=Math.floor((x-30)/cw), gy2=Math.floor((y-180)/68);
      if(gx2<0||gx2>=SN.cxn||gy2<0||gy2>=SN.cyn) return;
      var idx=gy2*SN.cxn+gx2, cc=SN.cells[idx];
      if(cc.rev||SN.done||SN.lock) return;
      SN.pings--;
      cc.rev=true; cc.rt=0;
      if(cc.fish){ SN.found++; sfx.good(); sfx.splash(); }
      else { cc.heat=sonarHeat(idx); sfx.ping(); }
      if(SN.found>=4||SN.pings<=0){ SN.lock=true; setTimeout(sonarEnd,650); }
    });
  }
  // 色ヒントの凡例
  (function(){
    var items=[[COL.coral,'ちかい'],[COL.gold,'まあまあ'],['#5b87a6','とおい']];
    var lx=W/2-118;
    T('反応の色：',lx-10,163,11,'#9fc3d8','right');
    for(var li=0;li<3;li++){
      ctx.beginPath(); ctx.arc(lx+li*82,163,5,0,6.28); ctx.fillStyle=items[li][0]; ctx.fill();
      T(items[li][1],lx+li*82+10,163,11,items[li][0],'left',true);
    }
  })();
  // HUD
  var hy=606;
  rr(24,hy,W-48,54,14); ctx.fillStyle='rgba(13,43,69,.85)'; ctx.fill();
  T('のこりピン',86,hy+18,11,'#9fc3d8','center');
  for(var pi=0;pi<10;pi++){
    ctx.beginPath(); ctx.arc(38+pi*11,hy+36,4,0,6.28);
    ctx.fillStyle=pi<SN.pings?COL.aqua:'rgba(255,255,255,.15)'; ctx.fill();
  }
  T('見つけた魚群',W-120,hy+18,11,'#9fc3d8','center');
  T(SN.found+'／4',W-120,hy+38,17,COL.sand,'center',true);
  T('ヒント：はずれの色は「魚群までの近さ」だよ',W/2,684,11.5,'#9fc3d8','center');

  if(SN.done){
    SN.doneT+=dt;
    if(SN.doneT>0.4) drawMgResult('調査完了！', SN.found+'つの魚群を発見（のこりピン '+SN.pings+'）', S.mg.sonar,
      SN.found>=4?'完ぺきな調査！オリテク号のエースになれるかも。':(SN.found>=2?'いい観察眼！データの読みがさえてるね。':'海は広い！次のしごとで挽回だ！'));
  }
}

  ctx.strokeRect(W/2-44,my+128,88,62);
  if(FC.phase==='judge'||FC.phase==='next'){
    ctx.fillStyle='#cbb886'; ctx.fillRect(W/2-41,my+134,82,53);
    // 穴（カルセラ風）
    ctx.fillStyle='rgba(13,43,69,.4)';
    for(var hx=0;hx<4;hx++)for(var hy=0;hy<3;hy++){
      ctx.beginPath(); ctx.arc(W/2-28+hx*19,my+144+hy*17,3.5,0,6.28); ctx.fill();
    }
  }
  // 判定表示
  if(FC.phase==='judge'){
    FC.t+=dt;
    var res=FC.results[FC.results.length-1];
    var col=res.r==='perfect'?COL.gold:(res.r==='good'?COL.green:(res.r==='ok'?COL.aqua:COL.coral));
    T(res.label,W/2,my+100,26,col,'center',true);
    if(FC.t>0.9){
      FC.t=0; FC.round++;
      if(FC.round>=5) factoryEnd();
      else { FC.phase='aim'; FC.speed=1.6+FC.round*0.45; FC.needle=Math.random()*6.28; }
    }
  }
  // ゲージ
  var gy=530, gx=40, gw=W-80;
  rr(gx,gy,gw,34,17); ctx.fillStyle='rgba(13,43,69,.9)'; ctx.fill();
  // ゾーン
  var cx=gx+gw/2;
  ctx.save();
  rr(gx,gy,gw,34,17); ctx.clip();
  ctx.fillStyle='rgba(53,201,221,.25)'; ctx.fillRect(cx-58,gy,116,34);
  ctx.fillStyle='rgba(63,174,106,.45)'; ctx.fillRect(cx-30,gy,60,34);
  ctx.fillStyle='rgba(240,192,74,.75)'; ctx.fillRect(cx-11,gy,22,34);
  ctx.restore();
  rr(gx,gy,gw,34,17); ctx.strokeStyle='rgba(53,201,221,.5)'; ctx.stroke();
  // 針
  if(FC.phase==='aim'&&!FC.done){
    FC.needle+=dt*FC.speed;
    var np=cx+Math.sin(FC.needle)*(gw/2-14);
    ctx.fillStyle=COL.white;
    ctx.beginPath(); ctx.moveTo(np,gy-10); ctx.lineTo(np-7,gy-22); ctx.lineTo(np+7,gy-22); ctx.closePath(); ctx.fill();
    ctx.fillRect(np-2,gy-8,4,50);
  }
  T('まんなかの金色ゾーンで「注入」！',W/2,596,12,'#9fc3d8','center');
  // スコア
  rr(24,620,W-48,44,12); ctx.fillStyle='rgba(13,43,69,.85)'; ctx.fill();
  T('品質スコア',90,642,12,'#9fc3d8','center');
  T(FC.score+' 点',W-100,642,17,COL.sand,'center',true);

  if(FC.phase==='aim'&&!FC.done){
    drawBtn(W/2-90,668,180,46,'注入！',function(){
      var pos=Math.abs(Math.sin(FC.needle))*(gw/2-14); // 中央からの距離px
      var r,label,pts;
      if(pos<=11){ r='perfect'; label='極上！ +20'; pts=20; FC.perfect++; sfx.perfect(); }
      else if(pos<=30){ r='good'; label='良品！ +12'; pts=12; FC.good++; sfx.good(); }
      else if(pos<=58){ r='ok'; label='合格 +6'; pts=6; sfx.tap(); }
      else { r='miss'; label='やりなおし…'; pts=0; sfx.miss(); }
      FC.score+=pts;
      FC.results.push({r:r,label:label});
      FC.phase='pour'; FC.pour=0; FC.t=0;
      sfx.splash();
    });
  }
  if(FC.done){
    FC.doneT+=dt;
    if(FC.doneT>0.4) drawMgResult('製造完了！','極上 '+FC.perfect+'個／良品 '+FC.good+'個（'+FC.score+'点）',S.mg.factory,
      FC.perfect>=4?'神ワザ級の正確さ！マイスターの素質十分！':(FC.score>=50?'安定した腕前！ものづくりに向いてるよ。':'魚たちのおうちづくりはむずかしい！でも経験がいちばんの先生だよ。'));
  }
}

   ミニゲーム3：クレーン施工（マルイチ）

var CR={};
function startCrane(){
  CR={round:0, phase:'swing', t:0, ang:0, sw:1.7,
      bx:0,by:0,vx:0,vy:0, cur:0, target:{x:0,w:120},
      score:0, results:[], fish:[], done:false, doneT:0, msg:'', msgT:0};
  craneSetup();
  S.scene='crane';
}
function craneSetup(){
  var conf=[
    {w:130, cur:0},
    {w:100, cur:0.55*(Math.random()<0.5?1:-1)},
    {w:72, cur:0.85*(Math.random()<0.5?1:-1)}
  ][CR.round];
  CR.target={x:90+Math.random()*(W-180), w:conf.w};
  CR.cur=conf.cur;
  CR.phase='swing'; CR.ang=Math.random()*6.28; CR.t=0;
}
function craneEnd(){
  if(CR.done) return;
  CR.done=true; CR.doneT=0; CR.phase='end';
  S.mg.crane=clamp(CR.score/10,0,10);
  S.comp.mi+=S.mg.crane;
  S.stats.dec+=S.mg.crane*0.9;
  S.stats.team+=2;
  if(CR.score>=90) sfx.fanfare(); else sfx.chime();
}
function drawCrane(t,dt){
  drawSea(t);
  drawHeader('クレーン施工｜マルイチ','タップでブロックを切りはなす');
  drawSteps();
  var seaY=200, botY=600;
  // 海面
  ctx.strokeStyle='rgba(191,238,246,.5)'; ctx.lineWidth=2;
  ctx.beginPath();
  for(var x=0;x<=W;x+=8) ctx.lineTo(x,seaY+Math.sin(t*2+x*0.05)*3);
  ctx.stroke();
  // 台船
  ctx.fillStyle='#c9553d';
  ctx.beginPath(); ctx.moveTo(W/2-95,seaY-8); ctx.lineTo(W/2+95,seaY-8); ctx.lineTo(W/2+78,seaY+14); ctx.lineTo(W/2-78,seaY+14); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e8e2d4'; rr(W/2-70,seaY-34,60,26,4); ctx.fill();
  // クレーンアーム
  var pivX=W/2+30, pivY=seaY-50; // ステップ表示(〜y140)と重ならない高さ
  ctx.strokeStyle='#e8d5a0'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(W/2+8,seaY-8); ctx.lineTo(pivX,pivY); ctx.stroke();
  ctx.strokeStyle='#b09b6a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(W/2+40,seaY-8); ctx.lineTo(pivX,pivY); ctx.stroke();
  // 海底
  ctx.fillStyle='#153450'; ctx.beginPath();
  ctx.moveTo(0,botY+22);
  for(var bx2=0;bx2<=W;bx2+=20) ctx.lineTo(bx2,botY+22+Math.sin(bx2*0.08)*5);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  // まと
  var tw=CR.target.w, tx=CR.target.x;
  ctx.fillStyle='rgba(240,192,74,.25)'; ctx.fillRect(tx-tw/2,botY-6,tw,30);
  ctx.strokeStyle=COL.gold; ctx.lineWidth=2; ctx.setLineDash([6,5]);
  ctx.strokeRect(tx-tw/2,botY-6,tw,30); ctx.setLineDash([]);
  T('▼ ここに沈めよう',tx,botY-22,11.5,COL.gold,'center',true);
  // 潮流表示
  if(Math.abs(CR.cur)>0.01){
    var dir=CR.cur>0?1:-1;
    rr(W/2-88,236,176,30,15); ctx.fillStyle='rgba(13,43,69,.8)'; ctx.fill();
    var ar=(t*40%36);
    ctx.fillStyle=COL.aqua;
    for(var a2=0;a2<3;a2++){
      var ax=W/2-40+a2*36+ar*dir;
      if(ax>W/2-62&&ax<W/2+62){
        ctx.beginPath();
        ctx.moveTo(ax+8*dir,251); ctx.lineTo(ax-4*dir,244); ctx.lineTo(ax-4*dir,258); ctx.closePath(); ctx.fill();
      }
    }
    T('潮流 '+(Math.abs(CR.cur)>0.7?'強':'中'),W/2,283,11.5,COL.aqua,'center',true);
  }else{
    rr(W/2-70,236,140,30,15); ctx.fillStyle='rgba(13,43,69,.8)'; ctx.fill();
    T('潮流 なし（べた凪）',W/2,251,11.5,'#9fc3d8','center',true);
  }
  // ブロック
  var blockW=46;
  function drawBlock(x,y){
    ctx.fillStyle='#cbb886';
    rr(x-blockW/2,y-blockW/2,blockW,blockW,6); ctx.fill();
    ctx.fillStyle='rgba(13,43,69,.4)';
    for(var hx=0;hx<2;hx++)for(var hy=0;hy<2;hy++){
      ctx.beginPath(); ctx.arc(x-10+hx*20,y-9+hy*19,4.5,0,6.28); ctx.fill();
    }
  }
  if(CR.phase==='swing'){
    CR.ang+=dt*CR.sw;
    var swx=pivX+Math.sin(CR.ang)*95, swy=pivY+58+Math.abs(Math.cos(CR.ang))*8;
    ctx.strokeStyle='#cfe3ef'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(pivX,pivY); ctx.lineTo(swx,swy-blockW/2); ctx.stroke();
    drawBlock(swx,swy);
    addHit(0,150,W,H-150,function(){
      if(CR.phase!=='swing') return;
      CR.phase='fall';
      CR.bx=swx; CR.by=swy;
      CR.vx=Math.cos(CR.ang)*CR.sw*52; CR.vy=0;
      sfx.drop();
    });
  }else if(CR.phase==='fall'){
    CR.vy+=dt*260;
    if(CR.by>seaY){ CR.vy=Math.min(CR.vy,120); CR.vx*=0.985; CR.bx+=CR.cur*dt*118; }
    CR.bx+=CR.vx*dt; CR.by+=CR.vy*dt;
    if(CR.by>seaY-6&&CR.by<seaY+16) { /* 着水しぶき */ }
    drawBlock(CR.bx,CR.by);
    if(CR.by>=botY+6){
      CR.phase='land'; CR.t=0;
      var dx=Math.abs(CR.bx-CR.target.x), half=CR.target.w/2;
      var res;
      if(dx<=half*0.3){ res={pts:34,label:'ドンピシャ！ +34'}; sfx.perfect(); }
      else if(dx<=half){ res={pts:22,label:'いいぞ！ +22'}; sfx.good(); }
      else if(dx<=half+40){ res={pts:10,label:'おしい！ +10'}; sfx.tap(); }
      else { res={pts:0,label:'流された〜！'}; sfx.miss(); }
      sfx.splash();
      CR.score+=res.pts; CR.results.push(res); CR.msg=res.label; CR.msgT=0;
      // 魚が寄ってくる演出
      if(res.pts>0){
        for(var fi2=0;fi2<res.pts/4;fi2++)
          CR.fish.push({x:CR.bx+(Math.random()*160-80), y:botY-10-Math.random()*60, tx:CR.bx+(Math.random()*70-35), ty:botY-14-Math.random()*36, ph:Math.random()*6.28});
      }
    }
  }else if(CR.phase==='land'){
    CR.t+=dt;
    drawBlock(CR.bx,botY+6);
    if(CR.t>1.3){
      CR.round++;
      if(CR.round>=3) craneEnd();
      else craneSetup();
    }
  }
  // 魚群
  for(var fi=0;fi<CR.fish.length;fi++){
    var f=CR.fish[fi];
    f.x=lerp(f.x,f.tx,dt*2); f.y=lerp(f.y,f.ty,dt*2);
    var fx2=f.x+Math.sin(t*3+f.ph)*4, fy2=f.y+Math.cos(t*2.5+f.ph)*3;
    ctx.fillStyle='rgba(232,213,160,.9)';
    ctx.beginPath(); ctx.ellipse(fx2,fy2,7,4,0,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.moveTo(fx2+5,fy2); ctx.lineTo(fx2+10,fy2-4); ctx.lineTo(fx2+10,fy2+4); ctx.closePath(); ctx.fill();
  }
  // メッセージ
  if(CR.msg&&CR.phase==='land'){
    T(CR.msg,W/2,340,24,COL.gold,'center',true);
  }
  // HUD
  rr(24,634,W-48,44,12); ctx.fillStyle='rgba(13,43,69,.85)'; ctx.fill();
  T('沈設 '+Math.min(CR.round+1,3)+'／3',90,656,13,'#9fc3d8','center');
  T(CR.score+' 点',W-100,656,17,COL.sand,'center',true);
  T('潮に流されるぶんを予測しよう！',W/2,700,11.5,'#9fc3d8','center');

  if(CR.done){
    CR.doneT+=dt;
    if(CR.doneT>0.4) drawMgResult('施工完了！','3回の沈設で '+CR.score+'点',S.mg.crane,
      CR.score>=90?'潮を完全に読みきった！現場の主役になれる腕前！':(CR.score>=50?'なかなかの操縦センス！現場で頼られるタイプだね！':'海の現場は手ごわい！この悔しさが成長のもと！'));
  }
}

  drawSea(t);
  CALC.t+=dt;

}

/* ---------- 診断結果 ---------- */
var confetti=[];
function computeResult(){
  // 表示用ステータス(1〜10)
  var st=S.stats;
  var disp={
    obs:clamp(2+st.obs,1.5,10), ana:clamp(2+st.ana,1.5,10),
    pre:clamp(2+st.pre,1.5,10), dec:clamp(2+st.dec,1.5,10),
    team:clamp(3+st.team,1.5,10)
  };
  // タイプ決定（会社=質問＋体験成績、サブタイプ=質問回答のみで決める。
  //   体験が下手だった人に特定タイプを押し付けないための設計）
  var c=S.comp, top='ot';
  if(c.nr>c.ot) top='nr';
  if(c.mi>c[top]) top='mi';
  var q=S.qst, key;
  if(top==='ot'){
    if(q.ana!==q.obs) key=(q.ana>q.obs)?'data':'field';
    else key=(disp.ana>=disp.obs)?'data':'field';
  }else if(top==='nr'){
    if(q.pre!==q.team) key=(q.pre>q.team)?'meister':'creator';
    else key=(disp.pre>=disp.team)?'meister':'creator';
  }else{
    if(q.team!==q.dec) key=(q.team>q.dec)?'commander':'operator';
    else key=(disp.team>=disp.dec)?'commander':'operator';
  }
  // ランク
  var total=S.mg.sonar+S.mg.factory+S.mg.crane;
  var rank= total>=24?'S': total>=18?'A': total>=11?'B':'C';
  var rankMsg={S:'海のエリート新人!!',A:'即戦力ルーキー！',B:'期待の新人！',C:'のびしろ∞！'}[rank];
  S.result={key:key, type:TYPES[key], disp:disp, rank:rank, rankMsg:rankMsg, total:total};
  resultT=0;
  save.plays=(save.plays||0)+1;
  save.best={type:TYPES[key].name, rank:rank, total:Math.round(total*10)/10};
  if(!save.types) save.types=[];
  if(save.types.indexOf(key)<0) save.types.push(key);
  persist();
  confetti=[];
  for(var i=0;i<60;i++) confetti.push({x:Math.random()*W,y:-20-Math.random()*400,v:60+Math.random()*90,ph:Math.random()*6.28,c:[COL.aqua,COL.gold,COL.coral,COL.green,COL.sand][i%5]});
}
function drawRadar(cx,cy,R,disp,t){
  var axes=[
    {k:'obs',l:'観察力'},{k:'ana',l:'分析力'},{k:'pre',l:'正確さ'},
    {k:'dec',l:'決断力'},{k:'team',l:'チーム力'}
  ];
  var n=axes.length;
  ctx.save();
  // グリッド
  ctx.strokeStyle='rgba(159,195,216,.35)'; ctx.lineWidth=1;
  for(var g=1;g<=3;g++){
    ctx.beginPath();
    for(var i=0;i<=n;i++){
      var a=-Math.PI/2+i*6.283/n, r=R*g/3;
      var x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  for(var i2=0;i2<n;i2++){
    var a2=-Math.PI/2+i2*6.283/n;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a2)*R,cy+Math.sin(a2)*R); ctx.stroke();
  }
  // 値（じわっと伸びる）
  var grow=clamp(t*0.8,0,1);
  ctx.beginPath();
  for(var i3=0;i3<=n;i3++){
    var ax=axes[i3%n], a3=-Math.PI/2+(i3%n)*6.283/n;
    var val=disp[ax.k]/10*grow;
    var x3=cx+Math.cos(a3)*R*val, y3=cy+Math.sin(a3)*R*val;
    if(i3===0) ctx.moveTo(x3,y3); else ctx.lineTo(x3,y3);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(53,201,221,.35)'; ctx.fill();
  ctx.strokeStyle=COL.aqua; ctx.lineWidth=2; ctx.stroke();
  // ラベル
  for(var i4=0;i4<n;i4++){
    var a4=-Math.PI/2+i4*6.283/n;
    var lx=cx+Math.cos(a4)*(R+18), ly=cy+Math.sin(a4)*(R+15);
    if(lx>cx) lx=Math.min(lx,cx+R+4); // 右側ラベルが隣の枠に触れないよう抑制
    T(axes[i4].l,lx,ly,10.5,COL.sand,'center',true);
  }
  ctx.restore();
}
var resultT=0;

  }
  T('きみは…',W/2,py+118,12,'#9fc3d8','center');
  T('「'+TY.name+'」タイプ！',W/2,py+143,21,COL.sand,'center',true);
  T(TY.catch,W/2,py+170,13,TY.color,'center',true);
  // ランク
  rr(W/2-104,py+188,208,30,15); ctx.fillStyle='rgba(240,192,74,.16)'; ctx.fill();
  ctx.strokeStyle='rgba(240,192,74,.6)'; ctx.stroke();
  T('体験ランク '+R.rank+'｜'+R.rankMsg,W/2,py+203,13,COL.gold,'center',true);

  // レーダー
  drawRadar(110,392,64,R.disp,resultT);
  // 向いてるしごと
  var jx=210,jy=310,jw=W-230;
  rr(jx,jy,jw,164,14); ctx.fillStyle='rgba(13,43,69,.88)'; ctx.fill();
  ctx.strokeStyle='rgba(53,201,221,.4)'; ctx.stroke();
  T('向いているしごと',jx+jw/2,jy+20,12,COL.aqua,'center',true);
  pText(TY.job,jx+14,jy+44,jw-28,13.5,COL.sand,20,'left',true);
  T('▼ グループでの活躍先',jx+jw/2,jy+92,11,'#9fc3d8','center');
  T(TY.comp,jx+jw/2,jy+114,15,COL.white,'center',true);
  T('で待ってるよ！',jx+jw/2,jy+138,11.5,'#9fc3d8','center');

  // 解説
  rr(20,486,W-40,96,14); ctx.fillStyle='rgba(13,43,69,.88)'; ctx.fill();
  pText(TY.desc,36,512,W-72,13,'#e6f2f8',21);

  // ボタン
  drawBtn(28,600,175,48,'もう一度診断',function(){
    sfx.tap(); resultT=0; resetRun(); S.scene='title';
  },'ghost');
  drawBtn(217,600,175,48,'結果をコピー',function(){ copyResult(); });
  drawBtn(W/2-140,660,280,44,'日本リーフグループを見てみる',function(){
    try{ window.open('https://www.japanreef.net/','_blank'); }catch(e){}
  },'green');
  T('(c) 日本リーフグループ（日本リーフ・マルイチ・オリエンタルテクノ）',W/2,722,10,'#7fa5bd','center');
}
function copyResult(){
  var R=S.result; if(!R) return;
  var txt='【ウミショク！診断結果】\nわたしは「'+R.type.name+'」タイプ（ランク'+R.rank+'）でした！\n向いてるしごと：'+R.type.job+'（'+R.type.comp+'）\n#ウミショク #日本リーフグループ\nhttps://www.japanreef.net/';
  var done=function(){ toast('結果をコピーしたよ！'); sfx.chime(); };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){ legacyCopy(txt); done(); });
    }else{ legacyCopy(txt); done(); }
  }catch(e){ legacyCopy(txt); done(); }
}
function legacyCopy(txt){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
}
var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity='1';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.style.opacity='0'; },1800);
}

/* ---------- メインループ ---------- */
var lastT=performance.now();
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05); lastT=now;
  var t=now/1000;
  HITS.length=0;
  ctx.clearRect(0,0,W,H);
  try{
    switch(S.scene){
      case 'title': drawTitle(t); break;
      case 'dialog': drawDialog(t); break;
      case 'q': drawQ(t); break;
      case 'brief': drawBrief(t); break;
      case 'sonar': drawSonar(t,dt); break;
      case 'factory': drawFactory(t,dt); break;
      case 'crane': drawCrane(t,dt); break;
      case 'calc': drawCalc(t,dt); break;
      case 'result': drawResult(t,dt); break;
    }
  }catch(e){ if(window.console&&console.error) console.error('draw error @'+S.scene,e); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
