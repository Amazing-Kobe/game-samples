/* ---------- セーブ ---------- */
function defaultSave(){
  var slots = [];
  for (var i=0;i<8;i++) slots.push({ it:null, wear:0, stays:0, egg:0, patch:0 });
  return {
    v:1, pearls:30, totalG:0, totalP:0, hatched:0, cycles:0,
    mute:false, tut:0, unlocked:4, boostUntil:0,
    slots:slots, dex:{}, sdex:{}, last:Date.now()
  };
}
var save = defaultSave();

function checksum(str){
  var s = 0;
  for (var i=0;i<str.length;i++) s = (s + str.charCodeAt(i)) % 9973;
  return s.toString(36);
}
function makeCode(sv){
  var json = JSON.stringify(sv);
  var b64 = btoa(unescape(encodeURIComponent(json)));
  return 'REEF1.' + b64 + '.' + checksum(json);
}
function parseCode(code){
  try {
    var parts = String(code).replace(/\s+/g,'').split('.');
    if (parts.length !== 3 || parts[0] !== 'REEF1') return null;
    var json = decodeURIComponent(escape(atob(parts[1])));
    if (checksum(json) !== parts[2]) return null;
    var obj = JSON.parse(json);
    if (!obj || typeof obj !== 'object' || obj.v !== 1 || !obj.slots) return null;
    return obj;
  } catch(e){ return null; }
}
function normalizeSave(sv){
  var d = defaultSave();
  for (var k in d) if (!(k in sv)) sv[k] = d[k];
  if (!sv.slots || sv.slots.length !== 8) sv.slots = d.slots;
  for (var i=0;i<8;i++){
    var s = sv.slots[i];
    if (!s) sv.slots[i] = { it:null, wear:0, stays:0, egg:0, patch:0 };
    else {
      if (s.it && !ITEMS[s.it]) s.it = null;
      s.wear = s.wear|0; s.stays = s.stays|0; s.egg = s.egg?1:0; s.patch = s.patch?1:0;
    }
  }
  sv.unlocked = Math.max(4, Math.min(8, sv.unlocked|0));
  sv.pearls = Math.max(0, sv.pearls|0);
  return sv;
}
function persist(){

function loadSaveFromStorage(){

var ac = null, master = null;
function initAudio(){

/* ---------- BGM（WebAudio自動演奏・夕暮れローファイ 76BPM） ---------- */
var BGM={on:false, step:0, next:0, timer:null, bus:null};
var BGM_SPB=60/76/2, BGM_LOOP=32;
var BGM_CH=[[50,57,60,65],[43,55,59,65],[48,55,59,64],[45,57,60,64]]; /* Dm7 G7 Cmaj7 Am7 */
var BGM_MEL=[74,72,77,76];
function bnF(n){ return 440*Math.pow(2,(n-69)/12); }
function bgmBus(){ if(!BGM.bus){ BGM.bus=ac.createGain(); BGM.bus.gain.value=0.9; BGM.bus.connect(master); } return BGM.bus; }
function bgmNote(t,midi,dur,type,vol,lp,mul){
  var o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(bnF(midi)*(mul||1),t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);
  if(lp){ var fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp; g.connect(fl); fl.connect(bgmBus()); }
  else g.connect(bgmBus());
  o.start(t); o.stop(t+dur+0.05);
}
function bgmHat(t,vol){
  var n=Math.floor(ac.sampleRate*0.04), buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource(); s.buffer=buf;
  var f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=4500;
  var g=ac.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(bgmBus()); s.start(t);
}
function bgmStep(st,t){
  if(save.mute) return;
  var bar=Math.floor(st/8)%4, ch=BGM_CH[bar], ib=st%8, i;
  if(ib===0){
    for(i=0;i<4;i++){
      bgmNote(t+i*0.035, ch[i], 1.7, 'triangle', 0.042, 1500);
      bgmNote(t+i*0.035, ch[i], 1.7, 'sine', 0.028, 1200, 1.004);
    }
    bgmNote(t, ch[0]-12, 0.8, 'sine', 0.07);
  }
  if(ib===5) bgmNote(t, ch[0]-12, 0.5, 'sine', 0.055);
  if(ib===2||ib===6) bgmHat(t, 0.01);
  if(ib===4 && bar%2===1) bgmNote(t, BGM_MEL[bar], 0.7, 'sine', 0.038, 2000);
}
function bgmTick(){
  if(!ac||!BGM.on) return;
  var ahead=ac.currentTime+0.2;
  while(BGM.next<ahead){ try{ bgmStep(BGM.step,BGM.next); }catch(e){} BGM.step=(BGM.step+1)%BGM_LOOP; BGM.next+=BGM_SPB; }
}
function bgmStart(){
  if(!ac||BGM.on) return;
  BGM.on=true; BGM.step=0; BGM.next=ac.currentTime+0.15;
  BGM.timer=setInterval(bgmTick,50);
}
function tone(type, f0, f1, t0, dur, vol){
  if (!ac || save.mute) return;
  var o = ac.createOscillator(), g = ac.createGain();
  var now = ac.currentTime + (t0||0);
  o.type = type;
  o.frequency.setValueAtTime(f0, now);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, now + dur);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  o.connect(g); g.connect(master);
  o.start(now); o.stop(now + dur + 0.02);
}
function noiseBurst(t0, dur, vol, freq){
  if (!ac || save.mute) return;
  var len = Math.floor(ac.sampleRate * dur);
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var d = buf.getChannelData(0);
  for (var i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  var src = ac.createBufferSource(); src.buffer = buf;
  var f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 900; f.Q.value = 1.2;
  var g = ac.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(master);
  var now = ac.currentTime + (t0||0);
  src.start(now);
}

    var r = RESIDENTS[i];
    if (r.id === 'akachan') continue;              // 産卵イベント限定
    if (r.likes.indexOf(itemType) < 0) continue;
    var w = (r.star === 1) ? 10 : (r.star === 2) ? 4 : 1;
    if (r.id === 'baa') w = 0.8;                   // ぬしは特にレア
    pool.push({ r:r, w:w }); wsum += w;
  }
  if (!pool.length) return null;
  var roll = rnd() * wsum;
  for (var j=0;j<pool.length;j++){
    roll -= pool[j].w;
    if (roll <= 0) return pool[j].r;
  }
  return pool[pool.length-1].r;
}
function greetReward(star){ return star === 1 ? 2 : star === 2 ? 5 : 12; }

function registerDex(rid){
  var first = !save.dex[rid];
  save.dex[rid] = (save.dex[rid] || 0) + 1;
  return first;
}
function registerSdex(sid){
  var first = !save.sdex[sid];
  save.sdex[sid] = (save.sdex[sid] || 0) + 1;
  return first;
}

function spawnVisitor(slotIdx, rid){
  var r = residentById(rid);
  if (!r) return null;
  var v = {
    slot: slotIdx, rid: rid, age: 0,
    stay: (25 + Math.random()*35) * stayFactor(),
    state: 'in', stateT: 1.5 + Math.random()*2,
    greeted: false, leaveT: -1, bounce: 0.6, inkT: 0
  };
  visitors.push(v);
  potBounce[slotIdx] = 0.5;
  return v;
}

/* 滞在完了：ツボの消耗・産卵カウント */
function finishStay(slotIdx){
  var s = save.slots[slotIdx];
  if (!s.it) return null;
  s.stays++;
  s.wear++;
  var ev = null;
  if (s.it === 'tsubo' && !s.egg && s.stays >= 4 && s.wear < 9){
    s.egg = 1; ev = 'egg';
  }
  if (s.wear >= 9){
    s.it = null; s.wear = 0; s.stays = 0; s.egg = 0; s.patch = 1;
    ev = ev === 'egg' ? 'egg' : 'crumble';
  }
  return ev;
}
function hatchEgg(slotIdx){
  var s = save.slots[slotIdx];
  if (!s.egg) return false;
  s.egg = 0; s.stays = 0;
  save.hatched++;
  save.pearls += 20; save.totalP += 20;
  registerDex('akachan');
  return true;
}
function placeItem(slotIdx, type){
  var s = save.slots[slotIdx];
  var item = ITEMS[type];
  if (!item || s.it || save.pearls < item.price || slotIdx >= save.unlocked) return null;
  save.pearls -= item.price;
  var cycled = false;
  if (s.patch){ s.patch = 0; cycled = true; save.cycles++; save.pearls += 15; save.totalP += 15; }
  s.it = type; s.wear = 0; s.stays = 0; s.egg = 0;
  persist();
  return { cycled: cycled };
}

/* ---------- オフライン精算 ---------- */
function simOffline(elapsedSec, rnd){
  rnd = rnd || Math.random;
  elapsedSec = Math.min(MAX_OFFLINE, Math.max(0, elapsedSec));
  var report = { visits:{}, pearls:0, souvenirs:[], eggs:0, hatched:0, crumbled:[], present:0 };
  var boosted = boostActive(save.last + 1000) ? 1 : 0;
  if (save.boostUntil && save.boostUntil < Date.now()) save.boostUntil = 0;
  for (var i=0;i<save.unlocked;i++){
    var s = save.slots[i];
    if (!s.it || s.it === 'boost') continue;
    if (s.egg){
      // 留守中に卵がかえる
      if (elapsedSec > 40 && hatchEgg(i)){
        report.hatched++; report.pearls += 20;
      }
      continue;
    }
    var mean = ITEMS[s.it].mean * (boosted ? 0.75 : 1);
    var expected = elapsedSec / mean;
    var n = Math.floor(expected);
    if (rnd() < (expected - n)) n++;
    n = Math.min(20, n);
    for (var k=0;k<n;k++){
      if (!s.it) break;
      var r = pickResident(s.it, rnd);
      if (!r) break;
      registerDex(r.id);
      var gain = Math.max(1, Math.ceil(greetReward(r.star) / 2));
      save.pearls += gain; save.totalP += gain; save.totalG++;
      report.pearls += gain;
      report.visits[r.id] = (report.visits[r.id] || 0) + 1;
      if (rnd() < 0.10){
        var sv = SOUVENIRS[Math.floor(rnd()*SOUVENIRS.length)];
        registerSdex(sv.id);
        save.pearls += sv.val; save.totalP += sv.val;
        report.pearls += sv.val;
        report.souvenirs.push(sv.id);
      }
      var ev = finishStay(i);
      if (ev === 'egg'){
        report.eggs++;
        if (elapsedSec > 900 && hatchEgg(i)){ report.hatched++; report.pearls += 20; }
      } else if (ev === 'crumble'){
        report.crumbled.push(i);
      }
    }
    // 現在も遊びに来ている住民
    if (s.it && !s.egg && rnd() < 0.35 && elapsedSec > mean * 0.5){
      var r2 = pickResident(s.it, rnd);
      if (r2){ spawnVisitor(i, r2.id); report.present++; }
    }
  }
  persist();
  return report;
}
function buildReportLines(rep){
  var lines = [];
  var any = false;
  for (var rid in rep.visits){
    var r = residentById(rid);
    if (r){ lines.push(r.name + ' が ' + rep.visits[rid] + '回 あそびに来た'); any = true; }
  }
  if (rep.souvenirs.length){
    lines.push('おみやげを ' + rep.souvenirs.length + 'こ もらった'); any = true;
  }
  if (rep.eggs) { lines.push('ツボの中で 卵が育っていた…！'); any = true; }
  if (rep.hatched){ lines.push('あかちゃんダコが ' + rep.hatched + 'ひき 生まれた！'); any = true; }
  if (rep.crumbled.length){ lines.push('ツボが ' + rep.crumbled.length + 'こ 土に還った'); any = true; }
  if (rep.pearls){ lines.push('しんじゅ +' + rep.pearls); any = true; }
  if (rep.present){ lines.push('いま ' + rep.present + 'ひき あそびに来てる！'); any = true; }
  return any ? lines : null;
}

/* ---------- タップで挨拶 ---------- */
function greetVisitor(v){
  if (v.greeted) return;
  v.greeted = true;
  v.state = 'out'; v.stateT = 99;
  v.leaveT = 2.2;
  v.bounce = 0.55;
  var r = residentById(v.rid);
  var p = SLOT_POS[v.slot];
  var gain = greetReward(r.star);
  save.pearls += gain; save.totalP += gain; save.totalG++;
  var first = registerDex(v.rid);
  addFloat(p.x, p.y - 90*p.s, '+' + gain + ' しんじゅ', C.sand);
  burstBubbles(p.x, p.y - 60*p.s, 8);
  SFX.coin(); SFX.bubble();
  if (v.rid === 'sumio'){ v.inkT = 0.7; burstInk(p.x, p.y - 55*p.s); }
  if (first){
    SFX.chime();
    celebrate('mascot_joy', 'はじめまして！', [r.name + ' が図鑑にとうろく！', '「' + r.desc + '」']);
  }
  // おみやげ
  if (Math.random() < 0.18){
    var sv = SOUVENIRS[Math.floor(Math.random()*SOUVENIRS.length)];
    var sFirst = registerSdex(sv.id);
    save.pearls += sv.val; save.totalP += sv.val;
    addFloat(p.x, p.y - 116*p.s, sv.name + '！ +' + sv.val, C.coral);
    burstSparkle(p.x, p.y - 70*p.s, 10);
    SFX.spark();
    if (sFirst) toast('おみやげ図鑑に「' + sv.name + '」をとうろく！');
  }
  persist();
}

/* ---------- 毎フレーム更新 ---------- */
function update(dt){
  timeNow += dt;
  if (ui.titleSplashT > 0) ui.titleSplashT -= dt;
  var nowMs = Date.now();
  if (save.boostUntil && save.boostUntil < nowMs) { save.boostUntil = 0; toast('シーアシストIの効果が切れた'); }

  // 来客抽選
  if (!ui.panel || ui.panel === 'toastonly'){
    var boostMul = boostActive(nowMs) ? 0.5 : 1;
    for (var i=0;i<8;i++){
      if (!slotEligible(i)) continue;
      var mean = ITEMS[save.slots[i].it].mean * boostMul;
      if (Math.random() < dt / mean){
        var r = pickResident(save.slots[i].it);
        if (r){ spawnVisitor(i, r.id); SFX.purun(); burstBubbles(SLOT_POS[i].x, SLOT_POS[i].y - 40, 5); }
      }
    }
  }

  // 訪問者更新
  for (var vi=visitors.length-1; vi>=0; vi--){
    var v = visitors[vi];
    v.age += dt;
    if (v.bounce > 0) v.bounce -= dt;
    if (v.inkT > 0) v.inkT -= dt;
    if (v.leaveT >= 0){
      v.leaveT -= dt;
      if (v.leaveT <= 0){
        var pp = SLOT_POS[v.slot];
        burstBubbles(pp.x, pp.y - 50*pp.s, 10);
        SFX.pop();
        var ev = finishStay(v.slot);
        handleStayEvent(v.slot, ev);
        visitors.splice(vi,1);
        persist();
        continue;
      }
    } else {
      v.stateT -= dt;
      if (v.stateT <= 0){
        v.state = (v.state === 'in') ? (Math.random()<0.6 ? 'peek' : 'out')
                : (v.state === 'peek') ? (Math.random()<0.5 ? 'out' : 'in') : 'peek';
        v.stateT = 2.5 + Math.random()*3.5;
        if (v.rid === 'bibiri' && Math.random()<0.5){ v.state='in'; }
        potBounce[v.slot] = Math.max(potBounce[v.slot], 0.3);
      }
      if (v.age > v.stay){
        // 挨拶されないまま帰る
        var p2 = SLOT_POS[v.slot];
        burstBubbles(p2.x, p2.y - 40*p2.s, 6);
        var ev2 = finishStay(v.slot);
        handleStayEvent(v.slot, ev2);
        visitors.splice(vi,1);
        persist();
        continue;
      }
    }
  }

  // ツボ弾み
  for (var b=0;b<8;b++) if (potBounce[b] > 0) potBounce[b] -= dt;

  // パーティクル
  for (var pi=particles.length-1; pi>=0; pi--){
    var pt = particles[pi];
    pt.t += dt;
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    if (pt.kind==='sand') pt.vy += 160*dt;
    if (pt.kind==='bub') pt.vy -= 20*dt;
    if (pt.kind==='ink'){ pt.r += 8*dt; pt.vy -= 5*dt; }
    if (pt.t >= pt.life) particles.splice(pi,1);
  }
  for (var fi=floats.length-1; fi>=0; fi--){
    floats[fi].t += dt;
    if (floats[fi].t > 1.4) floats.splice(fi,1);
  }
  if (ui.toastT > 0) ui.toastT -= dt;
  eggSparkT += dt;

  // アンビエント
  updateAmbient(dt);
}
function handleStayEvent(slotIdx, ev){
  var p = SLOT_POS[slotIdx];
  if (ev === 'egg'){
    SFX.spark();
    burstSparkle(p.x, p.y - 40*p.s, 14);
    toast('ツボの中で卵が育ちはじめた…！');
  } else if (ev === 'crumble'){
    SFX.sand();
    burstSand(p.x, p.y - 20*p.s, 26);
    toast('ツボが土に還った。跡地に海藻が生えた');
    celebrate('mascot', '土に還ったよ', ['粘土製のツボは役目を終えると', '自然に還る。次のツボを置くと', '「じゅんかんボーナス」+15しんじゅ！']);
  }
}
function tapEgg(slotIdx){
  var s = save.slots[slotIdx];
  if (!s.egg) return;
  if (s.stays < 4) return;
  // タップで孵化（十分育っている）
  if (hatchEgg(slotIdx)){
    var p = SLOT_POS[slotIdx];
    burstSparkle(p.x, p.y - 60*p.s, 24);
    burstBubbles(p.x, p.y - 40*p.s, 12);
    SFX.chime(); SFX.spark();
    spawnVisitor(slotIdx, 'akachan');
    celebrate('mascot_joy', 'たんじょう！', ['あかちゃんダコが生まれた！', '産卵用タコツボはマダコの', '早期産卵を促す優れもの。+20しんじゅ']);
    persist();
  }
}

/* ---------- 次の来客ETA ---------- */
function nextEtaText(){
  var best = 0, n = 0;
  for (var i=0;i<8;i++){
    if (!slotEligible(i)) continue;
    var m = ITEMS[save.slots[i].it].mean;
    if (!best || m < best) best = m;
    n++;
  }
  if (!n) return null;
  var eff = best / n * (boostActive(Date.now()) ? 0.5 : 1);
  var min = Math.max(1, Math.round(eff / 60));
  return '〜' + min + '分';
}
/* ---------- アンビエント初期化・更新 ---------- */
function initAmbient(){
  var i;
  ambBubbles = [];
  for (i=0;i<18;i++) ambBubbles.push({ x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*2.6, sp:14+Math.random()*26, ph:Math.random()*7 });
  noctis = [];
  for (i=0;i<14;i++) noctis.push({ x:Math.random()*W, y:120+Math.random()*520, r:2+Math.random()*3.4, ph:Math.random()*7, sp:3+Math.random()*7, warm:Math.random()<0.5 });
  rays = [];
  for (i=0;i<4;i++) rays.push({ x:60+i*100+Math.random()*40, w:34+Math.random()*46, ph:Math.random()*7, tilt:-0.22-Math.random()*0.14 });
  seaweeds = [];
  for (i=0;i<9;i++){

    seaweeds.push({ x:20+Math.random()*(W-40), y: back? 455+Math.random()*14 : 660+Math.random()*30,
      h: back? 26+Math.random()*30 : 40+Math.random()*46, back:back, ph:Math.random()*7, n:2+Math.floor(Math.random()*3) });
  }
}
function updateAmbient(dt){
  var i;
  for (i=0;i<ambBubbles.length;i++){
    var b = ambBubbles[i];
    b.y -= b.sp*dt; b.x += Math.sin(timeNow*1.4 + b.ph)*10*dt;
    if (b.y < 90){ b.y = H - 60 - Math.random()*40; b.x = Math.random()*W; }
  }
  for (i=0;i<noctis.length;i++){
    var n = noctis[i];
    n.x += Math.sin(timeNow*0.4 + n.ph)*n.sp*dt;
    n.y += Math.cos(timeNow*0.3 + n.ph*1.3)*n.sp*0.6*dt;
    if (n.x < -10) n.x = W+10; if (n.x > W+10) n.x = -10;
  }
}

function drawSeaweedLayer(ctx, back){

    }

}
function drawAmbientFront(ctx){

  }

/* ---------- アイテム描画 ---------- */
function potSquash(i){
  var t = potBounce[i];
  if (t <= 0) return 0;

function drawTsubo(ctx, x, y, sc, wear, big, egg, slotIdx){

function drawStar(ctx, x, y, r){

function roundRect(ctx, x, y, w, h, r){

  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawOcto(ctx, x, y, sc, col, opts){
  // opts: {mode:'in'|'peek'|'out', greeted, rid, wob}
  var mode = opts.mode, wob = Math.sin(timeNow*3 + x*0.1)*2*sc;
  var dark = mix(col, C.navy, 0.5);
  ctx.save();
  ctx.translate(x, y + wob*0.4);
  if (mode === 'in'){
    // 目だけツボの口からのぞく
    drawEyes(ctx, 0, 0, 7*sc, opts);
    ctx.restore();
    return;
  }
  var lift = mode === 'peek' ? 12*sc : 26*sc;
  ctx.translate(0, -lift);
  // 足（out時は左右2本ずつツボのふちに）
  if (mode === 'out'){
    ctx.strokeStyle = col; ctx.lineWidth = 6*sc; ctx.lineCap='round';
    for (var L=0;L<4;L++){
      var side = L<2 ? -1 : 1;
      var off = (L%2) * 10 + 8;
      var wig = Math.sin(timeNow*4 + L*1.8)*4*sc;
      ctx.beginPath();
      ctx.moveTo(side*8*sc, 10*sc);
      ctx.bezierCurveTo(side*(off+8)*sc, (16)*sc, side*(off+14)*sc + wig, (26)*sc, side*(off+10)*sc + wig, (34)*sc);
      ctx.stroke();
      // 吸盤
      ctx.fillStyle = mix(col, C.white, 0.5);
      for (var q=0;q<3;q++){
        var t = 0.45 + q*0.2;
        var sx = side*(8 + (off+4)*t)*sc + wig*t;
        var sy = (10 + 25*t)*sc;
        ctx.beginPath(); ctx.arc(sx, sy, 1.8*sc, 0, Math.PI*2); ctx.fill();
      }
    }
  } else {
    // peek: 足1本だけチラ見せ
    ctx.strokeStyle = col; ctx.lineWidth = 5.5*sc; ctx.lineCap='round';
    var wig2 = Math.sin(timeNow*3.2)*5*sc;
    ctx.beginPath();
    ctx.moveTo(10*sc, 8*sc);
    ctx.bezierCurveTo(20*sc, 14*sc, (26+wig2)*sc, 22*sc, (22)*sc+wig2, 32*sc);
    ctx.stroke();
  }
  // 頭
  var g = ctx.createRadialGradient(-4*sc, -10*sc, 2*sc, 0, -4*sc, 22*sc);
  g.addColorStop(0, mix(col, C.white, 0.25));
  g.addColorStop(1, col);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-16*sc, 8*sc);
  ctx.bezierCurveTo(-20*sc, -16*sc, -10*sc, -24*sc, 0, -24*sc);
  ctx.bezierCurveTo(10*sc, -24*sc, 20*sc, -16*sc, 16*sc, 8*sc);
  ctx.bezierCurveTo(8*sc, 12*sc, -8*sc, 12*sc, -16*sc, 8*sc);
  ctx.closePath(); ctx.fill();
  // ほっぺ
  ctx.fillStyle = rgba(C.coral, 0.5);
  ctx.beginPath(); ctx.ellipse(-10*sc, -2*sc, 3.4*sc, 2.2*sc, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10*sc, -2*sc, 3.4*sc, 2.2*sc, 0, 0, Math.PI*2); ctx.fill();
  drawEyes(ctx, 0, -8*sc, 8*sc, opts);
  // 口
  ctx.strokeStyle = dark; ctx.lineWidth = 1.6*sc; ctx.lineCap='round';
  ctx.beginPath();
  if (opts.greeted){ ctx.arc(0, 0, 3.4*sc, 0.15*Math.PI, 0.85*Math.PI); }
  else { ctx.arc(0, 1.5*sc, 2*sc, 0.2*Math.PI, 0.8*Math.PI); }
  ctx.stroke();
  // 個性アクセサリ
  drawAccessory(ctx, sc, opts.rid, col, dark);
  ctx.restore();
}
function drawEyes(ctx, cx, cy, gap, opts){
  var sc = gap/8;
  var blink = (Math.sin(timeNow*1.7 + cx) > 0.97) ? 0.15 : 1;
  var rid = opts.rid || '';
  var er = (rid==='bibiri' ? 4.6 : 3.6)*sc;
  for (var s=-1;s<=1;s+=2){
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.ellipse(cx+s*gap*0.62, cy, er, er*blink, 0, 0, Math.PI*2); ctx.fill();
    if (blink > 0.5){
      ctx.fillStyle = C.navy;
      var px = (opts.greeted ? 0 : Math.sin(timeNow*0.9)*1.2*sc);
      ctx.beginPath(); ctx.arc(cx+s*gap*0.62+px, cy, er*0.52, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = C.white;
      ctx.beginPath(); ctx.arc(cx+s*gap*0.62+px+er*0.2, cy-er*0.2, er*0.18, 0, Math.PI*2); ctx.fill();
    }
  }
  if (opts.greeted){
    // よろこびマーク
    ctx.fillStyle = rgba(C.coral, 0.9);
    var hy = cy - 16*sc - Math.abs(Math.sin(timeNow*6))*4*sc;
    drawHeart(ctx, cx + 14*sc, hy, 4*sc);
  }
}

function drawFish(ctx, x, y, sc, col, kind, opts){
  // kind: 'blenny'(穴からにょろ) 'eel'(長い) 'trio'(3匹) 'rock'(ごつい) 'crab'
  var wob = Math.sin(timeNow*2.6 + x*0.13);
  ctx.save();
  ctx.translate(x, y);
  if (kind === 'trio'){
    for (var t=0;t<3;t++){
      var tx = (t-1)*22*sc, ty = -34*sc - t*14*sc + wob*4*sc*(t%2?1:-1);
      drawSmallFish(ctx, tx, ty, 10*sc, col, t%2? -1:1, opts);
    }
    ctx.restore();
    return;
  }
  if (kind === 'crab'){
    var lift2 = opts.mode==='in' ? 4*sc : 0;
    ctx.translate(26*sc, -2*sc + lift2);
    // 貝がら
    ctx.fillStyle = mix(C.sand, C.coral, 0.3);

    ctx.strokeStyle = mix(C.coral, C.navy, 0.4); ctx.lineWidth=1.4*sc;
    ctx.beginPath(); ctx.arc(0, -8*sc, 6.5*sc, Math.PI, Math.PI*2); ctx.stroke();
    if (opts.mode!=='in'){
      // 体とハサミ
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(-9*sc, -6*sc, 6*sc, 5*sc, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2.6*sc; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-12*sc,-3*sc); ctx.lineTo((-17+wob)*sc, 0); ctx.stroke();
      drawEyes(ctx, -9*sc, -9*sc, 4.4*sc, opts);
    }
    ctx.restore();
    return;
  }
  // 穴から出る系（blenny/eel/rock）
  var out = opts.mode === 'in' ? 8 : opts.mode === 'peek' ? 20 : 34;
  var hx = kind==='eel' ? -2*sc : 2*sc;
  var hy = kind==='rock' ? -26*sc : -24*sc;
  ctx.translate(hx, hy);
  var len = out*sc, bodyW = (kind==='eel'?7:kind==='rock'?12:6)*sc;
  ctx.strokeStyle = col;
  ctx.lineWidth = bodyW*2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 6*sc);
  ctx.bezierCurveTo(wob*3*sc, -len*0.4, -wob*3*sc, -len*0.7, wob*2*sc, -len);
  ctx.stroke();
  // 顔
  var fy = -len + wob*2*sc;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(wob*2*sc, fy, bodyW*1.15, 0, Math.PI*2); ctx.fill();
  if (kind === 'rock'){
    // 背びれトゲ
    ctx.fillStyle = mix(col, C.navy, 0.35);
    for (var sp2=0; sp2<3; sp2++){
      ctx.beginPath();
      ctx.moveTo(wob*2*sc - bodyW + sp2*bodyW*0.8, fy - bodyW*0.9);
      ctx.lineTo(wob*2*sc - bodyW + sp2*bodyW*0.8 + 3*sc, fy - bodyW*1.9);
      ctx.lineTo(wob*2*sc - bodyW + sp2*bodyW*0.8 + 6*sc, fy - bodyW*0.9);
      ctx.closePath(); ctx.fill();
    }
  }
  drawEyes(ctx, wob*2*sc, fy - 1*sc, bodyW*0.75, opts);
  ctx.restore();
}
function drawSmallFish(ctx, x, y, s, col, dir, opts){

  ctx.beginPath();

  ctx.lineTo(-s*1.5, s*0.5 + flap*s);

  roundRect(ctx, px, py, pw, ph, 18); ctx.stroke();
  if (imgs.mascot && imgs.mascot.complete && imgs.mascot.naturalWidth){
    ctx.drawImage(imgs.mascot, W/2-40, py-58, 80, 80);
  }
  ctx.fillStyle = C.sand;
  ctx.font='bold 17px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('るすの間に…', W/2, py+40);
  ctx.font='13px sans-serif';
  ctx.fillStyle = C.white;
  for (var i=0;i<reportLines.length && i<11;i++){
    ctx.fillText(reportLines[i], W/2, py+76+i*24);
  }
  ctx.fillStyle = rgba(C.aqua,0.85);
  ctx.font='bold 12px sans-serif';
  ctx.fillText('タップでとじる', W/2, py+ph-22);
}
var TUT_STEPS = [
  { t:'ようこそ タコツボ横丁へ！', b:'ここは夕暮れの大阪湾。粘土でできた\n「産卵用タコツボ」をならべて、\n自分だけの横丁をつくろう。' },
  { t:'ツボをおいて、まつだけ', b:'空きスロットをタップしてツボを設置。\n時間がたつと、タコや魚がぞくぞく入居！\nゲームを閉じていても遊びに来るよ。' },
  { t:'あいさつでしんじゅGET', b:'来客をタップしてあいさつすると\nしんじゅがもらえる。ためて横丁を拡張！\nツボはいつか土に還る。それも海のめぐみ。' }
];
function drawTutorial(ctx){
  var st = TUT_STEPS[ui.tutStep];
  if (!st){ ui.panel=null; save.tut=1; persist(); return; }
  ctx.fillStyle = 'rgba(7,20,34,0.8)';
  ctx.fillRect(0,0,W,H);
  var pw=330, ph=250, px=(W-pw)/2, py=(H-ph)/2;
  ctx.fillStyle = C.navy;
  roundRect(ctx, px, py, pw, ph, 18); ctx.fill();
  ctx.strokeStyle = C.aqua; ctx.lineWidth=2;
  roundRect(ctx, px, py, pw, ph, 18); ctx.stroke();
  if (ui.tutStep === 0 && imgs.game_logo_tako && imgs.game_logo_tako.complete && imgs.game_logo_tako.naturalWidth){
    var logoW=340, logoH=logoW*imgs.game_logo_tako.naturalHeight/imgs.game_logo_tako.naturalWidth;
    ctx.drawImage(imgs.game_logo_tako, (W-logoW)/2, 48, logoW, logoH);
  }
  if (imgs.mascot && imgs.mascot.complete && imgs.mascot.naturalWidth){
    ctx.drawImage(imgs.mascot, W/2-45, py-70, 90, 90);
  }
  ctx.fillStyle = C.aqua;
  ctx.font='bold 17px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(st.t, W/2, py+42);
  ctx.fillStyle = C.white; ctx.font='13.5px sans-serif';
  var lines = st.b.split('\n');
  for (var i=0;i<lines.length;i++) ctx.fillText(lines[i], W/2, py+86+i*24);
  // ステップドット
  for (var d=0;d<3;d++){
    ctx.fillStyle = d===ui.tutStep ? C.aqua : rgba(C.white,0.25);
    ctx.beginPath(); ctx.arc(W/2-24+d*24, py+ph-58, 5, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = C.sand; ctx.font='bold 13px sans-serif';
  ctx.fillText(ui.tutStep<2 ? 'タップでつぎへ' : 'タップではじめる！', W/2, py+ph-26);
  addHit(0,0,W,H,function(){
    SFX.bubble();
    ui.tutStep++;
    if (ui.tutStep >= 3){ ui.panel=null; save.tut=1; persist(); }
  });
}
function drawTitleSplash(ctx){
  if (ui.titleSplashT <= 0 || !imgs.game_logo_tako || !imgs.game_logo_tako.complete || !imgs.game_logo_tako.naturalWidth) return;
  var alpha=Math.min(1, (4.5-ui.titleSplashT)/0.4, ui.titleSplashT/0.7);
  var logoW=340, logoH=logoW*imgs.game_logo_tako.naturalHeight/imgs.game_logo_tako.naturalWidth;
  ctx.save(); ctx.globalAlpha=Math.max(0,alpha);
  ctx.fillStyle='rgba(7,20,34,0.76)';
  roundRect(ctx, 24, 56, W-48, 116, 20); ctx.fill();
  ctx.strokeStyle=rgba(C.aqua,0.4); ctx.lineWidth=1.5;
  roundRect(ctx, 24, 56, W-48, 116, 20); ctx.stroke();
  ctx.drawImage(imgs.game_logo_tako, (W-logoW)/2, 65, logoW, logoH);
  ctx.restore();
}
function drawCelebrate(ctx){
  var c = celebrateQ[0];
  if (!c){ return; }
  ctx.fillStyle = 'rgba(7,20,34,0.72)';
  ctx.fillRect(0,0,W,H);
  var pw=320, ph=210, px=(W-pw)/2, py=(H-ph)/2;
  ctx.fillStyle = C.navy;
  roundRect(ctx, px, py, pw, ph, 18); ctx.fill();
  ctx.strokeStyle = C.sand; ctx.lineWidth=2.5;
  roundRect(ctx, px, py, pw, ph, 18); ctx.stroke();
  var im = imgs[c.img];
  if (im && im.complete && im.naturalWidth){
    var bob = Math.sin(timeNow*4)*5;
    ctx.drawImage(im, W/2-50, py-84+bob, 100, 100);
  }
  ctx.fillStyle = C.sand;
  ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(c.title, W/2, py+42);
  ctx.fillStyle = C.white; ctx.font='13px sans-serif';
  for (var i=0;i<c.lines.length;i++) ctx.fillText(c.lines[i], W/2, py+78+i*22);
  ctx.fillStyle = rgba(C.aqua,0.85); ctx.font='bold 12px sans-serif';
  ctx.fillText('タップでとじる', W/2, py+ph-20);
  addHit(0,0,W,H,function(){ SFX.pop(); celebrateQ.shift(); });
}

/* ---------- 引き継ぎコードUI ---------- */
function openCodeBox(mode){
  var ov = document.getElementById('codeOv');
  var ta = document.getElementById('codeTa');
  var title = document.getElementById('codeTitle');
  var msg = document.getElementById('codeMsg');
  var loadBtn = document.getElementById('codeLoad');
  var copyBtn = document.getElementById('codeCopy');
  ov.style.display = 'flex';
  msg.textContent = '';
  if (mode === 'export'){
    title.textContent = '引き継ぎコード（コピーして保管）';
    persist();
    ta.value = makeCode(save);
    ta.readOnly = true;
    loadBtn.style.display = 'none';
    copyBtn.style.display = '';
  } else {
    title.textContent = 'コードをはりつけて「よみこむ」';
    ta.value = '';
    ta.readOnly = false;
    loadBtn.style.display = '';
    copyBtn.style.display = 'none';
  }
}
function setupCodeBox(){
  document.getElementById('codeClose').addEventListener('click', function(){
    document.getElementById('codeOv').style.display = 'none';
  });
  document.getElementById('codeCopy').addEventListener('click', function(){
    var ta = document.getElementById('codeTa');
    ta.select(); ta.setSelectionRange(0, 99999);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    if (!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value); ok = true; }
    document.getElementById('codeMsg').textContent = ok ? 'コピーした！' : '長押しでコピーしてね';
  });
  document.getElementById('codeLoad').addEventListener('click', function(){
    var val = document.getElementById('codeTa').value;
    var obj = parseCode(val);
    var msg = document.getElementById('codeMsg');
    if (!obj){
      msg.textContent = 'コードが正しくないみたい…（チェックサム不一致）';
      celebrate('mascot_sad', 'よみこめない…', ['コードをもう一度確認してみて。', '空白や改行が混ざってないかな？']);
      SFX.deny();
      return;
    }
    save = normalizeSave(obj);
    visitors = []; particles = []; floats = [];
    applyMute(); persist();
    msg.textContent = 'よみこみ成功！';
    SFX.chime();
    document.getElementById('codeOv').style.display = 'none';
    toast('データを引き継いだ！');
  });
}

/* ---------- シーン描画 ---------- */
function drawScene(ctx){
  drawBackground(ctx);
  // 奥の列（スロット4-7）→手前の列（0-3）の順に描画
  var order = [4,5,6,7,0,1,2,3];
  for (var oi=0; oi<order.length; oi++){
    var i = order[oi];
    if (oi === 4) drawSeaweedLayer(ctx, false); // 手前の海藻を列の間に
    var p = SLOT_POS[i], s = save.slots[i];
    var locked = i >= save.unlocked;
    if (locked){
      drawEmptySlot(ctx, p.x, p.y, p.s, true, SLOT_PRICES[i], false);
    } else if (!s.it){
      if (s.patch) drawPatch(ctx, p.x, p.y, p.s);
      drawEmptySlot(ctx, p.x, p.y, p.s, false, 0, !!ui.placing);
    } else {
      if (s.it === 'tsubo') drawTsubo(ctx, p.x, p.y, p.s, s.wear, false, s.egg, i);
      else if (s.it === 'otsubo') drawTsubo(ctx, p.x, p.y, p.s, s.wear, true, 0, i);
      else if (s.it === 'kawara') drawKawara(ctx, p.x, p.y, p.s, i);
      else if (s.it === 'cerapola') drawCerapola(ctx, p.x, p.y, p.s, i);
    }
    // このスロットの訪問者
    for (var vi=0; vi<visitors.length; vi++){
      if (visitors[vi].slot === i) drawVisitor(ctx, visitors[vi]);
    }
    // タップ領域
    (function(idx){
      var pp = SLOT_POS[idx];
      addHit(pp.x-52*pp.s, pp.y-120*pp.s, 104*pp.s, 140*pp.s, function(){ tapSlot(idx); });
    })(i);
  }
  drawParticles(ctx);
  drawAmbientFront(ctx);
  drawFloats(ctx);
}
function tapSlot(i){
  var s = save.slots[i];
  var p = SLOT_POS[i];
  if (i >= save.unlocked){
    // スロット購入
    if (i !== save.unlocked){ toast('まずは手前の売地から！'); SFX.deny(); return; }
    var price = SLOT_PRICES[i];
    if (save.pearls < price){ toast('しんじゅが足りない…（' + price + '必要）'); SFX.deny(); return; }
    save.pearls -= price;
    save.unlocked++;
    burstSand(p.x, p.y, 16); burstBubbles(p.x, p.y-20, 8);
    SFX.buy(); SFX.chime();
    toast('横丁が広くなった！');
    persist();
    return;
  }
  // 配置モード
  if (ui.placing){
    if (!s.it){
      var res = placeItem(i, ui.placing);
      if (res){
        potBounce[i] = 0.6;
        burstBubbles(p.x, p.y-30*p.s, 10);
        SFX.purun();
        if (res.cycled){
          burstSparkle(p.x, p.y-40*p.s, 18);
          SFX.chime();
          addFloat(p.x, p.y-80*p.s, 'じゅんかんボーナス +15', C.green);
          toast('土に還った場所に新しい命！ +15しんじゅ');
        }
      } else { SFX.deny(); toast('ここにはおけない…'); }
    } else { SFX.deny(); toast('ここはもう埋まってる'); }
    ui.placing = null;
    return;
  }
  // 訪問者タップ
  for (var vi=0; vi<visitors.length; vi++){
    if (visitors[vi].slot === i && !visitors[vi].greeted){
      greetVisitor(visitors[vi]);
      return;
    }
  }
  // 卵タップ
  if (s.egg){ tapEgg(i); return; }
  // 空きスロット→ショップ
  if (!s.it){ SFX.pop(); ui.panel = 'shop'; return; }
  // アイテムだけ→ぷるん
  potBounce[i] = 0.4;
  burstBubbles(p.x, p.y-30*p.s, 4);
  SFX.purun();
}

/* ---------- メインループ ---------- */
var cv = null, ctx = null, lastT = 0, paused = false;
var imgs = {};
function loop(ts){
  requestAnimationFrame(loop);
  if (paused) { lastT = ts; return; }
  var dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016);
  lastT = ts;
  update(dt);
  hits = [];
  ctx.save();
  ctx.setTransform(view.dpr*view.scale, 0, 0, view.dpr*view.scale, view.ox*view.dpr, view.oy*view.dpr);
  drawScene(ctx);
  drawHUD(ctx);
  if (celebrateQ.length) drawCelebrate(ctx);
  else if (ui.panel === 'shop') drawShop(ctx);
  else if (ui.panel === 'dex') drawDex(ctx);
  else if (ui.panel === 'settings') drawSettings(ctx);
  else if (ui.panel === 'confirm') drawConfirm(ctx);
  else if (ui.panel === 'report') drawReport(ctx);
  else if (ui.panel === 'tutorial') drawTutorial(ctx);
  else drawTitleSplash(ctx);
  ctx.restore();
}

/* ---------- キャンバスフィット ---------- */
var view = { scale:1, ox:0, oy:0, dpr:1 };
function fit(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  var scale = Math.min(vw / W, vh / H);
  var cw = Math.round(W*scale), chh = Math.round(H*scale);
  cv.width = Math.round(cw*dpr); cv.height = Math.round(chh*dpr);
  cv.style.width = cw + 'px'; cv.style.height = chh + 'px';
  view.dpr = dpr; view.scale = scale; view.ox = 0; view.oy = 0;
  // ボタンをキャンバスの角に合わせる
  var rect = cv.getBoundingClientRect();
  var back = document.getElementById('backBtn');
  var mute = document.getElementById('muteBtn');
  back.style.left = Math.max(6, rect.left+8) + 'px';
  back.style.top = Math.max(6, rect.top+8) + 'px';
  mute.style.right = Math.max(6, vw-rect.right+8) + 'px';
  mute.style.top = Math.max(6, rect.top+8) + 'px';
}
function toLogical(e){
  var rect = cv.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / view.scale,
    y: (e.clientY - rect.top) / view.scale
  };
}
function onPointerDown(e){
  e.preventDefault();
  initAudio();
  if (ac && ac.state === 'suspended') ac.resume();
  var pt = toLogical(e);
  // 後に追加された（＝上に描かれた）領域を優先
  for (var i=hits.length-1; i>=0; i--){
    var h = hits[i];
    if (pt.x >= h.x && pt.x <= h.x+h.w && pt.y >= h.y && pt.y <= h.y+h.h){
      h.fn();
      return;
    }
  }
  if (ui.placing){ ui.placing = null; toast('配置を中止した'); }
}

/* ---------- 起動 ---------- */
function boot(){
  cv = document.getElementById('cv');
  ctx = cv.getContext('2d');
  var names = ['mascot','mascot_joy','mascot_sad','game_logo_tako'];
  for (var i=0;i<names.length;i++){
    imgs[names[i]] = new Image();
    imgs[names[i]].src = 'assets/' + names[i] + '.png';
  }
  var had = loadSaveFromStorage();
  initAmbient();
  applyMute();
  setupCodeBox();
  if (!had || !save.tut){
    ui.panel = 'tutorial'; ui.tutStep = 0;
  } else {
    var elapsed = (Date.now() - (save.last || Date.now())) / 1000;
    if (elapsed > 90){
      var rep = simOffline(elapsed);
      reportLines = buildReportLines(rep);
      if (reportLines) ui.panel = 'report';
    }
  }
  persist();
  fit();
  window.addEventListener('resize', fit);
  cv.addEventListener('pointerdown', onPointerDown);
  document.getElementById('muteBtn').addEventListener('click', function(){
    initAudio();
    save.mute = !save.mute; applyMute(); persist();
    if (!save.mute) SFX.pop();
  });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      paused = true;
      persist();
      if (ac){ try{ ac.suspend(); }catch(e){} }
    } else {
      paused = false;
      if (ac){ try{ ac.resume(); }catch(e){} }
      var elapsed = (Date.now() - (save.last || Date.now())) / 1000;
      if (elapsed > 90){
        var rep = simOffline(elapsed);
        reportLines = buildReportLines(rep);
        if (reportLines && !celebrateQ.length && ui.panel !== 'tutorial') ui.panel = 'report';
      }
    }
  });
  requestAnimationFrame(loop);
}

/* ---------- テストフック ---------- */
if (typeof window !== 'undefined'){
  window.ReefTest = {
    makeCode: makeCode,
    parseCode: parseCode,
    checksum: checksum,
    defaultSave: defaultSave,
    normalizeSave: normalizeSave,
    simOffline: simOffline,
    buildReportLines: buildReportLines,
    pickResident: pickResident,
    placeItem: placeItem,
    finishStay: finishStay,
    hatchEgg: hatchEgg,
    greetReward: greetReward,
    RESIDENTS: RESIDENTS,
    SOUVENIRS: SOUVENIRS,
    ITEMS: ITEMS,
    getSave: function(){ return save; },
    setSave: function(sv){ save = normalizeSave(sv); },
    getVisitors: function(){ return visitors; },
    spawnVisitor: spawnVisitor,
    update: update
  };
}
if (!IS_TEST) boot();

})();
</script>
